<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <linearGradient id="d2-center" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-d2" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="60" fill="#020617"/>

  <!-- Circuit trace divider with branching paths -->
  <!-- Main horizontal -->
  <line x1="0" y1="30" x2="900" y2="30" stroke="url(#d2-center)" stroke-width="1" opacity="0.6"/>

  <!-- Left circuit traces -->
  <path d="M 100 30 L 100 20 L 160 20" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 30 L 100 40 L 160 40" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 250 30 L 250 18 L 320 18" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Right circuit traces -->
  <path d="M 800 30 L 800 20 L 740 20" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;5" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 800 30 L 800 40 L 740 40" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;5" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 650 30 L 650 18 L 580 18" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;5" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- Circuit nodes -->
  <rect x="98" y="28" width="4" height="4" fill="#3B82F6" opacity="0.7" rx="0.5"/>
  <rect x="248" y="28" width="4" height="4" fill="#8B5CF6" opacity="0.6" rx="0.5"/>
  <rect x="798" y="28" width="4" height="4" fill="#3B82F6" opacity="0.7" rx="0.5"/>
  <rect x="648" y="28" width="4" height="4" fill="#8B5CF6" opacity="0.6" rx="0.5"/>

  <!-- Center diamond -->
  <polygon points="450,22 460,30 450,38 440,30" fill="none" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glow-d2)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="450,26 456,30 450,34 444,30" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </polygon>

  <!-- Traveling energy pulses left and right from center -->
  <circle r="2" fill="#8B5CF6" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 450 30 L 0 30"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#8B5CF6" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 450 30 L 900 30"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Section label: EXPERIENCE -->
  <text x="450" y="12" fill="#4B5563" font-family="'SF Pro Display', -apple-system, monospace" font-size="8" letter-spacing="5" text-anchor="middle" opacity="0.6">CIRCUIT</text>
</svg>
