<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="cp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/><stop offset="100%" stop-color="#060C1A"/>
    </linearGradient>
    <linearGradient id="cp-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <filter id="cp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="80" rx="6" fill="url(#cp-bg)"/>
  <rect width="200" height="80" rx="6" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="1.5" rx="1" fill="url(#cp-top)" opacity="0.7"/>
  <!-- Animated border glow -->
  <rect width="200" height="80" rx="6" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Globe icon -->
  <circle cx="24" cy="32" r="10" fill="none" stroke="#4F8FFF" stroke-width="1.2" opacity="0.7" filter="url(#cp-glow)"/>
  <ellipse cx="24" cy="32" rx="5" ry="10" fill="none" stroke="#4F8FFF" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="32" x2="34" y2="32" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Text -->
  <text x="42" y="30" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12" font-weight="600">Portfolio</text>
  <text x="42" y="44" fill="#7B8DB0" font-family="monospace" font-size="8">vishnu-ai-portfolio</text>
  <!-- Arrow -->
  <text x="184" y="34" text-anchor="middle" fill="#4F8FFF" font-size="13" opacity="0.6">→</text>
  <!-- Bottom label -->
  <text x="100" y="68" text-anchor="middle" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1" opacity="0.45">WEBSITE</text>
</svg>
