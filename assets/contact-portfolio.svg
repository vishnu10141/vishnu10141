<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="cc-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.4"/>
    </pattern>
    <linearGradient id="cc-card-portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shimmer-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="220" height="180" fill="url(#cc-bg)"/>
  <rect width="220" height="180" fill="url(#cc-dots)" opacity="0.5"/>
  <g transform="translate(12, 20)">
    <rect x="0" y="0" width="196" height="140" rx="8" fill="url(#cc-card-portfolio)" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="140" rx="8" fill="url(#shimmer-1)"/>
    <rect x="0" y="0" width="196" height="140" rx="8" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Icon: globe, centered at cy=38 within 36px bounding box -->
    <circle cx="98" cy="38" r="18" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="98" cy="38" rx="9" ry="18" fill="none" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
    <line x1="80" y1="38" x2="116" y2="38" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
    <circle cx="98" cy="38" r="3.5" fill="#3B82F6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="82" fill="#60A5FA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">Portfolio</text>
    <text x="98" y="98" fill="#1E3A5F" font-family="monospace" font-size="7.5" text-anchor="middle">vishnu-ai-portfolio</text>
    <line x1="20" y1="113" x2="176" y2="113" stroke="#1E3A5F" stroke-width="0.6" opacity="0.4"/>
    <text x="98" y="128" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">VISIT →</text>
  </g>
</svg>
