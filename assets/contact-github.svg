<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cg-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="cg-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
    <filter id="cg-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer background -->
  <rect width="220" height="180" fill="#050A12"/>

  <!-- Card body -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>

  <!-- Shimmer overlay -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="url(#cg-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-200,0;200,0;-200,0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle outer glow pulse -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="none" stroke="#8A5DFF" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="0.5;1.5;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent strip -->
  <rect x="10" y="10" width="60" height="1.5" rx="1" fill="url(#cg-accent-grad)"/>

  <!-- Icon circle bg -->
  <circle cx="110" cy="58" r="26" fill="#050A12" stroke="#8A5DFF" stroke-width="1" opacity="0.8"/>

  <!-- Octocat simplified icon -->
  <!-- Outer body circle -->
  <circle cx="110" cy="60" r="14" fill="none" stroke="#8A5DFF" stroke-width="1.2" opacity="0.8"/>
  <!-- Head circle (inner) -->
  <circle cx="110" cy="55" r="8" fill="#0A1120" stroke="#8A5DFF" stroke-width="1" opacity="0.8"/>
  <!-- Left ear -->
  <circle cx="101" cy="48" r="3" fill="#0A1120" stroke="#8A5DFF" stroke-width="1" opacity="0.7"/>
  <!-- Right ear -->
  <circle cx="119" cy="48" r="3" fill="#0A1120" stroke="#8A5DFF" stroke-width="1" opacity="0.7"/>
  <!-- Tentacle hints at bottom -->
  <path d="M103,70 Q106,74 110,72 Q114,74 117,70" fill="none" stroke="#8A5DFF" stroke-width="0.8" opacity="0.5"/>

  <!-- Pulse dot center -->
  <circle cx="110" cy="58" r="3" fill="#8A5DFF">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="110" y="100" text-anchor="middle" fill="#A78BFA" font-size="13" font-weight="600" font-family="'SF Pro Display',-apple-system,Inter,sans-serif">GitHub</text>

  <!-- Handle -->
  <text x="110" y="116" text-anchor="middle" fill="#3D4F70" font-size="8" font-family="monospace">@vishnu10141</text>

  <!-- Divider -->
  <line x1="30" y1="130" x2="190" y2="130" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- CTA -->
  <text x="110" y="152" text-anchor="middle" fill="#8A5DFF" font-size="8.5" font-family="monospace" font-weight="600" letter-spacing="1">FOLLOW →</text>

</svg>
