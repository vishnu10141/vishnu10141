<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>

    <!-- Name text gradient -->
    <linearGradient id="h-name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8D8F0"/>
    </linearGradient>

    <!-- Top accent bar gradient -->
    <linearGradient id="h-top-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>

    <!-- Role bar gradient -->
    <linearGradient id="h-role-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>

    <!-- Core hex radial gradient -->
    <radialGradient id="h-core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A5DFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#4F8FFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1A2540" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="h-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hex grid pattern for right panel -->
    <pattern id="h-hex-pat" patternUnits="userSpaceOnUse" width="34" height="30" x="506" y="0">
      <path d="M17 0 L34 8.7 L34 21.3 L17 30 L0 21.3 L0 8.7 Z" fill="none" stroke="#1A2540" stroke-width="0.35" opacity="0.25"/>
    </pattern>

    <!-- Dot grid pattern for left panel -->
    <pattern id="h-dot-pat" patternUnits="userSpaceOnUse" width="22" height="22">
      <circle r="0.5" cx="11" cy="11" fill="#1A2540" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#h-bg)"/>

  <!-- Dot grid — left panel -->
  <rect x="0" y="0" width="486" height="300" fill="url(#h-dot-pat)" opacity="1"/>

  <!-- Hex grid — right panel -->
  <rect x="486" y="0" width="414" height="300" fill="url(#h-hex-pat)" opacity="1"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="900" height="1" fill="url(#h-top-bar)" opacity="0.6"/>

  <!-- Bottom border -->
  <rect x="0" y="299" width="900" height="1" fill="#1A2540" opacity="0.4"/>

  <!-- Vertical separator -->
  <line x1="486" y1="16" x2="486" y2="284" stroke="#1A2540" stroke-width="0.8" opacity="0.5"/>

  <!-- Status indicator dot -->
  <circle cx="44" cy="40" r="3.5" fill="#00FFAE">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Status text -->
  <text x="56" y="44" fill="#00FFAE" font-family="monospace" font-size="9" letter-spacing="2.5" opacity="0.85">AVAILABLE FOR OPPORTUNITIES</text>

  <!-- Corner decoration -->
  <path d="M 40 56 L 40 68 L 52 68" fill="none" stroke="#1A2540" stroke-width="0.8" opacity="0.5"/>

  <!-- Name line 1: Vishnu -->
  <text x="40" y="106" fill="url(#h-name-grad)" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Vishnu</text>

  <!-- Name line 2: Nimmakayala -->
  <text x="40" y="168" fill="url(#h-name-grad)" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Nimmakayala</text>

  <!-- Accent bar -->
  <rect x="40" y="184" width="3" height="26" rx="1.5" fill="url(#h-role-bar)"/>

  <!-- Role text -->
  <text x="52" y="200" fill="#4F8FFF" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="0.3">AI Engineer · ML Researcher</text>

  <!-- Description line 1 -->
  <text x="40" y="226" fill="#7B8DB0" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12.5" letter-spacing="0.2">Deep learning systems from architecture design to</text>

  <!-- Description line 2 -->
  <text x="40" y="244" fill="#7B8DB0" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12.5" letter-spacing="0.2">production deployment. Medical imaging · Signal intelligence.</text>

  <!-- Monogram -->
  <text x="862" y="32" text-anchor="end" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1" opacity="0.35">V.NIMMAKAYALA</text>

  <!-- ═══ RIGHT PANEL — Neural Hex Processor ═══ -->

  <!-- Outer hex (r=88) -->
  <polygon points="798,150 754,73.7 666,73.7 622,150 666,226.3 754,226.3" fill="none" stroke="#1A2540" stroke-width="0.8" opacity="0.35"/>

  <!-- Corner ticks at outer hex vertices -->
  <path d="M749,73.7 L754,73.7 L754,79" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>
  <path d="M671,73.7 L666,73.7 L666,79" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>
  <path d="M749,226.3 L754,226.3 L754,221" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>
  <path d="M671,226.3 L666,226.3 L666,221" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>
  <path d="M798,145 L798,150" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>
  <path d="M622,145 L622,150" fill="none" stroke="#4F8FFF" stroke-width="0.7" opacity="0.3"/>

  <!-- Middle hex ring (r=62), dashed, slow clockwise rotation -->
  <polygon points="772,150 741,96.3 679,96.3 648,150 679,203.7 741,203.7" fill="none" stroke="#4F8FFF" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 710 150" to="360 710 150" dur="40s" repeatCount="indefinite"/>
  </polygon>

  <!-- 6 dashed trace lines from center to each node -->
  <line x1="710" y1="150" x2="772" y2="150" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>
  <line x1="710" y1="150" x2="741" y2="96.3" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>
  <line x1="710" y1="150" x2="679" y2="96.3" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>
  <line x1="710" y1="150" x2="648" y2="150" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>
  <line x1="710" y1="150" x2="679" y2="203.7" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>
  <line x1="710" y1="150" x2="741" y2="203.7" stroke="#4F8FFF" stroke-width="0.4" stroke-dasharray="2 6" opacity="0.15"/>

  <!-- 6 node dots at middle ring vertices (alternating blue/violet) -->
  <circle cx="772" cy="150" r="2.5" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow)"/>
  <circle cx="741" cy="96.3" r="2.5" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow)"/>
  <circle cx="679" cy="96.3" r="2.5" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow)"/>
  <circle cx="648" cy="150" r="2.5" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow)"/>
  <circle cx="679" cy="203.7" r="2.5" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow)"/>
  <circle cx="741" cy="203.7" r="2.5" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow)"/>

  <!-- Inner hex ring (r=40), counter-rotate -->
  <polygon points="750,150 730,115.4 690,115.4 670,150 690,184.6 730,184.6" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0.45">
    <animateTransform attributeName="transform" type="rotate" from="0 710 150" to="-360 710 150" dur="24s" repeatCount="indefinite"/>
  </polygon>

  <!-- Core hex (r=22) -->
  <polygon points="732,150 721,130.9 699,130.9 688,150 699,169.1 721,169.1" fill="url(#h-core-grad)" filter="url(#h-glow)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="4s" repeatCount="indefinite"/>
  </polygon>

  <!-- Core inner highlight (slightly smaller polygon) -->
  <polygon points="728,150 719,134.5 701,134.5 692,150 701,165.5 719,165.5" fill="#FFFFFF" opacity="0.06"/>

  <!-- Core dot -->
  <circle cx="710" cy="150" r="4" fill="#4F8FFF" opacity="0.9" filter="url(#h-glow)">
    <animate attributeName="r" values="4;5;4" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Core center white dot -->
  <circle cx="710" cy="150" r="1.8" fill="#FFFFFF" opacity="0.95"/>

  <!-- Traveling data pulse -->
  <circle r="1.8" fill="#00E6FF">
    <animateMotion dur="4s" repeatCount="indefinite" path="M710,150 L772,150"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Chip label -->
  <text x="800" y="148" fill="#3D4F70" font-family="monospace" font-size="7" opacity="0.4">AI.CORE</text>
  <text x="800" y="160" fill="#3D4F70" font-family="monospace" font-size="7" opacity="0.3">v2.0</text>
</svg>
