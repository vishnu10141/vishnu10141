<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1A"/><stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="h-name" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#C0D4F0"/>
    </linearGradient>
    <linearGradient id="h-role-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="h-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8A5DFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4F8FFF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="h-atmo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8FFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#8A5DFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#050A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-sphere" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#90B8FF" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#4F8FFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050A12" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="h-core-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#80B4FF"/>
      <stop offset="80%" stop-color="#4F8FFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8A5DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glow-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8FFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4F8FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-glow-xl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h-glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h-glow-md" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h-glow-s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="h-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.45" fill="#1A2540" opacity="0.4"/>
    </pattern>
    <pattern id="h-hex" x="0" y="0" width="34" height="29.4" patternUnits="userSpaceOnUse">
      <path d="M17,0 L34,8.5 L34,20.9 L17,29.4 L0,20.9 L0,8.5 Z" fill="none" stroke="#1A2540" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#h-bg)"/>
  <rect width="900" height="300" fill="url(#h-dots)"/>
  <!-- Hex pattern on right half only -->
  <rect x="486" y="0" width="414" height="300" fill="url(#h-hex)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="900" height="1" fill="url(#h-top)"/>
  <!-- Bottom border -->
  <rect x="0" y="299" width="900" height="1" fill="#1A2540" opacity="0.4"/>
  <!-- Vertical separator -->
  <line x1="486" y1="14" x2="486" y2="286" stroke="#1A2540" stroke-width="0.8" opacity="0.6"/>

  <!-- ═══════════════ LEFT PANEL ═══════════════ -->

  <!-- Corner bracket — top left -->
  <path d="M38,52 L38,64 L50,64" fill="none" stroke="#3D4F70" stroke-width="0.9" opacity="0.5"/>

  <!-- AVAILABLE badge -->
  <circle cx="44" cy="42" r="3.5" fill="#00FFAE" filter="url(#h-glow-s)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="46" fill="#00FFAE" font-family="monospace" font-size="9" letter-spacing="2.5" opacity="0.85">AVAILABLE FOR OPPORTUNITIES</text>

  <!-- Name: Vishnu -->
  <text x="40" y="108" fill="url(#h-name)" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Vishnu</text>

  <!-- Name: Nimmakayala -->
  <text x="40" y="170" fill="url(#h-name)" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">Nimmakayala</text>

  <!-- Role accent bar -->
  <rect x="40" y="184" width="3" height="26" rx="1.5" fill="url(#h-role-bar)"/>

  <!-- Role text -->
  <text x="52" y="200" fill="#4F8FFF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="14" font-weight="500" letter-spacing="0.3">ML Engineer · AI Developer</text>

  <!-- Description -->
  <text x="40" y="226" fill="#7B8DB0" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12.5" letter-spacing="0.2">Deep learning systems from architecture design to</text>
  <text x="40" y="244" fill="#7B8DB0" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12.5" letter-spacing="0.2">production deployment. Medical imaging · Signal intelligence.</text>

  <!-- Corner bracket — bottom right of text block -->
  <path d="M448,286 L448,274 L436,274" fill="none" stroke="#3D4F70" stroke-width="0.9" opacity="0.3"/>

  <!-- Monogram top right -->
  <text x="862" y="30" text-anchor="end" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1" opacity="0.3">V.NIMMAKAYALA</text>

  <!-- ═══════════════ RIGHT PANEL — AI CORE ═══════════════ -->
  <!-- Core center: cx=705, cy=150 -->

  <!-- Atmospheric glow (slow breathe) -->
  <ellipse cx="705" cy="150" rx="128" ry="118" fill="url(#h-atmo)">
    <animate attributeName="rx" values="128;142;128" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="118;132;118" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── RING 1: Outer hexagon (r≈92), very slow CW rotation (70s) ── -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 705 150" to="360 705 150" dur="70s" repeatCount="indefinite"/>
    <!-- Hex outline -->
    <polygon points="797,150 751,70.6 659,70.6 613,150 659,229.4 751,229.4"
      fill="none" stroke="#1A2540" stroke-width="0.9" opacity="0.45"/>
    <!-- 6 vertex nodes -->
    <circle cx="797" cy="150" r="2.2" fill="#4F8FFF" opacity="0.35"/>
    <circle cx="751" cy="70.6" r="2.2" fill="#8A5DFF" opacity="0.35"/>
    <circle cx="659" cy="70.6" r="2.2" fill="#4F8FFF" opacity="0.35"/>
    <circle cx="613" cy="150" r="2.2" fill="#8A5DFF" opacity="0.35"/>
    <circle cx="659" cy="229.4" r="2.2" fill="#4F8FFF" opacity="0.35"/>
    <circle cx="751" cy="229.4" r="2.2" fill="#8A5DFF" opacity="0.35"/>
    <!-- Corner tick marks at outer vertices -->
    <line x1="797" y1="145" x2="797" y2="155" stroke="#4F8FFF" stroke-width="0.6" opacity="0.3"/>
    <line x1="613" y1="145" x2="613" y2="155" stroke="#4F8FFF" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- ── RING 2: Middle dashed ring (r≈66), CCW (28s) ── -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 705 150" to="-360 705 150" dur="28s" repeatCount="indefinite"/>
    <polygon points="771,150 738,93 672,93 639,150 672,207 738,207"
      fill="none" stroke="#4F8FFF" stroke-width="0.9" stroke-dasharray="5 12" opacity="0.38"/>
    <!-- Bright vertex dots on this ring -->
    <circle cx="771" cy="150" r="3" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow-s)"/>
    <circle cx="738" cy="93" r="3" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow-s)"/>
    <circle cx="672" cy="93" r="3" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow-s)"/>
    <circle cx="639" cy="150" r="3" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow-s)"/>
    <circle cx="672" cy="207" r="3" fill="#4F8FFF" opacity="0.55" filter="url(#h-glow-s)"/>
    <circle cx="738" cy="207" r="3" fill="#8A5DFF" opacity="0.55" filter="url(#h-glow-s)"/>
  </g>

  <!-- ── RING 3: Inner hex (r≈42), CW (16s) ── -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="30 705 150" to="390 705 150" dur="16s" repeatCount="indefinite"/>
    <polygon points="747,150 726,113.7 684,113.7 663,150 684,186.3 726,186.3"
      fill="none" stroke="#8A5DFF" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ── NEURAL TRACE LINES from center to middle-ring vertices ── -->
  <!-- animated dashoffset creates flowing effect -->
  <line x1="705" y1="150" x2="771" y2="150" stroke="#4F8FFF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.18">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <line x1="705" y1="150" x2="738" y2="93" stroke="#8A5DFF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="3.4s" repeatCount="indefinite"/>
  </line>
  <line x1="705" y1="150" x2="672" y2="93" stroke="#4F8FFF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="4.0s" repeatCount="indefinite"/>
  </line>
  <line x1="705" y1="150" x2="639" y2="150" stroke="#8A5DFF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="705" y1="150" x2="672" y2="207" stroke="#4F8FFF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="3.1s" repeatCount="indefinite"/>
  </line>
  <line x1="705" y1="150" x2="738" y2="207" stroke="#00E6FF" stroke-width="0.5" stroke-dasharray="3 9" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- ── TRAVELING DATA PULSES along trace lines ── -->
  <circle r="2.2" fill="#4F8FFF" filter="url(#h-glow-s)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M705,150 L771,150"/>
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="2.8s" repeatCount="indefinite" keyTimes="0;0.05;0.15;0.85;1"/>
  </circle>
  <circle r="2" fill="#8A5DFF" filter="url(#h-glow-s)">
    <animateMotion dur="3.4s" begin="0.5s" repeatCount="indefinite" path="M705,150 L738,93"/>
    <animate attributeName="opacity" values="0;0;0.75;0.75;0" dur="3.4s" begin="0.5s" repeatCount="indefinite" keyTimes="0;0.05;0.15;0.85;1"/>
  </circle>
  <circle r="2" fill="#00E6FF" filter="url(#h-glow-s)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M705,150 L738,207"/>
    <animate attributeName="opacity" values="0;0;0.75;0.75;0" dur="2.2s" begin="1.1s" repeatCount="indefinite" keyTimes="0;0.05;0.15;0.85;1"/>
  </circle>

  <!-- ── ORBITING PARTICLES ── -->
  <!-- Particle 1: blue, r=90, CW 8s -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 705 150" to="360 705 150" dur="8s" repeatCount="indefinite"/>
    <circle cx="795" cy="150" r="2.8" fill="#4F8FFF" opacity="0.75" filter="url(#h-glow-s)"/>
  </g>
  <!-- Particle 2: violet, r=90, CCW 12s -->
  <g><animateTransform attributeName="transform" type="rotate" from="180 705 150" to="-180 705 150" dur="12s" repeatCount="indefinite"/>
    <circle cx="795" cy="150" r="2" fill="#8A5DFF" opacity="0.65" filter="url(#h-glow-s)"/>
  </g>
  <!-- Particle 3: cyan, r=66, CW 5.5s -->
  <g><animateTransform attributeName="transform" type="rotate" from="90 705 150" to="450 705 150" dur="5.5s" repeatCount="indefinite"/>
    <circle cx="771" cy="150" r="2" fill="#00E6FF" opacity="0.7" filter="url(#h-glow-s)"/>
  </g>
  <!-- Particle 4: white, r=66, CCW 9s -->
  <g><animateTransform attributeName="transform" type="rotate" from="270 705 150" to="-90 705 150" dur="9s" repeatCount="indefinite"/>
    <circle cx="771" cy="150" r="1.6" fill="#FFFFFF" opacity="0.5" filter="url(#h-glow-s)"/>
  </g>
  <!-- Particle 5: blue, r=42, CW 4s -->
  <g><animateTransform attributeName="transform" type="rotate" from="60 705 150" to="420 705 150" dur="4s" repeatCount="indefinite"/>
    <circle cx="747" cy="150" r="1.6" fill="#4F8FFF" opacity="0.6" filter="url(#h-glow-s)"/>
  </g>
  <!-- Particle 6: green, r=42, CCW 6.5s -->
  <g><animateTransform attributeName="transform" type="rotate" from="240 705 150" to="-120 705 150" dur="6.5s" repeatCount="indefinite"/>
    <circle cx="747" cy="150" r="1.4" fill="#00FFAE" opacity="0.5" filter="url(#h-glow-s)"/>
  </g>

  <!-- ── INNER GLASS SPHERE (r=26) ── -->
  <circle cx="705" cy="150" r="26" fill="url(#h-sphere)" stroke="#4F8FFF" stroke-width="0.8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Highlight spot -->
  <ellipse cx="698" cy="143" rx="9" ry="5.5" fill="#FFFFFF" opacity="0.07"/>

  <!-- ── CORE GLOW (expanding ring) ── -->
  <circle cx="705" cy="150" r="16" fill="url(#h-glow-r)" filter="url(#h-glow-lg)">
    <animate attributeName="r" values="16;22;16" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── CORE MAIN ── -->
  <circle cx="705" cy="150" r="11" fill="url(#h-core-g)" filter="url(#h-glow-md)">
    <animate attributeName="r" values="11;13;11" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Core center dot -->
  <circle cx="705" cy="150" r="4" fill="#FFFFFF" opacity="0.96"/>

  <!-- Chip labels -->
  <text x="800" y="148" fill="#3D4F70" font-family="monospace" font-size="7" opacity="0.4">AI.CORE</text>
  <text x="800" y="159" fill="#3D4F70" font-family="monospace" font-size="7" opacity="0.3">v2.0</text>
</svg>
