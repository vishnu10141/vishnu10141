<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <!-- Blue accent gradient -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <!-- Purple accent gradient -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Core glow gradient -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- Core inner gradient -->
    <radialGradient id="core-inner" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Node pulse gradient -->
    <radialGradient id="node-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle left grid -->
    <pattern id="left-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Button gradient -->
    <linearGradient id="btn-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="particle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- Clip path for right panel -->
    <clipPath id="right-clip">
      <rect x="500" y="0" width="400" height="320"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg-grad)"/>
  <!-- Subtle grid on left -->
  <rect x="0" y="0" width="500" height="320" fill="url(#left-grid)" opacity="0.6"/>

  <!-- Left subtle vertical accent line -->
  <line x1="490" y1="0" x2="490" y2="320" stroke="#1E3A5F" stroke-width="1" opacity="0.5"/>

  <!-- ===================== LEFT CONTENT PANEL ===================== -->

  <!-- Status dot + label -->
  <circle cx="52" cy="50" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="63" y="54" fill="#64748B" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="11" letter-spacing="2">AVAILABLE FOR OPPORTUNITIES</text>

  <!-- Name -->
  <text x="48" y="118" fill="url(#name-grad)" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Vishnu</text>
  <text x="48" y="164" fill="url(#name-grad)" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">Nimmakayala</text>

  <!-- Title bar -->
  <rect x="48" y="178" width="3" height="22" fill="url(#blue-grad)" rx="1.5"/>
  <text x="60" y="194" fill="#60A5FA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">AI Engineer · ML Researcher</text>

  <!-- Description -->
  <text x="48" y="226" fill="#64748B" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12.5" letter-spacing="0.2">Deep learning systems from research to</text>
  <text x="48" y="244" fill="#64748B" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12.5" letter-spacing="0.2">deployment. Medical imaging. Signal intelligence.</text>

  <!-- CTA Buttons -->
  <!-- Portfolio button -->
  <g>
    <rect x="48" y="270" width="120" height="34" rx="6" fill="url(#btn-primary)"/>
    <text x="108" y="292" fill="#FFFFFF" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.3">Portfolio</text>
  </g>

  <!-- GitHub button -->
  <g>
    <rect x="180" y="270" width="120" height="34" rx="6" fill="none" stroke="#334155" stroke-width="1"/>
    <text x="240" y="292" fill="#94A3B8" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.3">GitHub</text>
  </g>

  <!-- ===================== RIGHT AI CORE ILLUSTRATION ===================== -->

  <!-- Background glow cloud behind core -->
  <ellipse cx="695" cy="160" rx="130" ry="110" fill="url(#core-glow)" opacity="0.7">
    <animate attributeName="rx" values="130;145;130" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="110;125;110" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Outer decorative ring - static tilted ellipse -->
  <ellipse cx="695" cy="160" rx="115" ry="35" fill="none" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.35" transform="rotate(-20 695 160)"/>

  <!-- Ring 3 - outermost animated -->
  <ellipse cx="695" cy="160" rx="108" ry="42" fill="none" stroke="url(#ring-grad-2)" stroke-width="1" opacity="0.5" transform="rotate(30 695 160)">
    <animateTransform attributeName="transform" type="rotate" from="30 695 160" to="390 695 160" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 2 - middle animated -->
  <ellipse cx="695" cy="160" rx="88" ry="34" fill="none" stroke="url(#ring-grad-1)" stroke-width="1.5" opacity="0.7" transform="rotate(-15 695 160)">
    <animateTransform attributeName="transform" type="rotate" from="-15 695 160" to="345 695 160" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 1 - inner animated opposite direction -->
  <ellipse cx="695" cy="160" rx="68" ry="28" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.6" transform="rotate(0 695 160)">
    <animateTransform attributeName="transform" type="rotate" from="0 695 160" to="-360 695 160" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Static horizontal equator ring -->
  <ellipse cx="695" cy="160" rx="92" ry="8" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3"/>

  <!-- Core sphere -->
  <circle cx="695" cy="160" r="44" fill="url(#core-inner)" filter="url(#soft-glow)"/>
  <!-- Core shine highlight -->
  <ellipse cx="683" cy="147" rx="14" ry="10" fill="#FFFFFF" opacity="0.12" transform="rotate(-25 683 147)"/>
  <!-- Core inner ring -->
  <circle cx="695" cy="160" r="44" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.6"/>

  <!-- Core center cross pattern -->
  <line x1="695" y1="145" x2="695" y2="175" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
  <line x1="680" y1="160" x2="710" y2="160" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
  <circle cx="695" cy="160" r="14" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>

  <!-- Pulsing core center -->
  <circle cx="695" cy="160" r="8" fill="#60A5FA" opacity="0.9">
    <animate attributeName="r" values="8;11;8" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="695" cy="160" r="4" fill="#FFFFFF" opacity="0.95"/>

  <!-- Orbiting node 1 (blue) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 695 160" to="360 695 160" dur="8s" repeatCount="indefinite"/>
    <circle cx="695" cy="72" r="6" fill="#3B82F6" filter="url(#glow-blue)" opacity="0.95"/>
    <circle cx="695" cy="72" r="10" fill="#3B82F6" opacity="0.15">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Connecting line to center -->
    <line x1="695" y1="72" x2="695" y2="116" stroke="#3B82F6" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Orbiting node 2 (purple) - offset rotation -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 695 160" to="480 695 160" dur="8s" repeatCount="indefinite"/>
    <circle cx="695" cy="72" r="5" fill="#8B5CF6" filter="url(#glow-blue)" opacity="0.9"/>
    <circle cx="695" cy="72" r="9" fill="#8B5CF6" opacity="0.12">
      <animate attributeName="r" values="9;14;9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="695" y1="72" x2="695" y2="116" stroke="#8B5CF6" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- Orbiting node 3 (cyan) - offset rotation -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 695 160" to="600 695 160" dur="8s" repeatCount="indefinite"/>
    <circle cx="695" cy="72" r="4" fill="#38BDF8" filter="url(#glow-blue)" opacity="0.85"/>
    <circle cx="695" cy="72" r="8" fill="#38BDF8" opacity="0.12">
      <animate attributeName="r" values="8;13;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="695" y1="72" x2="695" y2="116" stroke="#38BDF8" stroke-width="0.4" opacity="0.2"/>
  </g>

  <!-- Data particles floating around -->
  <!-- Particle 1 -->
  <circle cx="590" cy="100" r="2" fill="#3B82F6" opacity="0.7">
    <animate attributeName="cx" values="590;600;590" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Particle 2 -->
  <circle cx="800" cy="130" r="1.5" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="cx" values="800;808;800" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="130;122;130" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Particle 3 -->
  <circle cx="620" cy="220" r="2" fill="#38BDF8" opacity="0.5">
    <animate attributeName="cx" values="620;612;620" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;210;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- Particle 4 -->
  <circle cx="775" cy="210" r="1.5" fill="#60A5FA" opacity="0.6">
    <animate attributeName="cx" values="775;783;775" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;202;210" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Particle 5 -->
  <circle cx="555" cy="165" r="1.5" fill="#8B5CF6" opacity="0.5">
    <animate attributeName="cx" values="555;548;555" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="165;157;165" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Particle 6 -->
  <circle cx="840" cy="175" r="2" fill="#3B82F6" opacity="0.4">
    <animate attributeName="cy" values="175;185;175" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Connection lines from core to outer nodes -->
  <line x1="651" y1="160" x2="590" y2="100" stroke="#3B82F6" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="739" y1="160" x2="800" y2="130" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="660" y1="195" x2="620" y2="220" stroke="#38BDF8" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="730" y1="195" x2="775" y2="210" stroke="#60A5FA" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.8s" repeatCount="indefinite"/>
  </line>

  <!-- Signal traveling on ring -->
  <circle r="3" fill="#FFFFFF" opacity="0.8" filter="url(#glow-blue)">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#signal-path-1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <path id="signal-path-1" d="M 695 72 C 780 105 780 215 695 248 C 610 215 610 105 695 72" fill="none"/>

  <!-- ===================== BACKGROUND DECORATIVE ELEMENTS ===================== -->
  <!-- Right panel subtle dots grid -->
  <circle cx="540" cy="30" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="570" cy="30" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="540" cy="60" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="570" cy="60" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="845" cy="30" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="875" cy="30" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="845" cy="60" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="875" cy="60" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="845" cy="280" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="875" cy="280" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="845" cy="250" r="1" fill="#334155" opacity="0.4"/>
  <circle cx="875" cy="250" r="1" fill="#334155" opacity="0.4"/>

  <!-- Bottom border accent -->
  <rect x="0" y="314" width="900" height="1" fill="url(#blue-grad)" opacity="0.4"/>

  <!-- Small "VISHNU.AI" monogram top right -->
  <text x="850" y="30" fill="#334155" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="end" opacity="0.5">V.NIMMAKAYALA</text>
  <!-- Tiny coordinate label bottom right -->
  <text x="870" y="308" fill="#1E293B" font-family="monospace" font-size="8" opacity="0.4" text-anchor="end">AI ENGINEER</text>
</svg>
