  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.25s" fill="freeze"/>
    <rect x="684" y="176" width="48" height="20" rx="3" fill="#050A12" stroke="#7B8DB0" stroke-width="0.7"/>
    <text x="708" y="190" fill="#7B8DB0" font-family="monospace" font-size="8" text-anchor="middle">Next.js</text>
    <rect x="738" y="176" width="44" height="20" rx="3" fill="#050A12" stroke="#7B8DB0" stroke-width="0.7"/>
    <text x="760" y="190" fill="#7B8DB0" font-family="monospace" font-size="8" text-anchor="middle">Linux</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    <rect x="684" y="202" width="32" height="20" rx="3" fill="#050A12" stroke="#7B8DB0" stroke-width="0.7"/>
    <text x="700" y="216" fill="#7B8DB0" font-family="monospace" font-size="8" text-anchor="middle">Git</text>
    <rect x="722" y="202" width="46" height="20" rx="3" fill="#050A12" stroke="#7B8DB0" stroke-width="0.7"/>
    <text x="745" y="216" fill="#7B8DB0" font-family="monospace" font-size="8" text-anchor="middle">Vercel</text>
  </g>

  <!-- ── Traveling data signal across bottom ── -->
  <circle r="1.5" fill="#4F8FFF" opacity="0.5" filter="url(#sk-glow-s)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 40 258 L 860 258"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#8A5DFF" opacity="0.4" filter="url(#sk-glow-s)">
    <animateMotion dur="8s" begin="2.7s" repeatCount="indefinite" path="M 40 258 L 860 258"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="8s" begin="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#00E6FF" opacity="0.4" filter="url(#sk-glow-s)">
    <animateMotion dur="8s" begin="5.4s" repeatCount="indefinite" path="M 40 258 L 860 258"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="8s" begin="5.4s" repeatCount="indefinite"/>
  </circle>
</svg>
