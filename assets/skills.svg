<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C18"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="sk-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1628"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>
    <!-- Accent colors -->
    <linearGradient id="sk-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#3B6FD4"/>
    </linearGradient>
    <linearGradient id="sk-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#6B42DB"/>
    </linearGradient>
    <linearGradient id="sk-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E6FF"/>
      <stop offset="100%" stop-color="#00B8D4"/>
    </linearGradient>
    <linearGradient id="sk-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAE"/>
      <stop offset="100%" stop-color="#00C890"/>
    </linearGradient>
    <linearGradient id="sk-gray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B8DB0"/>
      <stop offset="100%" stop-color="#5A6A8A"/>
    </linearGradient>
    <!-- Subtle shimmer for grid -->
    <linearGradient id="sk-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="sk-glow-s" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip each row -->
    <clipPath id="sk-row1"><rect x="0" y="30" width="900" height="110"/></clipPath>
    <clipPath id="sk-row2"><rect x="0" y="146" width="900" height="110"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#sk-bg)"/>

  <!-- Very subtle dot-grid texture -->
  <pattern id="sk-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="0.5" fill="#1A2540" opacity="0.35"/>
  </pattern>
  <rect width="900" height="260" fill="url(#sk-dots)"/>

  <!-- Section header -->
  <text x="40" y="22" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="4" opacity="0.7">TECHNICAL ECOSYSTEM</text>
  <!-- Subtle horizontal separator under label -->
  <line x1="40" y1="28" x2="860" y2="28" stroke="#1A2540" stroke-width="0.5" opacity="0.4"/>

  <!-- ═══════════════════════════════════ -->
  <!--  ROW 1 — y=36, h=96               -->
  <!-- ═══════════════════════════════════ -->

  <!-- CARD 1: CORE LANGUAGE (x=40, #4F8FFF) -->
  <g opacity="0"><rect x="40" y="36" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8"/>
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
  </g>
  <rect x="40" y="36" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.1s" fill="freeze"/>
  </rect>
  <!-- Accent strip -->
  <rect x="40" y="36" width="0" height="2" rx="1" fill="url(#sk-blue)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.2s" fill="freeze"/>
  </rect>
  <!-- Card inner border glow (subtle, pulsing) -->
  <rect x="40" y="36" width="190" height="96" rx="6" fill="none" stroke="#4F8FFF" stroke-width="0.4" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="54" y="54" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">CORE LANGUAGE
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.4s" fill="freeze"/>
  </text>
  <!-- Pill: Python 3.11+ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.55s" fill="freeze"/>
    <rect x="54" y="62" width="84" height="20" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
    <text x="96" y="76" fill="#4F8FFF" font-family="monospace" font-size="8" text-anchor="middle">Python 3.11+</text>
  </g>
  <!-- Small star accent -->
  <circle cx="210" cy="56" r="1.5" fill="#4F8FFF" opacity="0.4" filter="url(#sk-glow-s)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- CARD 2: DEEP LEARNING (x=250, #8A5DFF) -->
  <rect x="250" y="36" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
  </rect>
  <rect x="250" y="36" width="0" height="2" rx="1" fill="url(#sk-violet)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="250" y="36" width="190" height="96" rx="6" fill="none" stroke="#8A5DFF" stroke-width="0.4" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4.5s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <text x="264" y="54" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">DEEP LEARNING
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.5s" fill="freeze"/>
  </text>
  <!-- Pills row 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.65s" fill="freeze"/>
    <rect x="264" y="62" width="52" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="290" y="76" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">PyTorch</text>
    <rect x="322" y="62" width="72" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="358" y="76" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">TensorFlow</text>
  </g>
  <!-- Pills row 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <rect x="264" y="88" width="46" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="287" y="102" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">MONAI</text>
  </g>

  <!-- CARD 3: COMPUTER VISION (x=460, #00E6FF) -->
  <rect x="460" y="36" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="460" y="36" width="0" height="2" rx="1" fill="url(#sk-cyan)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.4s" fill="freeze"/>
  </rect>
  <rect x="460" y="36" width="190" height="96" rx="6" fill="none" stroke="#00E6FF" stroke-width="0.4" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="5s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="474" y="54" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">COMPUTER VISION
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.6s" fill="freeze"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.75s" fill="freeze"/>
    <rect x="474" y="62" width="54" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="501" y="76" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">OpenCV</text>
    <rect x="534" y="62" width="72" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="570" y="76" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">Grad-CAM++</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    <rect x="474" y="88" width="32" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="490" y="102" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">PIL</text>
  </g>

  <!-- CARD 4: NLP (x=670, #8A5DFF) -->
  <rect x="670" y="36" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
  </rect>
  <rect x="670" y="36" width="0" height="2" rx="1" fill="url(#sk-violet)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.5s" fill="freeze"/>
  </rect>
  <rect x="670" y="36" width="190" height="96" rx="6" fill="none" stroke="#8A5DFF" stroke-width="0.4" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="5.5s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="684" y="54" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">NLP
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.7s" fill="freeze"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.85s" fill="freeze"/>
    <rect x="684" y="62" width="78" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="723" y="76" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">HuggingFace</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    <rect x="684" y="88" width="44" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="706" y="102" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">spaCy</text>
    <rect x="734" y="88" width="42" height="20" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="755" y="102" fill="#8A5DFF" font-family="monospace" font-size="8" text-anchor="middle">NLTK</text>
  </g>

  <!-- Row separator -->
  <line x1="40" y1="143" x2="860" y2="143" stroke="#1A2540" stroke-width="0.5" opacity="0.3"/>

  <!-- ═══════════════════════════════════ -->
  <!--  ROW 2 — y=150, h=96              -->
  <!-- ═══════════════════════════════════ -->

  <!-- CARD 5: MACHINE LEARNING (x=40, #4F8FFF) -->
  <rect x="40" y="150" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze"/>
  </rect>
  <rect x="40" y="150" width="0" height="2" rx="1" fill="url(#sk-blue)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.6s" fill="freeze"/>
  </rect>
  <rect x="40" y="150" width="190" height="96" rx="6" fill="none" stroke="#4F8FFF" stroke-width="0.4" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="4.2s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="54" y="168" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">MACHINE LEARNING
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.8s" fill="freeze"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.95s" fill="freeze"/>
    <rect x="54" y="176" width="72" height="20" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
    <text x="90" y="190" fill="#4F8FFF" font-family="monospace" font-size="8" text-anchor="middle">Scikit-learn</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <rect x="54" y="202" width="58" height="20" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
    <text x="83" y="216" fill="#4F8FFF" font-family="monospace" font-size="8" text-anchor="middle">XGBoost</text>
    <rect x="118" y="202" width="36" height="20" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
    <text x="136" y="216" fill="#4F8FFF" font-family="monospace" font-size="8" text-anchor="middle">SVM</text>
  </g>

  <!-- CARD 6: DATA (x=250, #00E6FF) -->
  <rect x="250" y="150" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
  </rect>
  <rect x="250" y="150" width="0" height="2" rx="1" fill="url(#sk-cyan)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.7s" fill="freeze"/>
  </rect>
  <rect x="250" y="150" width="190" height="96" rx="6" fill="none" stroke="#00E6FF" stroke-width="0.4" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="264" y="168" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">DATA
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.9s" fill="freeze"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.05s" fill="freeze"/>
    <rect x="264" y="176" width="48" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="288" y="190" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">NumPy</text>
    <rect x="318" y="176" width="52" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="344" y="190" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">Pandas</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    <rect x="264" y="202" width="72" height="20" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
    <text x="300" y="216" fill="#00E6FF" font-family="monospace" font-size="8" text-anchor="middle">Matplotlib</text>
  </g>

  <!-- CARD 7: DEPLOYMENT (x=460, #00FFAE) -->
  <rect x="460" y="150" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
  </rect>
  <rect x="460" y="150" width="0" height="2" rx="1" fill="url(#sk-green)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.8s" fill="freeze"/>
  </rect>
  <rect x="460" y="150" width="190" height="96" rx="6" fill="none" stroke="#00FFAE" stroke-width="0.4" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5.2s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="474" y="168" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">DEPLOYMENT
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="1.0s" fill="freeze"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.15s" fill="freeze"/>
    <rect x="474" y="176" width="52" height="20" rx="3" fill="#050A12" stroke="#00FFAE" stroke-width="0.7"/>
    <text x="500" y="190" fill="#00FFAE" font-family="monospace" font-size="8" text-anchor="middle">FastAPI</text>
    <rect x="532" y="176" width="66" height="20" rx="3" fill="#050A12" stroke="#00FFAE" stroke-width="0.7"/>
    <text x="565" y="190" fill="#00FFAE" font-family="monospace" font-size="8" text-anchor="middle">Streamlit</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <rect x="474" y="202" width="52" height="20" rx="3" fill="#050A12" stroke="#00FFAE" stroke-width="0.7"/>
    <text x="500" y="216" fill="#00FFAE" font-family="monospace" font-size="8" text-anchor="middle">Docker</text>
  </g>

  <!-- CARD 8: STACK (x=670, #7B8DB0) -->
  <rect x="670" y="150" width="190" height="96" rx="6" fill="url(#sk-card)" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
  </rect>
  <rect x="670" y="150" width="0" height="2" rx="1" fill="url(#sk-gray)">
    <animate attributeName="width" values="0;190" dur="0.6s" begin="0.9s" fill="freeze"/>
  </rect>
  <rect x="670" y="150" width="190" height="96" rx="6" fill="none" stroke="#7B8DB0" stroke-width="0.4" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="6.5s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="684" y="168" fill="#3D4F70" font-family="monospace" font-size="8" letter-spacing="1.5" opacity="0">STACK
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="1.1s" fill="freeze"/>
