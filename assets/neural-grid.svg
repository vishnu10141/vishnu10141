<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="ng-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#05101E"/>
    </linearGradient>
    <!-- Primary grid pattern -->
    <pattern id="ng-grid-lg" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2040" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="1.3" fill="#1E3A5F" opacity="0.55"/>
      <circle cx="40" cy="0" r="1.3" fill="#1E3A5F" opacity="0.55"/>
      <circle cx="0" cy="40" r="1.3" fill="#1E3A5F" opacity="0.55"/>
    </pattern>
    <!-- Finer sub-grid -->
    <pattern id="ng-grid-sm" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0A1628" stroke-width="0.3" opacity="0.6"/>
    </pattern>
    <!-- Center ambient glow -->
    <radialGradient id="ng-ambient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <!-- Top/bottom fade so it blends into the page -->
    <linearGradient id="ng-fade-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="80%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Horizontal scan gradient -->
    <linearGradient id="ng-scan-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <!-- Diagonal scan gradient -->
    <linearGradient id="ng-scan-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="ng-node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ng-line-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="900" height="120" fill="url(#ng-bg)"/>
  <rect width="900" height="120" fill="url(#ng-grid-sm)" opacity="0.5"/>
  <rect width="900" height="120" fill="url(#ng-grid-lg)" opacity="0.9"/>
  <rect width="900" height="120" fill="url(#ng-ambient)"/>

  <!-- Horizontal animated scan line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#ng-scan-h)" opacity="0.9">
    <animate attributeName="y" values="-2;122" dur="5s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Diagonal sweep (very subtle) -->
  <rect x="-200" y="0" width="250" height="120" fill="url(#ng-scan-d)" opacity="0.7" transform="skewX(-20)">
    <animate attributeName="x" values="-250;1100" dur="7s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- ============ NEURAL LAYER 1: PRIMARY NODES ============ -->
  <!-- Primary node cluster: 5 nodes connected -->
  <!-- Node A (120, 38) -->
  <circle cx="120" cy="38" r="3.5" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.2" filter="url(#ng-node-glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="38" r="1.8" fill="#3B82F6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Node B (280, 78) -->
  <circle cx="280" cy="78" r="3.5" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.2" filter="url(#ng-node-glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="78" r="1.8" fill="#3B82F6" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Node C (450, 38) — brightest, center -->
  <circle cx="450" cy="38" r="4.5" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1.5" filter="url(#ng-node-glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="38" r="2.2" fill="#60A5FA" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.2;3.2;2.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Pulse ring around center node -->
  <circle cx="450" cy="38" r="10" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="10;22;10" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node D (620, 80) -->
  <circle cx="620" cy="80" r="3.5" fill="#2D1B69" stroke="#8B5CF6" stroke-width="1.2" filter="url(#ng-node-glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="80" r="1.8" fill="#8B5CF6" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node E (790, 38) -->
  <circle cx="790" cy="38" r="3.5" fill="#1E3A5F" stroke="#38BDF8" stroke-width="1.2" filter="url(#ng-node-glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="38" r="1.8" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ NEURAL LAYER 2: SECONDARY NODES ============ -->
  <circle cx="200" cy="50" r="2.2" fill="#1E3A5F" stroke="#3B82F6" stroke-width="0.8" opacity="0.7">
    <animate attributeName="stroke-opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="50" r="1" fill="#3B82F6" opacity="0.7"/>

  <circle cx="355" cy="65" r="2.2" fill="#2D1B69" stroke="#8B5CF6" stroke-width="0.8" opacity="0.65">
    <animate attributeName="stroke-opacity" values="0.65;0.2;0.65" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="355" cy="65" r="1" fill="#8B5CF6" opacity="0.65"/>

  <circle cx="540" cy="70" r="2.2" fill="#0C2A3F" stroke="#38BDF8" stroke-width="0.8" opacity="0.6">
    <animate attributeName="stroke-opacity" values="0.6;0.15;0.6" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="70" r="1" fill="#38BDF8" opacity="0.65"/>

  <circle cx="700" cy="45" r="2.2" fill="#1E3A5F" stroke="#60A5FA" stroke-width="0.8" opacity="0.65">
    <animate attributeName="stroke-opacity" values="0.65;0.2;0.65" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="45" r="1" fill="#60A5FA" opacity="0.6"/>

  <!-- ============ CONNECTION LINES ============ -->
  <!-- Primary connections (brighter) -->
  <line x1="120" y1="38" x2="200" y2="50" stroke="#3B82F6" stroke-width="0.6" opacity="0.2" stroke-dasharray="3 4" filter="url(#ng-line-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="50" x2="280" y2="78" stroke="#3B82F6" stroke-width="0.6" opacity="0.2" stroke-dasharray="3 4" filter="url(#ng-line-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="280" y1="78" x2="355" y2="65" stroke="#8B5CF6" stroke-width="0.6" opacity="0.18" stroke-dasharray="3 4">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <line x1="355" y1="65" x2="450" y2="38" stroke="#3B82F6" stroke-width="0.7" opacity="0.22" stroke-dasharray="3 4" filter="url(#ng-line-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="38" x2="540" y2="70" stroke="#38BDF8" stroke-width="0.7" opacity="0.22" stroke-dasharray="3 4" filter="url(#ng-line-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="540" y1="70" x2="620" y2="80" stroke="#8B5CF6" stroke-width="0.6" opacity="0.18" stroke-dasharray="3 4">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="620" y1="80" x2="700" y2="45" stroke="#38BDF8" stroke-width="0.6" opacity="0.2" stroke-dasharray="3 4">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2.6s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="45" x2="790" y2="38" stroke="#60A5FA" stroke-width="0.6" opacity="0.2" stroke-dasharray="3 4" filter="url(#ng-line-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- Cross connections -->
  <line x1="120" y1="38" x2="280" y2="78" stroke="#3B82F6" stroke-width="0.4" opacity="0.1" stroke-dasharray="2 6"/>
  <line x1="450" y1="38" x2="620" y2="80" stroke="#8B5CF6" stroke-width="0.4" opacity="0.1" stroke-dasharray="2 6"/>
  <line x1="355" y1="65" x2="540" y2="70" stroke="#38BDF8" stroke-width="0.4" opacity="0.1" stroke-dasharray="2 6"/>
  <line x1="620" y1="80" x2="790" y2="38" stroke="#60A5FA" stroke-width="0.4" opacity="0.1" stroke-dasharray="2 6"/>

  <!-- ============ TRAVELING SIGNALS ============ -->
  <circle r="2" fill="#FFFFFF" opacity="0.8" filter="url(#ng-node-glow)">
    <animateMotion dur="4s" repeatCount="indefinite"
      path="M 120 38 L 200 50 L 280 78 L 355 65 L 450 38 L 540 70 L 620 80 L 700 45 L 790 38"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Second signal, reverse -->
  <circle r="1.5" fill="#8B5CF6" opacity="0.7">
    <animateMotion dur="5s" begin="2s" repeatCount="indefinite"
      path="M 790 38 L 700 45 L 620 80 L 540 70 L 450 38 L 355 65 L 280 78 L 200 50 L 120 38"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="5s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ TOP & BOTTOM FADE ============ -->
  <rect width="900" height="120" fill="url(#ng-fade-v)"/>
</svg>
