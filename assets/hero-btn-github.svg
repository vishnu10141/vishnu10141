<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 36" width="132" height="36">
  <defs>
    <linearGradient id="gb-glow-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8A5DFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4F8FFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="gb-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Subtle glow underneath -->
  <rect x="2" y="4" width="128" height="30" rx="6" fill="#4F8FFF" opacity="0.06" filter="url(#gb-glow)"/>
  <!-- Background -->
  <rect width="132" height="36" rx="6" fill="#0A1120"/>
  <!-- Glass highlight -->
  <rect x="1" y="1" width="130" height="16" rx="5" fill="#FFFFFF" opacity="0.03"/>
  <!-- Border with animated glow -->
  <rect width="132" height="36" rx="6" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect width="132" height="36" rx="6" fill="none" stroke="#4F8FFF" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- GitHub icon (simplified octocat) -->
  <circle cx="20" cy="17" r="7.5" fill="none" stroke="#7B8DB0" stroke-width="1"/>
  <circle cx="20" cy="14.5" r="4" fill="none" stroke="#7B8DB0" stroke-width="0.8"/>
  <!-- Text -->
  <text x="68" y="23" fill="#7B8DB0" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="0.3">GitHub</text>
  <!-- Arrow -->
  <text x="120" y="23" fill="#3D4F70" font-family="sans-serif" font-size="11" text-anchor="middle">↗</text>
</svg>
