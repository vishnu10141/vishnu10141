<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <linearGradient id="d7-grad-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-d7" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="60" fill="#020617"/>

  <!-- Dual split line — purple/cyan theme for "contact" section entry -->
  <line x1="0" y1="30" x2="390" y2="30" stroke="url(#d7-grad-l)" stroke-width="0.8"/>
  <line x1="510" y1="30" x2="900" y2="30" stroke="url(#d7-grad-l)" stroke-width="0.8"/>

  <!-- Center ornament: rotating hexagon -->
  <g filter="url(#glow-d7)">
    <!-- Hexagon approximation -->
    <polygon points="450,18 461,24 461,36 450,42 439,36 439,24" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 450 30" to="360 450 30" dur="12s" repeatCount="indefinite"/>
    </polygon>
    <!-- Inner pulse dot -->
    <circle cx="450" cy="30" r="4.5" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;6.5;4.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="30" r="2" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Outer ring dashes -->
  <circle cx="450" cy="30" r="20" fill="none" stroke="#4C1D95" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 4">
    <animateTransform attributeName="transform" type="rotate" from="0 450 30" to="-360 450 30" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner accent dots -->
  <circle cx="390" cy="30" r="2" fill="#4C1D95" opacity="0.7"/>
  <circle cx="510" cy="30" r="2" fill="#4C1D95" opacity="0.7"/>

  <!-- Traveling signal -->
  <circle r="2" fill="#A78BFA" opacity="0.8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 0 30 L 430 30"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#A78BFA" opacity="0.8">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M 900 30 L 470 30"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Label above -->
  <text x="450" y="13" fill="#4C1D95" font-family="monospace" font-size="7" letter-spacing="5" text-anchor="middle" opacity="0.6">⬡ ⬡ ⬡</text>
</svg>
