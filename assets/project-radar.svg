<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pr-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pr-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C2A3F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="pr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pr-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#pr-bg)" rx="8"/>
  <rect width="900" height="260" fill="url(#pr-dots)" opacity="0.6" rx="8"/>
  <rect width="900" height="260" fill="none" stroke="#1E3A5F" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- ============ LEFT COLUMN: Radar Visual (x=40, width=220) ============ -->
  <text x="40" y="30" fill="#38BDF8" font-family="monospace" font-size="9" letter-spacing="3" opacity="0.8">SIGNAL DISPLAY</text>

  <!-- Radar at center of left column: cx=150 -->
  <g transform="translate(150, 148)">
    <circle cx="0" cy="0" r="95" fill="#0A1628" stroke="#1E3A5F" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.7"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.7"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.7"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#1E293B" stroke-width="0.5" opacity="0.6"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#1E293B" stroke-width="0.5" opacity="0.6"/>
    <line x1="-67" y1="-67" x2="67" y2="67" stroke="#1E293B" stroke-width="0.3" opacity="0.4"/>
    <line x1="67" y1="-67" x2="-67" y2="67" stroke="#1E293B" stroke-width="0.3" opacity="0.4"/>
    <!-- Sweep -->
    <path d="M 0 0 L 95 0 A 95 95 0 0 0 67.2 -67.2 Z" fill="#38BDF8" opacity="0.04">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="95" y2="0" stroke="#38BDF8" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- True targets (blue) -->
    <circle cx="48" cy="-32" r="3.5" fill="#3B82F6" opacity="0.9" filter="url(#pr-glow)">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-58" cy="26" r="3" fill="#3B82F6" opacity="0.8" filter="url(#pr-glow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="64" r="2.5" fill="#3B82F6" opacity="0.85" filter="url(#pr-glow)">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- False targets (dim) -->
    <circle cx="-32" cy="-58" r="3" fill="#38BDF8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="42" r="2.5" fill="#38BDF8" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- X cross for false targets -->
    <g transform="translate(-32, -58)" opacity="0.4">
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#38BDF8" stroke-width="0.8"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#38BDF8" stroke-width="0.8"/>
    </g>
    <g transform="translate(68, 42)" opacity="0.3">
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#38BDF8" stroke-width="0.8"/>
      <line x1="4" y1="-4" x2="-4" y2="4" stroke="#38BDF8" stroke-width="0.8"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#38BDF8" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Legend below radar -->
  <circle cx="48" cy="246" r="4" fill="#3B82F6" opacity="0.9"/>
  <text x="58" y="250" fill="#60A5FA" font-family="monospace" font-size="7.5">True Target</text>
  <circle cx="136" cy="246" r="4" fill="#38BDF8" opacity="0.35"/>
  <text x="146" y="250" fill="#38BDF8" font-family="monospace" font-size="7.5" opacity="0.7">False ECM</text>

  <!-- ============ VERTICAL DIVIDER ============ -->
  <line x1="260" y1="20" x2="260" y2="255" stroke="#1E3A5F" stroke-width="0.8" opacity="0.5"/>

  <!-- ============ CENTER COLUMN: Pipeline (x=274, width=286) ============ -->
  <!-- Pipeline center at x=274+143=417 -->
  <text x="274" y="30" fill="#38BDF8" font-family="monospace" font-size="9" letter-spacing="3" opacity="0.8">ML PIPELINE</text>

  <!-- Pipeline boxes stacked vertically, centered at x=417 -->
  <!-- Box width=200, so x=274+43=317 -->
  <rect x="317" y="44" width="200" height="36" rx="4" fill="url(#pr-blue)" stroke="#3B82F6" stroke-width="0.8" opacity="0.9"/>
  <text x="417" y="66" fill="#60A5FA" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Radar Signal Data</text>

  <line x1="417" y1="80" x2="417" y2="94" stroke="#3B82F6" stroke-width="1" opacity="0.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="414,94 417,100 420,94" fill="#3B82F6" opacity="0.7"/>

  <rect x="317" y="102" width="200" height="36" rx="4" fill="url(#pr-blue)" stroke="#38BDF8" stroke-width="0.8" opacity="0.9"/>
  <text x="417" y="120" fill="#7DD3FC" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Signal Processing</text>
  <text x="417" y="130" fill="#0C4A6E" font-family="monospace" font-size="7" text-anchor="middle">Feature Engineering</text>

  <line x1="417" y1="138" x2="417" y2="152" stroke="#38BDF8" stroke-width="1" opacity="0.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="414,152 417,158 420,152" fill="#38BDF8" opacity="0.7"/>

  <rect x="297" y="160" width="240" height="46" rx="4" fill="url(#pr-cyan)" stroke="#38BDF8" stroke-width="1" filter="url(#pr-glow)" opacity="0.95"/>
  <text x="417" y="181" fill="#7DD3FC" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">XGBoost · RF · SVM</text>
  <text x="417" y="196" fill="#0C4A6E" font-family="monospace" font-size="7.5" text-anchor="middle">Ensemble Classifiers</text>

  <line x1="417" y1="206" x2="417" y2="218" stroke="#38BDF8" stroke-width="1" opacity="0.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="414,218 417,224 420,218" fill="#38BDF8" opacity="0.7"/>

  <rect x="317" y="226" width="200" height="26" rx="4" fill="url(#pr-blue)" stroke="#3B82F6" stroke-width="0.8" opacity="0.85"/>
  <text x="417" y="242" fill="#60A5FA" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Binary Classification Output</text>

  <!-- ============ VERTICAL DIVIDER ============ -->
  <line x1="560" y1="20" x2="560" y2="255" stroke="#1E3A5F" stroke-width="0.8" opacity="0.5"/>

  <!-- ============ RIGHT COLUMN: Metrics (x=574, width=286) ============ -->
  <text x="574" y="30" fill="#38BDF8" font-family="monospace" font-size="9" letter-spacing="3" opacity="0.8">RESULTS</text>

  <!-- Bar: Accuracy -->
  <text x="574" y="55" fill="#64748B" font-family="monospace" font-size="8" opacity="0.8">Accuracy</text>
  <rect x="574" y="62" width="286" height="9" rx="4.5" fill="#0F172A"/>
  <rect x="574" y="62" width="257" height="9" rx="4.5" fill="#3B82F6" opacity="0.75">
    <animate attributeName="width" values="0;257" dur="2s" fill="freeze"/>
  </rect>
  <text x="860" y="71" fill="#60A5FA" font-family="monospace" font-size="8" text-anchor="end">90%</text>

  <!-- Bar: Precision -->
  <text x="574" y="94" fill="#64748B" font-family="monospace" font-size="8" opacity="0.8">Precision</text>
  <rect x="574" y="101" width="286" height="9" rx="4.5" fill="#0F172A"/>
  <rect x="574" y="101" width="243" height="9" rx="4.5" fill="#8B5CF6" opacity="0.75">
    <animate attributeName="width" values="0;243" dur="2s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="860" y="110" fill="#A78BFA" font-family="monospace" font-size="8" text-anchor="end">85%</text>

  <!-- Bar: Recall -->
  <text x="574" y="133" fill="#64748B" font-family="monospace" font-size="8" opacity="0.8">Recall</text>
  <rect x="574" y="140" width="286" height="9" rx="4.5" fill="#0F172A"/>
  <rect x="574" y="140" width="229" height="9" rx="4.5" fill="#38BDF8" opacity="0.75">
    <animate attributeName="width" values="0;229" dur="2s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="860" y="149" fill="#7DD3FC" font-family="monospace" font-size="8" text-anchor="end">80%</text>

  <!-- Bar: F1-Score -->
  <text x="574" y="172" fill="#64748B" font-family="monospace" font-size="8" opacity="0.8">F1-Score</text>
  <rect x="574" y="179" width="286" height="9" rx="4.5" fill="#0F172A"/>
  <rect x="574" y="179" width="234" height="9" rx="4.5" fill="#60A5FA" opacity="0.75">
    <animate attributeName="width" values="0;234" dur="2s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="860" y="188" fill="#60A5FA" font-family="monospace" font-size="8" text-anchor="end">82%</text>

  <!-- Tags at bottom of right column -->
  <line x1="574" y1="210" x2="860" y2="210" stroke="#1E3A5F" stroke-width="0.6" opacity="0.4"/>
  <text x="574" y="224" fill="#38BDF8" font-family="monospace" font-size="8.5" opacity="0.7">XGBoost</text>
  <text x="643" y="224" fill="#38BDF8" font-family="monospace" font-size="8.5" opacity="0.7">Random Forest</text>
  <text x="574" y="239" fill="#38BDF8" font-family="monospace" font-size="8.5" opacity="0.7">SVM</text>
  <text x="617" y="239" fill="#38BDF8" font-family="monospace" font-size="8.5" opacity="0.7">Signal Processing</text>
</svg>
