<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="ed-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ed-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ed-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- Shimmer sweep -->
    <linearGradient id="ed-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="ed-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ed-glow-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ed-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.55" fill="#1E293B" opacity="0.45"/>
    </pattern>
    <radialGradient id="ed-shield-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#ed-bg)" rx="8"/>
  <rect width="900" height="200" fill="url(#ed-dots)" opacity="0.65" rx="8"/>
  <!-- Shimmer overlay -->
  <rect width="900" height="200" fill="url(#ed-shimmer)" rx="8"/>
  <!-- Border -->
  <rect width="900" height="200" fill="none" stroke="#1E3A5F" stroke-width="1" rx="8" opacity="0.7"/>
  <!-- Top left blue accent corner -->
  <path d="M 0 8 Q 0 0 8 0 L 80 0 L 80 1 L 8 1 Q 1 1 1 8 Z" fill="#3B82F6" opacity="0.5"/>

  <!-- ============ LEFT: LOGO + IDENTITY ============ -->
  <!-- Logo background glow -->
  <ellipse cx="68" cy="78" rx="36" ry="36" fill="url(#ed-shield-glow)" opacity="0.8">
    <animate attributeName="rx" values="36;42;36" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="36;42;36" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Logo container -->
  <rect x="30" y="30" width="76" height="76" rx="8" fill="#091828" stroke="#3B82F6" stroke-width="1.2" filter="url(#ed-glow-sm)"/>
  <!-- Shield shape (DRDO emblem) -->
  <path d="M 68 42 L 88 50 L 88 72 Q 68 86 68 86 Q 48 72 48 72 L 48 50 Z" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.8"/>
  <!-- Inner shield detail -->
  <path d="M 68 50 L 82 56 L 82 70 Q 68 80 68 80 Q 54 70 54 70 L 54 56 Z" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <!-- Crosshair center -->
  <line x1="68" y1="56" x2="68" y2="74" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
  <line x1="60" y1="65" x2="76" y2="65" stroke="#3B82F6" stroke-width="0.7" opacity="0.5"/>
  <!-- Core dot -->
  <circle cx="68" cy="65" r="4" fill="#3B82F6" filter="url(#ed-glow-sm)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="65" r="2" fill="#FFFFFF" opacity="0.9"/>
  <!-- Corner tick marks on logo box -->
  <path d="M 30 42 L 30 30 L 42 30" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <path d="M 94 30 L 106 30 L 106 42" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <path d="M 30 94 L 30 106 L 42 106" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>
  <path d="M 106 94 L 106 106 L 94 106" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.7"/>

  <!-- ============ CENTER: TEXT CONTENT ============ -->
  <!-- Title -->
  <text x="124" y="50" fill="#FFFFFF" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5">DRDO</text>
  <text x="124" y="67" fill="#475569" font-family="monospace" font-size="9.5" letter-spacing="0.5">Defence Research &amp; Development Organisation</text>
  <text x="124" y="82" fill="#3B82F6" font-family="monospace" font-size="8.5" letter-spacing="0.5">Hyderabad, India</text>

  <!-- Role badge -->
  <rect x="124" y="90" width="196" height="22" rx="4" fill="#0D2137" stroke="#3B82F6" stroke-width="0.8"/>
  <!-- Left accent bar -->
  <rect x="124" y="90" width="3" height="22" rx="1.5" fill="url(#ed-accent)"/>
  <text x="136" y="105" fill="#60A5FA" font-family="monospace" font-size="8.5" letter-spacing="0.5">Machine Learning Research Intern</text>

  <!-- Year badge -->
  <rect x="832" y="30" width="48" height="22" rx="4" fill="#091828" stroke="#1E3A5F" stroke-width="0.8"/>
  <text x="856" y="45" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">2023</text>

  <!-- ============ DIVIDER ============ -->
  <line x1="30" y1="128" x2="870" y2="128" stroke="#1E3A5F" stroke-width="0.8" opacity="0.7"/>

  <!-- ============ BOTTOM: METRICS + TAGS ============ -->

  <!-- Metric 1: Signal pipeline -->
  <g>
    <rect x="30" y="140" width="3" height="40" rx="1.5" fill="url(#ed-accent)" opacity="0.8"/>
    <text x="40" y="155" fill="#64748B" font-family="monospace" font-size="8" letter-spacing="0.3">PIPELINE</text>
    <text x="40" y="168" fill="#94A3B8" font-family="monospace" font-size="8.5">Radar Signal Data → Feature Extraction</text>
    <text x="40" y="180" fill="#475569" font-family="monospace" font-size="8">→ Ensemble Classifiers → Binary Output</text>
  </g>

  <!-- Mini performance bars on right -->
  <text x="560" y="148" fill="#475569" font-family="monospace" font-size="7.5" letter-spacing="0.5">CLASSIFICATION ACCURACY</text>
  <!-- Bar: XGBoost -->
  <text x="560" y="163" fill="#64748B" font-family="monospace" font-size="7.5">XGBoost</text>
  <rect x="620" y="156" width="160" height="6" rx="3" fill="#0F172A"/>
  <rect x="620" y="156" width="144" height="6" rx="3" fill="#3B82F6" opacity="0.7">
    <animate attributeName="width" values="0;144" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="786" y="162" fill="#60A5FA" font-family="monospace" font-size="7.5">90%</text>
  <!-- Bar: RF -->
  <text x="560" y="177" fill="#64748B" font-family="monospace" font-size="7.5">RandomForest</text>
  <rect x="620" y="170" width="160" height="6" rx="3" fill="#0F172A"/>
  <rect x="620" y="170" width="136" height="6" rx="3" fill="#60A5FA" opacity="0.6">
    <animate attributeName="width" values="0;136" dur="1.7s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="786" y="176" fill="#60A5FA" font-family="monospace" font-size="7.5">85%</text>

  <!-- Technology tags -->
  <rect x="560" y="185" width="54" height="14" rx="3" fill="#0D2137" stroke="#3B82F6" stroke-width="0.6"/>
  <text x="587" y="195" fill="#3B82F6" font-family="monospace" font-size="7" text-anchor="middle">Defense ML</text>
  <rect x="620" y="185" width="46" height="14" rx="3" fill="#0D2137" stroke="#3B82F6" stroke-width="0.6"/>
  <text x="643" y="195" fill="#3B82F6" font-family="monospace" font-size="7" text-anchor="middle">XGBoost</text>
  <rect x="672" y="185" width="32" height="14" rx="3" fill="#0D2137" stroke="#3B82F6" stroke-width="0.6"/>
  <text x="688" y="195" fill="#3B82F6" font-family="monospace" font-size="7" text-anchor="middle">SVM</text>
  <rect x="710" y="185" width="52" height="14" rx="3" fill="#0D2137" stroke="#3B82F6" stroke-width="0.6"/>
  <text x="736" y="195" fill="#3B82F6" font-family="monospace" font-size="7" text-anchor="middle">Scikit-learn</text>
  <rect x="768" y="185" width="38" height="14" rx="3" fill="#0D2137" stroke="#3B82F6" stroke-width="0.6"/>
  <text x="787" y="195" fill="#3B82F6" font-family="monospace" font-size="7" text-anchor="middle">NumPy</text>

  <!-- Signal traveling at bottom -->
  <circle r="1.5" fill="#3B82F6" opacity="0.6">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 30 128 L 870 128"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
