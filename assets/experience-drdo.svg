<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Card background gradient -->
    <linearGradient id="drdo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <!-- Top accent gradient -->
    <linearGradient id="drdo-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <!-- Role badge left accent gradient -->
    <linearGradient id="drdo-role-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <!-- Pipeline accent gradient -->
    <linearGradient id="drdo-pipe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <!-- Shimmer gradient -->
    <linearGradient id="drdo-shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="900" height="200" rx="8" fill="url(#drdo-bg-grad)"/>

  <!-- Shimmer overlay -->
  <rect width="900" height="200" rx="8" fill="url(#drdo-shimmer-grad)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Card border -->
  <rect width="900" height="200" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>

  <!-- Top left accent bar -->
  <rect x="1" y="1" width="120" height="1.5" rx="1" fill="url(#drdo-accent-grad)" opacity="0.8"/>

  <!-- ===== LOGO CONTAINER ===== -->
  <rect x="40" y="28" width="72" height="72" rx="6" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>

  <!-- Corner ticks — Top-left -->
  <line x1="40" y1="38" x2="40" y2="28" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="28" x2="50" y2="28" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Top-right -->
  <line x1="112" y1="38" x2="112" y2="28" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="112" y1="28" x2="102" y2="28" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Bottom-left -->
  <line x1="40" y1="90" x2="40" y2="100" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="100" x2="50" y2="100" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Bottom-right -->
  <line x1="112" y1="90" x2="112" y2="100" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="112" y1="100" x2="102" y2="100" stroke="#4F8FFF" stroke-width="0.7" opacity="0.4"/>

  <!-- Shield outer path (DRDO shield silhouette, centered at cx=76 cy=64) -->
  <path d="M76,36 L96,44 L96,62 Q96,76 76,84 Q56,76 56,62 L56,44 Z"
        fill="none" stroke="#4F8FFF" stroke-width="1.2" opacity="0.7" stroke-linejoin="round"/>
  <!-- Shield inner path (smaller) -->
  <path d="M76,42 L90,49 L90,62 Q90,72 76,78 Q62,72 62,62 L62,49 Z"
        fill="none" stroke="#8A5DFF" stroke-width="0.6" opacity="0.4" stroke-linejoin="round"/>
  <!-- Core dot with pulse -->
  <circle cx="76" cy="63" r="3" fill="#4F8FFF">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner core -->
  <circle cx="76" cy="63" r="1.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== TEXT BLOCK ===== -->
  <!-- Institution name -->
  <text x="126" y="50" fill="#F0F4FF" font-size="20" font-weight="700" letter-spacing="-0.5" font-family="'SF Pro Display', -apple-system, Inter, sans-serif">DRDO</text>
  <!-- Full name -->
  <text x="126" y="66" fill="#7B8DB0" font-size="9.5" font-family="monospace" letter-spacing="0.2">Defence Research &amp; Development Organisation</text>
  <!-- Location -->
  <text x="126" y="80" fill="#4F8FFF" font-size="8.5" font-family="monospace">Hyderabad, India</text>

  <!-- Role badge background -->
  <rect x="126" y="87" width="196" height="20" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Role badge left accent bar -->
  <rect x="126" y="87" width="2.5" height="20" rx="1.2" fill="url(#drdo-role-grad)"/>
  <!-- Role text -->
  <text x="136" y="101" fill="#4F8FFF" font-size="8.5" font-family="monospace">Machine Learning Research Intern</text>

  <!-- Year badge -->
  <rect x="814" y="28" width="48" height="20" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="838" y="42" fill="#7B8DB0" font-size="9" text-anchor="middle" letter-spacing="1" font-family="monospace">2023</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="40" y1="120" x2="860" y2="120" stroke="#1A2540" stroke-width="0.8" opacity="0.7"/>

  <!-- ===== BOTTOM SECTION ===== -->

  <!-- Pipeline section (left) -->
  <rect x="40" y="132" width="2.5" height="44" rx="1.2" fill="url(#drdo-pipe-grad)" opacity="0.7"/>
  <text x="50" y="147" fill="#3D4F70" font-size="7.5" font-family="monospace" letter-spacing="0.5">PIPELINE</text>
  <text x="50" y="160" fill="#F0F4FF" font-size="8.5" font-family="monospace">Radar Signal Data → Feature Extraction</text>
  <text x="50" y="173" fill="#7B8DB0" font-size="8" font-family="monospace">→ Ensemble Classifiers → Binary Output</text>

  <!-- Accuracy bars (right) -->
  <text x="860" y="134" fill="#3D4F70" font-size="7.5" font-family="monospace" text-anchor="end" letter-spacing="0.5">ACCURACY</text>

  <!-- XGBoost bar -->
  <text x="480" y="150" fill="#7B8DB0" font-size="7.5" font-family="monospace">XGBoost</text>
  <rect x="534" y="143" width="200" height="6" rx="3" fill="#050A12"/>
  <rect x="534" y="143" width="180" height="6" rx="3" fill="#4F8FFF" opacity="0.65">
    <animate attributeName="width" from="0" to="180" dur="2s" fill="freeze"/>
  </rect>
  <text x="740" y="150" fill="#4F8FFF" font-size="7.5" font-family="monospace">90%</text>

  <!-- Random Forest bar -->
  <text x="480" y="168" fill="#7B8DB0" font-size="7.5" font-family="monospace">Random Forest</text>
  <rect x="534" y="161" width="200" height="6" rx="3" fill="#050A12"/>
  <rect x="534" y="161" width="170" height="6" rx="3" fill="#8A5DFF" opacity="0.6">
    <animate attributeName="width" from="0" to="170" dur="2s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="740" y="168" fill="#8A5DFF" font-size="7.5" font-family="monospace">85%</text>

  <!-- Tech tags — 5 pills at y=182 starting x=480 with 6px gaps -->
  <!-- 'Defense ML' w=58 -->
  <rect x="480" y="178" width="58" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="509" y="188" fill="#4F8FFF" font-size="7" font-family="monospace" text-anchor="middle">Defense ML</text>
  <!-- 'XGBoost' w=46 -->
  <rect x="544" y="178" width="46" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="567" y="188" fill="#4F8FFF" font-size="7" font-family="monospace" text-anchor="middle">XGBoost</text>
  <!-- 'SVM' w=32 -->
  <rect x="596" y="178" width="32" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="612" y="188" fill="#4F8FFF" font-size="7" font-family="monospace" text-anchor="middle">SVM</text>
  <!-- 'Scikit-learn' w=60 -->
  <rect x="634" y="178" width="60" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="664" y="188" fill="#4F8FFF" font-size="7" font-family="monospace" text-anchor="middle">Scikit-learn</text>
  <!-- 'NumPy' w=40 -->
  <rect x="700" y="178" width="40" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="720" y="188" fill="#4F8FFF" font-size="7" font-family="monospace" text-anchor="middle">NumPy</text>

  <!-- ===== SIGNAL TRAVEL on divider ===== -->
  <circle r="1.5" fill="#4F8FFF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 40 120 L 860 120"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </circle>

</svg>
