<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Card gradients -->
    <linearGradient id="cc-card-portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cc-card-github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cc-card-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A3F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cc-card-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cc-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cc-glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shimmer animation gradient -->
    <linearGradient id="shimmer-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shimmer-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shimmer-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shimmer-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="cc-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="180" fill="url(#cc-bg)"/>
  <rect width="900" height="180" fill="url(#cc-dots)" opacity="0.5"/>

  <!-- ============ CARD 1: Portfolio ============ -->
  <a href="https://vishnu-ai-portfolio-864n.vercel.app" target="_blank">
    <rect x="20" y="20" width="195" height="140" rx="8" fill="url(#cc-card-portfolio)" stroke="#3B82F6" stroke-width="1"/>
    <!-- Shimmer -->
    <rect x="20" y="20" width="195" height="140" rx="8" fill="url(#shimmer-1)"/>
    <!-- Glow border pulse -->
    <rect x="20" y="20" width="195" height="140" rx="8" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- Icon: globe/globe symbol -->
    <circle cx="117" cy="65" r="20" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="117" cy="65" rx="10" ry="20" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <line x1="97" y1="65" x2="137" y2="65" stroke="#3B82F6" stroke-width="0.8" opacity="0.5"/>
    <circle cx="117" cy="65" r="4" fill="#3B82F6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Label -->
    <text x="117" y="104" fill="#60A5FA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">Portfolio</text>
    <text x="117" y="120" fill="#1E3A5F" font-family="monospace" font-size="8" text-anchor="middle">vishnu-ai-portfolio</text>
    <text x="117" y="148" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">VISIT →</text>
  </a>

  <!-- ============ CARD 2: GitHub ============ -->
  <a href="https://github.com/vishnu10141" target="_blank">
    <rect x="232" y="20" width="195" height="140" rx="8" fill="url(#cc-card-github)" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="232" y="20" width="195" height="140" rx="8" fill="url(#shimmer-2)"/>
    <rect x="232" y="20" width="195" height="140" rx="8" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- GitHub octocat simplified icon -->
    <circle cx="329" cy="60" r="18" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity="0.7"/>
    <!-- Simplified head -->
    <circle cx="329" cy="57" r="10" fill="none" stroke="#8B5CF6" stroke-width="0.9" opacity="0.6"/>
    <!-- Ears -->
    <circle cx="320" cy="49" r="4" fill="none" stroke="#8B5CF6" stroke-width="0.7" opacity="0.5"/>
    <circle cx="338" cy="49" r="4" fill="none" stroke="#8B5CF6" stroke-width="0.7" opacity="0.5"/>
    <circle cx="329" cy="57" r="3" fill="#8B5CF6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Label -->
    <text x="329" y="100" fill="#A78BFA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">GitHub</text>
    <text x="329" y="116" fill="#2D1B69" font-family="monospace" font-size="8" text-anchor="middle">@vishnu10141</text>
    <text x="329" y="148" fill="#8B5CF6" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">FOLLOW →</text>
  </a>

  <!-- ============ CARD 3: LinkedIn ============ -->
  <a href="https://www.linkedin.com/in/vishnu-nimmakayala-8a41021b4/" target="_blank">
    <rect x="444" y="20" width="195" height="140" rx="8" fill="url(#cc-card-linkedin)" stroke="#38BDF8" stroke-width="1"/>
    <rect x="444" y="20" width="195" height="140" rx="8" fill="url(#shimmer-3)"/>
    <rect x="444" y="20" width="195" height="140" rx="8" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- LinkedIn "in" simplified icon -->
    <rect x="520" y="42" width="28" height="28" rx="5" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
    <text x="534" y="62" fill="#38BDF8" font-family="'SF Pro Display', sans-serif" font-size="18" font-weight="700" text-anchor="middle" opacity="0.8">in</text>
    <circle cx="534" cy="56" r="2" fill="#38BDF8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Label -->
    <text x="541" y="100" fill="#7DD3FC" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">LinkedIn</text>
    <text x="541" y="116" fill="#0C4A6E" font-family="monospace" font-size="7.5" text-anchor="middle">vishnu-nimmakayala</text>
    <text x="541" y="148" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">CONNECT →</text>
  </a>

  <!-- ============ CARD 4: Email ============ -->
  <a href="mailto:nvishnu1014@gmail.com" target="_blank">
    <rect x="656" y="20" width="224" height="140" rx="8" fill="url(#cc-card-email)" stroke="#3B82F6" stroke-width="1"/>
    <rect x="656" y="20" width="224" height="140" rx="8" fill="url(#shimmer-4)"/>
    <rect x="656" y="20" width="224" height="140" rx="8" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Envelope icon -->
    <rect x="740" y="44" width="32" height="22" rx="3" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <path d="M 740 44 L 756 58 L 772 44" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <circle cx="756" cy="54" r="2.5" fill="#3B82F6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Label -->
    <text x="768" y="100" fill="#60A5FA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">Email</text>
    <text x="768" y="116" fill="#1E3A5F" font-family="monospace" font-size="7.5" text-anchor="middle">nvishnu1014@gmail.com</text>
    <text x="768" y="148" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">WRITE →</text>
  </a>
</svg>
