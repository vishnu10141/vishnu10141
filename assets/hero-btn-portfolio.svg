<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36">
  <defs>
    <linearGradient id="btn-p-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
  </defs>

  <!-- Background gradient fill -->
  <rect width="160" height="36" rx="6" fill="url(#btn-p-grad)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="158" height="17" rx="5" fill="#FFFFFF" opacity="0.06"/>

  <!-- Globe icon — outer circle -->
  <circle cx="20" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.85"/>

  <!-- Globe — horizontal equator line -->
  <line x1="12" y1="18" x2="28" y2="18" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>

  <!-- Globe — vertical meridian ellipse -->
  <ellipse cx="20" cy="18" rx="4" ry="8" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>

  <!-- Button label -->
  <text x="90" y="23" fill="#FFFFFF" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.3">Portfolio</text>

  <!-- Arrow -->
  <text x="150" y="23" fill="#FFFFFF" font-size="12" text-anchor="middle" opacity="0.7">→</text>

  <!-- Border overlay -->
  <rect width="160" height="36" rx="6" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
</svg>
