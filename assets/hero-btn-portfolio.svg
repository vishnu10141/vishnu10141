<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36">
  <defs>
    <linearGradient id="btn-p-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="btn-p-glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 40px left spacer so button left-aligns with hero text -->
  <rect x="40" y="1" width="112" height="34" rx="6" fill="url(#btn-p-grad)" filter="url(#btn-p-glow)"/>
  <!-- Portfolio icon (external link) -->
  <text x="58" y="23" fill="#FFFFFF" font-family="monospace" font-size="11" opacity="0.9">⬡</text>
  <text x="101" y="23" fill="#FFFFFF" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">Portfolio</text>
</svg>
