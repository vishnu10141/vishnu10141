<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36">
  <defs>
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="pb-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pb-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shadow / glow underneath -->
  <rect x="4" y="6" width="152" height="28" rx="6" fill="#4F8FFF" opacity="0.15" filter="url(#pb-glow)"/>
  <!-- Main button -->
  <rect width="160" height="36" rx="6" fill="url(#pb-bg)"/>
  <!-- Glass highlight top half -->
  <rect x="1" y="1" width="158" height="16" rx="5" fill="#FFFFFF" opacity="0.08"/>
  <!-- Shimmer sweep -->
  <rect width="160" height="36" rx="6" fill="url(#pb-shimmer)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite" keyTimes="0;0.3;0.5;0.55;0.7"/>
    <animateTransform attributeName="transform" type="translate" values="-180,0;180,0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Globe icon -->
  <circle cx="22" cy="18" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.85"/>
  <ellipse cx="22" cy="18" rx="4" ry="7.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>
  <line x1="14.5" y1="18" x2="29.5" y2="18" stroke="#FFFFFF" stroke-width="0.7" opacity="0.5"/>
  <!-- Text -->
  <text x="82" y="23" fill="#FFFFFF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.3">Portfolio</text>
  <!-- Arrow -->
  <text x="148" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle" opacity="0.7">→</text>
  <!-- Border -->
  <rect width="160" height="36" rx="6" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
</svg>
