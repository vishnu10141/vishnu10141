<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="pt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="pt-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E6FF"/>
      <stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <linearGradient id="pt-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.018"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="900" height="260" rx="8" fill="url(#pt-bg)"/>
  <rect width="900" height="260" rx="8" fill="url(#pt-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="260" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>
  <!-- Top accent -->
  <rect x="1" y="1" width="160" height="1.5" rx="1" fill="url(#pt-accent)" opacity="0.8"/>

  <!-- ── HEADER ── -->
  <text x="40" y="28" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="3">FEATURED PROJECT — 01</text>
  <text x="40" y="54" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="18" font-weight="600">Brain Tumor Detection &amp; Segmentation</text>

  <!-- Domain tags -->
  <rect x="40" y="63" width="92" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="86" y="76" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Medical Imaging</text>
  <rect x="140" y="63" width="82" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="181" y="76" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Deep Learning</text>
  <rect x="230" y="63" width="82" height="18" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
  <text x="271" y="76" fill="#00E6FF" font-family="monospace" font-size="7.5" text-anchor="middle">Explainable AI</text>

  <!-- ── SECTION DIVIDER ── -->
  <line x1="40" y1="96" x2="860" y2="96" stroke="#1A2540" stroke-width="0.8" opacity="0.8"/>

  <!-- ── PIPELINE ── -->
  <text x="40" y="112" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="2">PIPELINE</text>

  <!-- 6 pipeline boxes: x=40,164,288,412,536,660 w=114 h=40 -->
  <!-- Box 1: MRI Input -->
  <rect x="40" y="120" width="114" height="40" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="97" y="137" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">MRI Input</text>
  <text x="97" y="151" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">BraTS 2020</text>
  <!-- Arrow -->
  <line x1="154" y1="140" x2="162" y2="140" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="162,137 168,140 162,143" fill="#1A2540" opacity="0.7"/>

  <!-- Box 2: Preprocess -->
  <rect x="168" y="120" width="114" height="40" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="225" y="137" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Preprocess</text>
  <text x="225" y="151" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">MONAI · Norm</text>
  <!-- Arrow -->
  <line x1="282" y1="140" x2="290" y2="140" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="290,137 296,140 290,143" fill="#1A2540" opacity="0.7"/>

  <!-- Box 3: HIGHLIGHT — Res-Attn U-Net -->
  <rect x="296" y="116" width="114" height="48" rx="4" fill="#0A1120" stroke="#4F8FFF" stroke-width="1.2"/>
  <rect x="296" y="116" width="114" height="48" rx="4" fill="none" stroke="#4F8FFF" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.06;0.3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="353" y="135" fill="#4F8FFF" font-family="monospace" font-size="7" font-weight="600" text-anchor="middle">3D Res-Attn U-Net</text>
  <text x="353" y="148" fill="#4F8FFF" font-family="monospace" font-size="6.5" text-anchor="middle">Core Model</text>
  <!-- Arrow -->
  <line x1="410" y1="140" x2="418" y2="140" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="418,137 424,140 418,143" fill="#1A2540" opacity="0.7"/>

  <!-- Box 4: Segment -->
  <rect x="424" y="120" width="114" height="40" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="481" y="137" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Segment</text>
  <text x="481" y="151" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">Multi-Class</text>
  <!-- Arrow -->
  <line x1="538" y1="140" x2="546" y2="140" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="546,137 552,140 546,143" fill="#1A2540" opacity="0.7"/>

  <!-- Box 5: Grad-CAM++ (cyan) -->
  <rect x="552" y="120" width="114" height="40" rx="4" fill="#0A1120" stroke="#00E6FF" stroke-width="0.9"/>
  <text x="609" y="137" fill="#00E6FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle" opacity="0.85">Grad-CAM++</text>
  <text x="609" y="151" fill="#00E6FF" font-family="monospace" font-size="6.5" text-anchor="middle" opacity="0.6">Explainability</text>
  <!-- Arrow -->
  <line x1="666" y1="140" x2="674" y2="140" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="674,137 680,140 674,143" fill="#1A2540" opacity="0.7"/>

  <!-- Box 6: Streamlit -->
  <rect x="680" y="120" width="114" height="40" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="737" y="137" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Streamlit</text>
  <text x="737" y="151" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">Dashboard</text>

  <!-- ── METRICS DIVIDER ── -->
  <line x1="40" y1="175" x2="860" y2="175" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- ── 5 METRIC CARDS y=183 h=50 w=148 gap=20 ── -->
  <!-- Card 1: Dice Score -->
  <rect x="40" y="183" width="148" height="50" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="64" y="203" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700">0.87</text>
  <text x="64" y="216" fill="#7B8DB0" font-family="monospace" font-size="7">Dice Score</text>
  <text x="64" y="227" fill="#3D4F70" font-family="monospace" font-size="6.5">Multi-class</text>

  <!-- Card 2: BraTS 2020 -->
  <rect x="208" y="183" width="148" height="50" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="232" y="206" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="13" font-weight="600">BraTS 2020</text>
  <text x="232" y="222" fill="#7B8DB0" font-family="monospace" font-size="7">Dataset Benchmark</text>

  <!-- Card 3: Architecture (highlighted) -->
  <rect x="376" y="183" width="148" height="50" rx="4" fill="#050A12" stroke="#8A5DFF" stroke-width="1"/>
  <text x="400" y="202" fill="#8A5DFF" font-family="monospace" font-size="7.5" font-weight="600">3D Res-Attn</text>
  <text x="400" y="213" fill="#8A5DFF" font-family="monospace" font-size="7.5" font-weight="600">U-Net</text>
  <text x="400" y="226" fill="#3D4F70" font-family="monospace" font-size="6.5">Architecture</text>

  <!-- Card 4: XAI -->
  <rect x="544" y="183" width="148" height="50" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="568" y="207" fill="#00E6FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700">XAI</text>
  <text x="568" y="222" fill="#7B8DB0" font-family="monospace" font-size="7">Grad-CAM++</text>

  <!-- Card 5: MONAI -->
  <rect x="712" y="183" width="148" height="50" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="736" y="207" fill="#8A5DFF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="16" font-weight="700">MONAI</text>
  <text x="736" y="222" fill="#7B8DB0" font-family="monospace" font-size="7">Medical AI Framework</text>

  <!-- ── TECH TAGS ── -->
  <line x1="40" y1="244" x2="860" y2="244" stroke="#1A2540" stroke-width="0.5" opacity="0.4"/>
  <text x="40" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">PyTorch</text>
  <text x="110" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">3D U-Net</text>
  <text x="196" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">MONAI</text>
  <text x="264" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Grad-CAM++</text>
  <text x="374" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">BraTS 2020</text>
  <text x="476" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Streamlit</text>
</svg>
