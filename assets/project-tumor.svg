<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <defs>
    <linearGradient id="bt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/><stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="bt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="bt-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.018"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Left hemisphere fill -->
    <linearGradient id="bt-lhemi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1830" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A2A50" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Right hemisphere fill -->
    <linearGradient id="bt-rhemi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1840" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0E1228" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Tumor glow gradient -->
    <radialGradient id="bt-tumor-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF4040" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF2020" stop-opacity="0"/>
    </radialGradient>
    <!-- Scan line gradient (vertical, for the scan glow) -->
    <linearGradient id="bt-scan-grd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="bt-glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bt-glow-md" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bt-glow-s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bt-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.4" fill="#1A2540" opacity="0.3"/>
    </pattern>
    <!-- Clip to brain outer boundary -->
    <clipPath id="bt-brain-clip">
      <path d="M152,116 C168,112 187,115 198,126 C212,139 215,156 212,173 C209,190 200,202 187,208 C175,214 162,216 152,215 C142,216 129,214 117,208 C104,202 95,190 92,173 C89,156 92,139 106,126 C117,115 136,112 152,116 Z"/>
    </clipPath>
  </defs>

  <!-- Card base -->
  <rect width="900" height="290" rx="8" fill="url(#bt-bg)"/>
  <rect width="900" height="290" rx="8" fill="url(#bt-dots)"/>
  <rect width="900" height="290" rx="8" fill="url(#bt-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="290" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>
  <!-- Top accent -->
  <rect x="1" y="1" width="0" height="1.5" rx="1" fill="url(#bt-accent)">
    <animate attributeName="width" values="0;350" dur="1.3s" fill="freeze"/>
  </rect>

  <!-- ══════ HEADER ══════ -->
  <text x="40" y="26" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="3">FEATURED PROJECT — 01</text>
  <text x="40" y="52" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="18" font-weight="600">Brain Tumor Detection &amp; Segmentation</text>

  <!-- Tags -->
  <rect x="40" y="61" width="94" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="87" y="74" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Medical Imaging</text>
  <rect x="142" y="61" width="84" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="184" y="74" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Deep Learning</text>
  <rect x="234" y="61" width="84" height="18" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
  <text x="276" y="74" fill="#00E6FF" font-family="monospace" font-size="7.5" text-anchor="middle">Explainable AI</text>

  <!-- Header divider -->
  <line x1="40" y1="92" x2="860" y2="92" stroke="#1A2540" stroke-width="0.8" opacity="0.8"/>

  <!-- ══════════════════════════════════
       BODY: Brain visualization (left) + Pipeline/Metrics (right)
  ══════════════════════════════════ -->

  <!-- Left panel label -->
  <text x="40" y="108" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="2">MRI SCAN · T1ce</text>

  <!-- ── BRAIN VISUALIZATION (center: 152, 165) ── -->

  <!-- Brain outer boundary -->
  <path d="M152,116 C168,112 187,115 198,126 C212,139 215,156 212,173 C209,190 200,202 187,208 C175,214 162,216 152,215 C142,216 129,214 117,208 C104,202 95,190 92,173 C89,156 92,139 106,126 C117,115 136,112 152,116 Z"
    fill="#040C1C" stroke="#2A4070" stroke-width="1.2"/>

  <!-- Left hemisphere fill -->
  <path d="M152,116 C136,112 117,115 106,126 C92,139 89,156 92,173 C95,190 104,202 117,208 C129,214 142,216 152,215 Z"
    fill="url(#bt-lhemi)"/>

  <!-- Right hemisphere fill -->
  <path d="M152,116 C168,112 187,115 198,126 C212,139 215,156 212,173 C209,190 200,202 187,208 C175,214 162,216 152,215 Z"
    fill="url(#bt-rhemi)"/>

  <!-- Sulci lines — LEFT hemisphere -->
  <path d="M118,134 C122,141 121,149 118,154" fill="none" stroke="#2A4070" stroke-width="0.8" opacity="0.7"/>
  <path d="M108,152 C113,160 111,169 108,174" fill="none" stroke="#2A4070" stroke-width="0.8" opacity="0.6"/>
  <path d="M115,172 C120,178 119,184 116,187" fill="none" stroke="#2A4070" stroke-width="0.7" opacity="0.6"/>
  <path d="M128,124 C133,131 132,139 129,143" fill="none" stroke="#2A4070" stroke-width="0.7" opacity="0.5"/>
  <path d="M97,164 C101,170 100,176 98,178" fill="none" stroke="#2A4070" stroke-width="0.6" opacity="0.5"/>

  <!-- Sulci lines — RIGHT hemisphere -->
  <path d="M186,134 C182,141 183,149 186,154" fill="none" stroke="#2A3060" stroke-width="0.8" opacity="0.7"/>
  <path d="M196,152 C191,160 193,169 196,174" fill="none" stroke="#2A3060" stroke-width="0.8" opacity="0.6"/>
  <path d="M189,172 C184,178 185,184 188,187" fill="none" stroke="#2A3060" stroke-width="0.7" opacity="0.6"/>
  <path d="M176,124 C171,131 172,139 175,143" fill="none" stroke="#2A3060" stroke-width="0.7" opacity="0.5"/>
  <path d="M207,164 C203,170 204,176 206,178" fill="none" stroke="#2A3060" stroke-width="0.6" opacity="0.5"/>

  <!-- Corpus callosum (inner arch) -->
  <path d="M136,124 C141,118 163,118 168,124 C172,132 170,140 152,142 C134,140 132,132 136,124 Z"
    fill="none" stroke="#3D5080" stroke-width="0.9" opacity="0.6"/>

  <!-- Central fissure -->
  <path d="M152,116 C154,133 150,151 152,165 C154,180 150,196 152,215"
    fill="none" stroke="#2A4070" stroke-width="1" opacity="0.8"/>

  <!-- ── TUMOR REGION (upper-left quadrant of brain) ── -->
  <path d="M134,130 C142,124 154,124 156,135 C158,147 153,158 144,161 C135,164 127,157 126,147 C125,138 129,135 134,130 Z"
    fill="#FF3030" opacity="0.35" filter="url(#bt-glow-md)">
    <animate attributeName="opacity" values="0.35;0.55;0.35" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <!-- Tumor outline -->
  <path d="M134,130 C142,124 154,124 156,135 C158,147 153,158 144,161 C135,164 127,157 126,147 C125,138 129,135 134,130 Z"
    fill="none" stroke="#FF5050" stroke-width="1" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <!-- Tumor glow -->
  <circle cx="141" cy="143" r="14" fill="url(#bt-tumor-g)" filter="url(#bt-glow-lg)">
    <animate attributeName="r" values="14;18;14" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── MRI SCAN LINE (animated, sweeping through brain) ── -->
  <rect x="92" y="0" width="120" height="8" fill="url(#bt-scan-grd)" clip-path="url(#bt-brain-clip)">
    <animate attributeName="y" values="116;215;116" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.8;1" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Scan line main (the bright line) -->
  <line x1="92" y1="165" x2="212" y2="165" stroke="#00E6FF" stroke-width="0.9" opacity="0.6" clip-path="url(#bt-brain-clip)">
    <animate attributeName="y1" values="116;215;116" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="116;215;116" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Brain outer border (redraw on top) -->
  <path d="M152,116 C168,112 187,115 198,126 C212,139 215,156 212,173 C209,190 200,202 187,208 C175,214 162,216 152,215 C142,216 129,214 117,208 C104,202 95,190 92,173 C89,156 92,139 106,126 C117,115 136,112 152,116 Z"
    fill="none" stroke="#3A5080" stroke-width="1.2"/>

  <!-- Crosshair overlay -->
  <line x1="152" y1="116" x2="152" y2="215" stroke="#1A2540" stroke-width="0.4" opacity="0.4"/>
  <line x1="92" y1="165" x2="212" y2="165" stroke="#1A2540" stroke-width="0.4" opacity="0.4"/>

  <!-- Brain label -->
  <text x="152" y="226" text-anchor="middle" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1" opacity="0.6">3D BRAIN · TOP VIEW</text>
  <!-- Tumor legend -->
  <rect x="100" y="232" width="8" height="8" rx="2" fill="#FF3030" opacity="0.7"/>
  <text x="112" y="240" fill="#7B8DB0" font-family="monospace" font-size="7" opacity="0.7">Tumor Region</text>
  <rect x="170" y="232" width="8" height="8" rx="2" fill="#00E6FF" opacity="0.5"/>
  <text x="182" y="240" fill="#7B8DB0" font-family="monospace" font-size="7" opacity="0.7">MRI Scan</text>

  <!-- Vertical divider -->
  <line x1="288" y1="98" x2="288" y2="278" stroke="#1A2540" stroke-width="0.8" opacity="0.6"/>

  <!-- ══════ RIGHT SECTION ══════ -->

  <!-- Pipeline section -->
  <text x="306" y="108" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="2">PIPELINE</text>

  <!-- 5 compact pipeline steps -->
  <!-- Step 1 -->
  <rect x="306" y="115" width="96" height="30" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="306" y="115" width="96" height="30" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.06;0.2;0.3"/>
  </rect>
  <text x="354" y="127" fill="#F0F4FF" font-family="monospace" font-size="7" text-anchor="middle">MRI Input</text>
  <text x="354" y="139" fill="#7B8DB0" font-family="monospace" font-size="6" text-anchor="middle">BraTS 2020</text>

  <!-- Arrow -->
  <line x1="402" y1="130" x2="410" y2="130" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="410,127 416,130 410,133" fill="#1A2540" opacity="0.7"/>
  <!-- Traveling particle -->
  <circle r="1.8" fill="#4F8FFF" filter="url(#bt-glow-s)">
    <animateMotion dur="6s" begin="0.8s" repeatCount="indefinite" path="M354,130 L420,130"/>
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" dur="6s" begin="0.8s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.88;1"/>
  </circle>

  <!-- Step 2 -->
  <rect x="420" y="115" width="96" height="30" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="420" y="115" width="96" height="30" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.06;0.2;0.3"/>
  </rect>
  <text x="468" y="127" fill="#F0F4FF" font-family="monospace" font-size="7" text-anchor="middle">Preprocess</text>
  <text x="468" y="139" fill="#7B8DB0" font-family="monospace" font-size="6" text-anchor="middle">MONAI · Norm</text>

  <line x1="516" y1="130" x2="524" y2="130" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="524,127 530,130 524,133" fill="#1A2540" opacity="0.7"/>
  <circle r="1.8" fill="#4F8FFF" filter="url(#bt-glow-s)">
    <animateMotion dur="6s" begin="2.0s" repeatCount="indefinite" path="M468,130 L534,130"/>
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" dur="6s" begin="2.0s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.88;1"/>
  </circle>

  <!-- Step 3 (highlighted) -->
  <rect x="534" y="111" width="96" height="38" rx="4" fill="#0A1120" stroke="#4F8FFF" stroke-width="1.2"/>
  <rect x="534" y="111" width="96" height="38" rx="4" fill="#4F8FFF" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="534" y="111" width="96" height="38" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1.8" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" begin="2.4s" repeatCount="indefinite" keyTimes="0;0.06;0.2;0.3"/>
  </rect>
  <text x="582" y="126" fill="#4F8FFF" font-family="monospace" font-size="6.5" text-anchor="middle">3D Res-Attn</text>
  <text x="582" y="138" fill="#4F8FFF" font-family="monospace" font-size="6.5" text-anchor="middle">U-Net</text>

  <line x1="630" y1="130" x2="638" y2="130" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="638,127 644,130 638,133" fill="#1A2540" opacity="0.7"/>
  <circle r="1.8" fill="#8A5DFF" filter="url(#bt-glow-s)">
    <animateMotion dur="6s" begin="3.2s" repeatCount="indefinite" path="M582,130 L648,130"/>
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" dur="6s" begin="3.2s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.88;1"/>
  </circle>

  <!-- Step 4 -->
  <rect x="648" y="115" width="96" height="30" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="648" y="115" width="96" height="30" rx="4" fill="none" stroke="#8A5DFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" begin="3.6s" repeatCount="indefinite" keyTimes="0;0.06;0.2;0.3"/>
  </rect>
  <text x="696" y="127" fill="#F0F4FF" font-family="monospace" font-size="7" text-anchor="middle">Segmentation</text>
  <text x="696" y="139" fill="#7B8DB0" font-family="monospace" font-size="6" text-anchor="middle">Multi-Class</text>

  <line x1="744" y1="130" x2="752" y2="130" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="752,127 758,130 752,133" fill="#1A2540" opacity="0.7"/>
  <circle r="1.8" fill="#00E6FF" filter="url(#bt-glow-s)">
    <animateMotion dur="6s" begin="4.4s" repeatCount="indefinite" path="M696,130 L762,130"/>
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" dur="6s" begin="4.4s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.88;1"/>
  </circle>

  <!-- Step 5 -->
  <rect x="762" y="115" width="96" height="30" rx="4" fill="#0A1120" stroke="#00E6FF" stroke-width="0.9"/>
  <rect x="762" y="115" width="96" height="30" rx="4" fill="none" stroke="#00E6FF" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" begin="4.8s" repeatCount="indefinite" keyTimes="0;0.06;0.2;0.3"/>
  </rect>
  <text x="810" y="127" fill="#00E6FF" font-family="monospace" font-size="7" text-anchor="middle" opacity="0.85">Grad-CAM++</text>
  <text x="810" y="139" fill="#00E6FF" font-family="monospace" font-size="6" text-anchor="middle" opacity="0.6">Explainability</text>

  <!-- Metrics divider -->
  <line x1="300" y1="162" x2="870" y2="162" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- 4 metric cards -->
  <!-- Dice Score -->
  <rect x="306" y="170" width="132" height="56" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="322" y="195" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="22" font-weight="700">0.87</text>
  <text x="322" y="211" fill="#7B8DB0" font-family="monospace" font-size="7">Dice Score</text>
  <text x="322" y="222" fill="#3D4F70" font-family="monospace" font-size="6.5">Multi-class avg</text>

  <!-- Dataset -->
  <rect x="452" y="170" width="132" height="56" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="468" y="190" fill="#4F8FFF" font-family="monospace" font-size="11" font-weight="600">BraTS 2020</text>
  <text x="468" y="206" fill="#7B8DB0" font-family="monospace" font-size="7">Benchmark Dataset</text>
  <text x="468" y="219" fill="#3D4F70" font-family="monospace" font-size="6.5">4 MRI Modalities</text>

  <!-- Architecture -->
  <rect x="598" y="170" width="132" height="56" rx="4" fill="#050A12" stroke="#8A5DFF" stroke-width="1"/>
  <text x="614" y="188" fill="#8A5DFF" font-family="monospace" font-size="9" font-weight="600">3D Res-Attn</text>
  <text x="614" y="202" fill="#8A5DFF" font-family="monospace" font-size="9" font-weight="600">U-Net</text>
  <text x="614" y="218" fill="#3D4F70" font-family="monospace" font-size="6.5">Architecture</text>

  <!-- XAI -->
  <rect x="744" y="170" width="126" height="56" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="760" y="196" fill="#00E6FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700">XAI</text>
  <text x="760" y="213" fill="#7B8DB0" font-family="monospace" font-size="7">Grad-CAM++</text>

  <!-- Footer tech tags -->
  <line x1="40" y1="238" x2="860" y2="238" stroke="#1A2540" stroke-width="0.5" opacity="0.4"/>
  <text x="40" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">PyTorch</text>
  <text x="110" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">3D U-Net</text>
  <text x="196" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">MONAI</text>
  <text x="264" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Grad-CAM++</text>
  <text x="374" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">BraTS 2020</text>
  <text x="476" y="252" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Streamlit</text>
</svg>
