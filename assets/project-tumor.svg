<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pt-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pt-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pt-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="pt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pt-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#pt-bg)" rx="8"/>
  <rect width="900" height="260" fill="url(#pt-dots)" opacity="0.6" rx="8"/>
  <rect width="900" height="260" fill="none" stroke="#1E3A5F" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- ============ PIPELINE: 6 boxes, total width=820, each box=106, arrow=30, 5 arrows=150, 6 boxes=620, gaps=10 ============ -->
  <!-- Math: 820 / (6*106 + 5*30) = 820/786 → adjust: box=108, arrow=28 → 6*108+5*28=648+140=788 → close enough. Let box=107, arrow=27 → 642+135=777. Use box=110, arrow=14 → 660+70=730, gap start=(820-730)/2... -->
  <!-- Simplest: 6 boxes of 110px, 5 arrows of 14px: 660+70=730, left offset=40, right=770, 90px short. Use box=118, arrow=10 → 708+50=758, still short. Use box=120, arrow=16 → 720+80=800 = perfect! start at x=40. -->
  <text x="40" y="36" fill="#60A5FA" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.8">ARCHITECTURE PIPELINE</text>

  <!-- Step 1: MRI Input — x=40, w=120 -->
  <rect x="40" y="52" width="120" height="44" rx="5" fill="url(#pt-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="100" y="72" fill="#60A5FA" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">MRI Input</text>
  <text x="100" y="84" fill="#1E40AF" font-family="monospace" font-size="7" text-anchor="middle">BraTS 2020</text>

  <!-- Arrow -->
  <line x1="160" y1="74" x2="175" y2="74" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <polygon points="175,71 181,74 175,77" fill="#3B82F6" opacity="0.8"/>

  <!-- Step 2: Preprocess — x=181 -->
  <rect x="181" y="52" width="120" height="44" rx="5" fill="url(#pt-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="241" y="72" fill="#60A5FA" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Preprocess</text>
  <text x="241" y="84" fill="#1E40AF" font-family="monospace" font-size="7" text-anchor="middle">MONAI · Norm</text>

  <!-- Arrow -->
  <line x1="301" y1="74" x2="316" y2="74" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <polygon points="316,71 322,74 316,77" fill="#3B82F6" opacity="0.8"/>

  <!-- Step 3: 3D U-Net (highlighted) — x=322 -->
  <rect x="322" y="44" width="120" height="60" rx="5" fill="url(#pt-purple)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#pt-glow)" opacity="0.95"/>
  <text x="382" y="70" fill="#A78BFA" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">3D Res-Attn</text>
  <text x="382" y="82" fill="#A78BFA" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">U-Net</text>
  <text x="382" y="94" fill="#4C1D95" font-family="monospace" font-size="7" text-anchor="middle">Core Model</text>
  <rect x="322" y="44" width="120" height="60" rx="5" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4">
    <animate attributeName="stroke-width" values="0.5;2;0.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Arrow -->
  <line x1="442" y1="74" x2="457" y2="74" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <polygon points="457,71 463,74 457,77" fill="#8B5CF6" opacity="0.8"/>

  <!-- Step 4: Segment — x=463 -->
  <rect x="463" y="52" width="120" height="44" rx="5" fill="url(#pt-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="523" y="72" fill="#60A5FA" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Segment</text>
  <text x="523" y="84" fill="#1E40AF" font-family="monospace" font-size="7" text-anchor="middle">Multi-Class</text>

  <!-- Arrow -->
  <line x1="583" y1="74" x2="598" y2="74" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <polygon points="598,71 604,74 598,77" fill="#3B82F6" opacity="0.8"/>

  <!-- Step 5: Grad-CAM++ — x=604 -->
  <rect x="604" y="52" width="120" height="44" rx="5" fill="url(#pt-blue)" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
  <text x="664" y="72" fill="#7DD3FC" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Grad-CAM++</text>
  <text x="664" y="84" fill="#0C4A6E" font-family="monospace" font-size="7" text-anchor="middle">Explainability</text>

  <!-- Arrow -->
  <line x1="724" y1="74" x2="739" y2="74" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 2" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <polygon points="739,71 745,74 739,77" fill="#38BDF8" opacity="0.8"/>

  <!-- Step 6: Dashboard — x=745 -->
  <rect x="745" y="52" width="115" height="44" rx="5" fill="url(#pt-purple)" stroke="#8B5CF6" stroke-width="1" opacity="0.9"/>
  <text x="802" y="72" fill="#A78BFA" font-family="monospace" font-size="8" font-weight="600" text-anchor="middle">Streamlit</text>
  <text x="802" y="84" fill="#4C1D95" font-family="monospace" font-size="7" text-anchor="middle">Dashboard</text>

  <!-- ============ METRICS ROW: 5 cards, x=40→860, each=148, gap=20 ============ -->
  <!-- 5*148 + 4*20 = 740+80 = 820 = perfect -->
  <text x="40" y="130" fill="#60A5FA" font-family="monospace" font-size="9" letter-spacing="3" opacity="0.7">PERFORMANCE METRICS</text>

  <!-- Card 1: Dice Score — x=40 -->
  <rect x="40" y="142" width="148" height="64" rx="5" fill="url(#pt-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.85"/>
  <text x="114" y="168" fill="#60A5FA" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle">0.87</text>
  <text x="114" y="184" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle">Dice Score</text>
  <text x="114" y="196" fill="#1E3A5F" font-family="monospace" font-size="7" text-anchor="middle">Multi-class</text>

  <!-- Card 2: BraTS — x=208 -->
  <rect x="208" y="142" width="148" height="64" rx="5" fill="url(#pt-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.85"/>
  <text x="282" y="168" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">BraTS 2020</text>
  <text x="282" y="184" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle">Dataset</text>
  <text x="282" y="196" fill="#1E3A5F" font-family="monospace" font-size="7" text-anchor="middle">Benchmark</text>

  <!-- Card 3: Architecture — x=376, highlighted -->
  <rect x="376" y="138" width="148" height="72" rx="5" fill="url(#pt-purple)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#pt-glow)" opacity="0.95"/>
  <text x="450" y="164" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3D Res-Attn</text>
  <text x="450" y="178" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">U-Net</text>
  <text x="450" y="196" fill="#4C1D95" font-family="monospace" font-size="7" text-anchor="middle">Custom Architecture</text>

  <!-- Card 4: XAI — x=544 -->
  <rect x="544" y="142" width="148" height="64" rx="5" fill="url(#pt-blue)" stroke="#38BDF8" stroke-width="1" opacity="0.85"/>
  <text x="618" y="170" fill="#7DD3FC" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">XAI</text>
  <text x="618" y="185" fill="#0C4A6E" font-family="monospace" font-size="8" text-anchor="middle">Grad-CAM++</text>
  <text x="618" y="197" fill="#0F172A" font-family="monospace" font-size="7" text-anchor="middle">Explainability</text>

  <!-- Card 5: MONAI — x=712 -->
  <rect x="712" y="142" width="148" height="64" rx="5" fill="url(#pt-purple)" stroke="#8B5CF6" stroke-width="1" opacity="0.85"/>
  <text x="786" y="170" fill="#A78BFA" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">MONAI</text>
  <text x="786" y="185" fill="#4C1D95" font-family="monospace" font-size="8" text-anchor="middle">Medical AI</text>
  <text x="786" y="197" fill="#0F172A" font-family="monospace" font-size="7" text-anchor="middle">Framework</text>

  <!-- ============ TAGS: evenly spaced across full width ============ -->
  <line x1="40" y1="224" x2="860" y2="224" stroke="#1E3A5F" stroke-width="0.6" opacity="0.4"/>
  <text x="40"  y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">PyTorch</text>
  <text x="152" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">3D U-Net</text>
  <text x="274" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">MONAI</text>
  <text x="386" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">Grad-CAM++</text>
  <text x="534" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">BraTS 2020</text>
  <text x="676" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">Streamlit</text>
  <text x="766" y="239" fill="#3B82F6" font-family="monospace" font-size="9" opacity="0.7">PyTorch</text>
</svg>
