<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="pt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="pt-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="pt-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pt-glow-s"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="260" rx="8" fill="url(#pt-bg)"/>
  <rect width="900" height="260" rx="8" fill="url(#pt-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="260" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect x="1" y="1" width="0" height="1.5" rx="1" fill="url(#pt-accent)">
    <animate attributeName="width" values="0;350" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Header -->
  <text x="40" y="28" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="3">FEATURED PROJECT — 01</text>
  <text x="40" y="54" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="18" font-weight="600">Brain Tumor Detection &amp; Segmentation</text>

  <!-- Tags -->
  <rect x="40" y="63" width="92" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="86" y="76" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Medical Imaging</text>
  <rect x="140" y="63" width="82" height="18" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7"/>
  <text x="181" y="76" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="middle">Deep Learning</text>
  <rect x="230" y="63" width="82" height="18" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.7"/>
  <text x="271" y="76" fill="#00E6FF" font-family="monospace" font-size="7.5" text-anchor="middle">Explainable AI</text>

  <line x1="40" y1="96" x2="860" y2="96" stroke="#1A2540" stroke-width="0.8" opacity="0.8"/>

  <!-- PIPELINE LABEL -->
  <text x="40" y="112" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="2">PIPELINE</text>

  <!-- ── SEQUENTIAL PIPELINE LIGHTING ── -->
  <!-- Each box has a repeating glow that fires in sequence like data flowing through -->
  <!-- Cycle period = 7s, each box offset by 7/6 ≈ 1.17s -->

  <!-- BOX 1: MRI Input -->
  <rect x="40" y="120" width="114" height="38" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="40" y="120" width="114" height="38" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="7s" begin="0s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="97" y="136" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">MRI Input</text>
  <text x="97" y="150" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">BraTS 2020</text>

  <!-- Traveling particle between boxes -->
  <circle r="2" fill="#4F8FFF" filter="url(#pt-glow-s)">
    <animateMotion dur="7s" begin="0.9s" repeatCount="indefinite" path="M97,139 L164,139"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="7s" begin="0.9s" repeatCount="indefinite" keyTimes="0;0;0.04;0.12;0.16"/>
  </circle>

  <!-- Arrow 1 -->
  <line x1="154" y1="139" x2="162" y2="139" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="162,136 168,139 162,142" fill="#1A2540" opacity="0.7"/>

  <!-- BOX 2: Preprocess -->
  <rect x="168" y="120" width="114" height="38" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="168" y="120" width="114" height="38" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="7s" begin="1.17s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="225" y="136" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Preprocess</text>
  <text x="225" y="150" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">MONAI · Norm</text>

  <circle r="2" fill="#4F8FFF" filter="url(#pt-glow-s)">
    <animateMotion dur="7s" begin="2.07s" repeatCount="indefinite" path="M225,139 L292,139"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="7s" begin="2.07s" repeatCount="indefinite" keyTimes="0;0;0.04;0.12;0.16"/>
  </circle>

  <!-- Arrow 2 -->
  <line x1="282" y1="139" x2="290" y2="139" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="290,136 296,139 290,142" fill="#1A2540" opacity="0.7"/>

  <!-- BOX 3: Highlight — Res-Attn U-Net -->
  <rect x="296" y="116" width="114" height="46" rx="4" fill="#0A1120" stroke="#4F8FFF" stroke-width="1.2"/>
  <rect x="296" y="116" width="114" height="46" rx="4" fill="#4F8FFF" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="296" y="116" width="114" height="46" rx="4" fill="none" stroke="#4F8FFF" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="2.34s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="353" y="134" fill="#4F8FFF" font-family="monospace" font-size="7" font-weight="600" text-anchor="middle">3D Res-Attn U-Net</text>
  <text x="353" y="147" fill="#4F8FFF" font-family="monospace" font-size="6.5" text-anchor="middle">Core Model</text>

  <circle r="2" fill="#4F8FFF" filter="url(#pt-glow-s)">
    <animateMotion dur="7s" begin="3.24s" repeatCount="indefinite" path="M353,139 L420,139"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="7s" begin="3.24s" repeatCount="indefinite" keyTimes="0;0;0.04;0.12;0.16"/>
  </circle>

  <!-- Arrow 3 -->
  <line x1="410" y1="139" x2="418" y2="139" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="418,136 424,139 418,142" fill="#1A2540" opacity="0.7"/>

  <!-- BOX 4: Segment -->
  <rect x="424" y="120" width="114" height="38" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="424" y="120" width="114" height="38" rx="4" fill="none" stroke="#8A5DFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="7s" begin="3.51s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="481" y="136" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Segment</text>
  <text x="481" y="150" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">Multi-Class</text>

  <circle r="2" fill="#8A5DFF" filter="url(#pt-glow-s)">
    <animateMotion dur="7s" begin="4.41s" repeatCount="indefinite" path="M481,139 L548,139"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="7s" begin="4.41s" repeatCount="indefinite" keyTimes="0;0;0.04;0.12;0.16"/>
  </circle>

  <!-- Arrow 4 -->
  <line x1="538" y1="139" x2="546" y2="139" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="546,136 552,139 546,142" fill="#1A2540" opacity="0.7"/>

  <!-- BOX 5: Grad-CAM++ -->
  <rect x="552" y="120" width="114" height="38" rx="4" fill="#0A1120" stroke="#00E6FF" stroke-width="0.9"/>
  <rect x="552" y="120" width="114" height="38" rx="4" fill="none" stroke="#00E6FF" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="7s" begin="4.68s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="609" y="136" fill="#00E6FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle" opacity="0.85">Grad-CAM++</text>
  <text x="609" y="150" fill="#00E6FF" font-family="monospace" font-size="6.5" text-anchor="middle" opacity="0.6">Explainability</text>

  <circle r="2" fill="#00E6FF" filter="url(#pt-glow-s)">
    <animateMotion dur="7s" begin="5.58s" repeatCount="indefinite" path="M609,139 L676,139"/>
    <animate attributeName="opacity" values="0;0;0.9;0.9;0" dur="7s" begin="5.58s" repeatCount="indefinite" keyTimes="0;0;0.04;0.12;0.16"/>
  </circle>

  <!-- Arrow 5 -->
  <line x1="666" y1="139" x2="674" y2="139" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="674,136 680,139 674,142" fill="#1A2540" opacity="0.7"/>

  <!-- BOX 6: Streamlit -->
  <rect x="680" y="120" width="114" height="38" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <rect x="680" y="120" width="114" height="38" rx="4" fill="none" stroke="#00FFAE" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="7s" begin="5.85s" repeatCount="indefinite" keyTimes="0;0.05;0.18;0.28"/>
  </rect>
  <text x="737" y="136" fill="#F0F4FF" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">Streamlit</text>
  <text x="737" y="150" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">Dashboard</text>

  <!-- Metrics divider -->
  <line x1="40" y1="174" x2="860" y2="174" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- 5 METRIC CARDS -->
  <rect x="40" y="182" width="148" height="52" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="64" y="202" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700">0.87</text>
  <text x="64" y="215" fill="#7B8DB0" font-family="monospace" font-size="7">Dice Score</text>
  <text x="64" y="226" fill="#3D4F70" font-family="monospace" font-size="6.5">Multi-class</text>

  <rect x="208" y="182" width="148" height="52" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="232" y="205" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="13" font-weight="600">BraTS 2020</text>
  <text x="232" y="221" fill="#7B8DB0" font-family="monospace" font-size="7">Dataset Benchmark</text>

  <rect x="376" y="182" width="148" height="52" rx="4" fill="#050A12" stroke="#8A5DFF" stroke-width="1"/>
  <text x="400" y="200" fill="#8A5DFF" font-family="monospace" font-size="7.5" font-weight="600">3D Res-Attn</text>
  <text x="400" y="212" fill="#8A5DFF" font-family="monospace" font-size="7.5" font-weight="600">U-Net</text>
  <text x="400" y="226" fill="#3D4F70" font-family="monospace" font-size="6.5">Architecture</text>

  <rect x="544" y="182" width="148" height="52" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="568" y="206" fill="#00E6FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700">XAI</text>
  <text x="568" y="221" fill="#7B8DB0" font-family="monospace" font-size="7">Grad-CAM++</text>

  <rect x="712" y="182" width="148" height="52" rx="4" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="736" y="205" fill="#8A5DFF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="16" font-weight="700">MONAI</text>
  <text x="736" y="221" fill="#7B8DB0" font-family="monospace" font-size="7">Medical AI Framework</text>

  <!-- Tech tags -->
  <line x1="40" y1="244" x2="860" y2="244" stroke="#1A2540" stroke-width="0.5" opacity="0.4"/>
  <text x="40" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">PyTorch</text>
  <text x="110" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">3D U-Net</text>
  <text x="196" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">MONAI</text>
  <text x="264" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Grad-CAM++</text>
  <text x="374" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">BraTS 2020</text>
  <text x="476" y="256" fill="#4F8FFF" font-family="monospace" font-size="8.5" opacity="0.7">Streamlit</text>
</svg>
