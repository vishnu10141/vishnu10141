<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="core-glow-main" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-sphere" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="65%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="ring-a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="1"/>
      <stop offset="75%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-f" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-xl" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Circuit pattern -->
    <pattern id="circuit" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 L20 30 M40 30 L60 30 M30 0 L30 20 M30 40 L30 60" stroke="#1E293B" stroke-width="0.6" fill="none" opacity="0.5"/>
      <circle cx="30" cy="30" r="3" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="30" r="1.5" fill="#1E293B" opacity="0.3"/>
      <circle cx="60" cy="30" r="1.5" fill="#1E293B" opacity="0.3"/>
      <circle cx="30" cy="0" r="1.5" fill="#1E293B" opacity="0.3"/>
      <circle cx="30" cy="60" r="1.5" fill="#1E293B" opacity="0.3"/>
    </pattern>
    <!-- Dot grid pattern -->
    <pattern id="dot-grid" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="0.8" fill="#1E293B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bg-radial)"/>
  <!-- Background patterns -->
  <rect width="900" height="420" fill="url(#dot-grid)" opacity="0.7"/>
  <rect width="900" height="420" fill="url(#circuit)" opacity="0.4"/>

  <!-- Center large ambient glow -->
  <ellipse cx="450" cy="210" rx="200" ry="160" fill="url(#core-glow-main)" opacity="0.9">
    <animate attributeName="rx" values="200;220;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="160;175;160" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============ OUTER STRUCTURAL RINGS ============ -->
  <!-- Outer ring 1 - large tilted -->
  <ellipse cx="450" cy="210" rx="175" ry="60" fill="none" stroke="#3B82F6" stroke-width="0.6" opacity="0.2" transform="rotate(-25 450 210)" stroke-dasharray="6 8">
    <animateTransform attributeName="transform" type="rotate" from="-25 450 210" to="335 450 210" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Outer ring 2 - animated slow -->
  <ellipse cx="450" cy="210" rx="158" ry="55" fill="none" stroke="url(#ring-c)" stroke-width="1" opacity="0.4" transform="rotate(15 450 210)">
    <animateTransform attributeName="transform" type="rotate" from="15 450 210" to="375 450 210" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 3 - medium purple -->
  <ellipse cx="450" cy="210" rx="130" ry="48" fill="none" stroke="url(#ring-b)" stroke-width="1.5" opacity="0.6" transform="rotate(-10 450 210)">
    <animateTransform attributeName="transform" type="rotate" from="-10 450 210" to="350 450 210" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 4 - medium blue animated opposite -->
  <ellipse cx="450" cy="210" rx="108" ry="40" fill="none" stroke="url(#ring-a)" stroke-width="2" opacity="0.75" transform="rotate(0 450 210)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 210" to="-360 450 210" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ring 5 - inner close ring -->
  <ellipse cx="450" cy="210" rx="78" ry="30" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.5" transform="rotate(20 450 210)">
    <animateTransform attributeName="transform" type="rotate" from="20 450 210" to="380 450 210" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Equatorial belt - static -->
  <ellipse cx="450" cy="210" rx="115" ry="10" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.2"/>

  <!-- ============ CORE SPHERE ============ -->
  <circle cx="450" cy="210" r="62" fill="url(#core-sphere)" filter="url(#glow-f)"/>
  <!-- Sphere rim -->
  <circle cx="450" cy="210" r="62" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <!-- Sphere highlight -->
  <ellipse cx="432" cy="192" rx="18" ry="13" fill="#FFFFFF" opacity="0.08" transform="rotate(-20 432 192)"/>
  <!-- Inner sphere line detail -->
  <path d="M 415 210 Q 450 195 485 210" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
  <path d="M 420 225 Q 450 240 480 225" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>

  <!-- Meridian lines on sphere -->
  <ellipse cx="450" cy="210" rx="62" ry="20" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.1"/>
  <ellipse cx="450" cy="210" rx="40" ry="62" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.1"/>

  <!-- ============ CENTER INTELLIGENCE NODE ============ -->
  <!-- Pulsing aura -->
  <circle cx="450" cy="210" r="20" fill="#3B82F6" opacity="0.1">
    <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="210" r="15" fill="#3B82F6" opacity="0.2">
    <animate attributeName="r" values="15;22;15" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Core glow -->
  <circle cx="450" cy="210" r="11" fill="#3B82F6" filter="url(#glow-xl)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Core point -->
  <circle cx="450" cy="210" r="7" fill="#60A5FA"/>
  <circle cx="450" cy="210" r="3" fill="#FFFFFF"/>

  <!-- ============ ORBITING NODES ============ -->

  <!-- Large node 1 (blue, fast) -->
  <g filter="url(#glow-sm)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 210" to="360 450 210" dur="7s" repeatCount="indefinite"/>
    <circle cx="450" cy="148" r="8" fill="#3B82F6"/>
    <circle cx="450" cy="148" r="14" fill="#3B82F6" opacity="0.15">
      <animate attributeName="r" values="14;20;14" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Large node 2 (purple, medium) -->
  <g filter="url(#glow-sm)">
    <animateTransform attributeName="transform" type="rotate" from="120 450 210" to="480 450 210" dur="7s" repeatCount="indefinite"/>
    <circle cx="450" cy="148" r="6" fill="#8B5CF6"/>
    <circle cx="450" cy="148" r="11" fill="#8B5CF6" opacity="0.15">
      <animate attributeName="r" values="11;17;11" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Large node 3 (cyan, medium) -->
  <g filter="url(#glow-sm)">
    <animateTransform attributeName="transform" type="rotate" from="240 450 210" to="600 450 210" dur="7s" repeatCount="indefinite"/>
    <circle cx="450" cy="148" r="5" fill="#38BDF8"/>
    <circle cx="450" cy="148" r="9" fill="#38BDF8" opacity="0.15">
      <animate attributeName="r" values="9;14;9" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Small outer nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="60 450 210" to="420 450 210" dur="14s" repeatCount="indefinite"/>
    <circle cx="450" cy="115" r="4" fill="#60A5FA" opacity="0.7"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="200 450 210" to="560 450 210" dur="14s" repeatCount="indefinite"/>
    <circle cx="450" cy="115" r="3" fill="#A78BFA" opacity="0.6"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="330 450 210" to="690 450 210" dur="14s" repeatCount="indefinite"/>
    <circle cx="450" cy="115" r="3.5" fill="#7DD3FC" opacity="0.65"/>
  </g>

  <!-- ============ SIGNAL PARTICLES TRAVELING ALONG PATHS ============ -->
  <!-- Signal 1 along outer ellipse -->
  <circle r="2.5" fill="#FFFFFF" opacity="0.9" filter="url(#glow-sm)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M450,52 C605,52 760,140 760,210 C760,280 605,368 450,368 C295,368 140,280 140,210 C140,140 295,52 450,52"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Signal 2 reverse -->
  <circle r="2" fill="#8B5CF6" opacity="0.8" filter="url(#glow-sm)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M450,368 C295,368 140,280 140,210 C140,140 295,52 450,52 C605,52 760,140 760,210 C760,280 605,368 450,368"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ OUTER DATA POINT CLUSTER (decorative node network) ============ -->
  <!-- Top-left cluster -->
  <circle cx="190" cy="110" r="4" fill="#334155" stroke="#3B82F6" stroke-width="0.8" opacity="0.7"/>
  <circle cx="220" cy="90" r="3" fill="#334155" stroke="#60A5FA" stroke-width="0.6" opacity="0.5"/>
  <circle cx="160" cy="140" r="3" fill="#334155" stroke="#8B5CF6" stroke-width="0.6" opacity="0.5"/>
  <line x1="190" y1="110" x2="220" y2="90" stroke="#3B82F6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="190" y1="110" x2="160" y2="140" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="190" y1="110" x2="340" y2="160" stroke="#3B82F6" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.5s" repeatCount="indefinite"/>
  </line>

  <!-- Top-right cluster -->
  <circle cx="710" cy="110" r="4" fill="#334155" stroke="#8B5CF6" stroke-width="0.8" opacity="0.7"/>
  <circle cx="680" cy="88" r="3" fill="#334155" stroke="#3B82F6" stroke-width="0.6" opacity="0.5"/>
  <circle cx="740" cy="135" r="3" fill="#334155" stroke="#38BDF8" stroke-width="0.6" opacity="0.5"/>
  <line x1="710" y1="110" x2="680" y2="88" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="710" y1="110" x2="740" y2="135" stroke="#38BDF8" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="2.3s" repeatCount="indefinite"/>
  </line>
  <line x1="710" y1="110" x2="560" y2="160" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom-left cluster -->
  <circle cx="200" cy="310" r="4" fill="#334155" stroke="#60A5FA" stroke-width="0.8" opacity="0.7"/>
  <circle cx="170" cy="285" r="3" fill="#334155" stroke="#3B82F6" stroke-width="0.6" opacity="0.5"/>
  <circle cx="230" cy="335" r="3" fill="#334155" stroke="#8B5CF6" stroke-width="0.6" opacity="0.5"/>
  <line x1="200" y1="310" x2="170" y2="285" stroke="#60A5FA" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="310" x2="230" y2="335" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.7s" repeatCount="indefinite"/>
  </line>
  <line x1="200" y1="310" x2="340" y2="260" stroke="#60A5FA" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom-right cluster -->
  <circle cx="700" cy="310" r="4" fill="#334155" stroke="#38BDF8" stroke-width="0.8" opacity="0.7"/>
  <circle cx="730" cy="285" r="3" fill="#334155" stroke="#8B5CF6" stroke-width="0.6" opacity="0.5"/>
  <circle cx="670" cy="335" r="3" fill="#334155" stroke="#3B82F6" stroke-width="0.6" opacity="0.5"/>
  <line x1="700" y1="310" x2="730" y2="285" stroke="#38BDF8" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="1.9s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="310" x2="670" y2="335" stroke="#3B82F6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 3">
    <animate attributeName="stroke-dashoffset" values="0;-5" dur="2.6s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="310" x2="560" y2="260" stroke="#38BDF8" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.1s" repeatCount="indefinite"/>
  </line>

  <!-- Floating micro particles -->
  <circle cx="100" cy="200" r="1.5" fill="#3B82F6" opacity="0.5">
    <animate attributeName="cy" values="200;190;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="1.5" fill="#8B5CF6" opacity="0.5">
    <animate attributeName="cy" values="200;210;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="40" r="1.5" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cx" values="450;460;450" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="385" r="1.5" fill="#60A5FA" opacity="0.4">
    <animate attributeName="cx" values="450;440;450" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
