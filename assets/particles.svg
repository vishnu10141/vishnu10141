<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <defs>
    <radialGradient id="pa-glow-center" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="pa-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Top-to-bottom fade for soft edge -->
    <linearGradient id="pa-fade-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Transparent background (inherits page BG) -->
  <rect width="900" height="90" fill="#020617" opacity="0"/>

  <!-- Ambient center glow -->
  <rect width="900" height="90" fill="url(#pa-glow-center)"/>

  <!-- ============ NEURAL MESH CONNECTIONS ============ -->
  <!-- Connection: Node 1 (45,22) → Node 4 (130,50) -->
  <line x1="45" y1="22" x2="130" y2="50" stroke="#3B82F6" stroke-width="0.45" opacity="0.14" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 4 (130,50) → Node 7 (215,28) -->
  <line x1="130" y1="50" x2="215" y2="28" stroke="#3B82F6" stroke-width="0.4" opacity="0.12" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 7 (215,28) → Node 11 (315,15) -->
  <line x1="215" y1="28" x2="315" y2="15" stroke="#8B5CF6" stroke-width="0.4" opacity="0.1" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 11 (315,15) → Node 14 (390,28) -->
  <line x1="315" y1="15" x2="390" y2="28" stroke="#3B82F6" stroke-width="0.45" opacity="0.14" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.2s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 14 (390,28) → Center (450,45) -->
  <line x1="390" y1="28" x2="450" y2="45" stroke="#38BDF8" stroke-width="0.5" opacity="0.18" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Center (450,45) → Node 17 (520,18) -->
  <line x1="450" y1="45" x2="520" y2="18" stroke="#3B82F6" stroke-width="0.5" opacity="0.18" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.9s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 17 (520,18) → Node 20 (575,50) -->
  <line x1="520" y1="18" x2="575" y2="50" stroke="#8B5CF6" stroke-width="0.4" opacity="0.12" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 20 (575,50) → Node 23 (650,30) -->
  <line x1="575" y1="50" x2="650" y2="30" stroke="#3B82F6" stroke-width="0.4" opacity="0.12" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 23 (650,30) → Node 26 (735,22) -->
  <line x1="650" y1="30" x2="735" y2="22" stroke="#38BDF8" stroke-width="0.4" opacity="0.1" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <!-- Connection: Node 26 (735,22) → Node 29 (820,30) -->
  <line x1="735" y1="22" x2="820" y2="30" stroke="#8B5CF6" stroke-width="0.4" opacity="0.12" stroke-dasharray="3 5">
    <animate attributeName="stroke-dashoffset" values="0;-8" dur="2.6s" repeatCount="indefinite"/>
  </line>
  <!-- Cross connections for richer mesh -->
  <line x1="130" y1="50" x2="215" y2="65" stroke="#3B82F6" stroke-width="0.35" opacity="0.08" stroke-dasharray="2 5"/>
  <line x1="345" y1="48" x2="390" y2="28" stroke="#60A5FA" stroke-width="0.35" opacity="0.1" stroke-dasharray="2 5">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="490" y1="35" x2="575" y2="50" stroke="#38BDF8" stroke-width="0.35" opacity="0.1" stroke-dasharray="2 5"/>
  <line x1="650" y1="62" x2="735" y2="22" stroke="#8B5CF6" stroke-width="0.35" opacity="0.08" stroke-dasharray="2 5"/>

  <!-- ============ PARTICLE NODES ============ -->
  <!-- Col 1 -->
  <circle cx="45" cy="22" r="1.3" fill="#3B82F6" opacity="0.55">
    <animate attributeName="cy" values="22;14;22" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.12;0.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="68" cy="55" r="0.9" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="cy" values="55;63;55" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="22" cy="65" r="1.5" fill="#38BDF8" opacity="0.32">
    <animate attributeName="cy" values="65;55;65" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.32;0.07;0.32" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 2 -->
  <circle cx="130" cy="50" r="1.2" fill="#60A5FA" opacity="0.5">
    <animate attributeName="cy" values="50;40;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="18" r="1.5" fill="#3B82F6" opacity="0.38">
    <animate attributeName="cy" values="18;28;18" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.38;0.08;0.38" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="72" r="0.8" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="cy" values="72;64;72" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 3 -->
  <circle cx="215" cy="28" r="1.3" fill="#3B82F6" opacity="0.45">
    <animate attributeName="cy" values="28;20;28" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="65" r="1" fill="#38BDF8" opacity="0.35">
    <animate attributeName="cy" values="65;55;65" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 4 -->
  <circle cx="315" cy="15" r="1" fill="#8B5CF6" opacity="0.55">
    <animate attributeName="cy" values="15;23;15" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.12;0.55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="345" cy="48" r="1.4" fill="#60A5FA" opacity="0.45">
    <animate attributeName="cy" values="48;38;48" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="70" r="1" fill="#3B82F6" opacity="0.3">
    <animate attributeName="cy" values="70;78;70" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 5 / center-left -->
  <circle cx="390" cy="28" r="1.5" fill="#38BDF8" opacity="0.5">
    <animate attributeName="cy" values="28;20;28" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="68" r="0.9" fill="#3B82F6" opacity="0.35">
    <animate attributeName="cy" values="68;76;68" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 6 / center — brightest node -->
  <circle cx="450" cy="45" r="2" fill="#60A5FA" opacity="0.7" filter="url(#pa-blur-sm)">
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="20" r="1.2" fill="#8B5CF6" opacity="0.5">
    <animate attributeName="cy" values="20;30;20" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="70" r="1.2" fill="#3B82F6" opacity="0.4">
    <animate attributeName="cy" values="70;60;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 7 -->
  <circle cx="520" cy="18" r="1.5" fill="#3B82F6" opacity="0.38">
    <animate attributeName="cy" values="18;28;18" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.38;0.07;0.38" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="50" r="1" fill="#60A5FA" opacity="0.4">
    <animate attributeName="cy" values="50;40;50" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 8 -->
  <circle cx="575" cy="50" r="1.3" fill="#8B5CF6" opacity="0.48">
    <animate attributeName="cy" values="50;38;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.48;0.1;0.48" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="22" r="0.9" fill="#38BDF8" opacity="0.35">
    <animate attributeName="cy" values="22;32;22" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.06;0.35" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="555" cy="72" r="1" fill="#60A5FA" opacity="0.3">
    <animate attributeName="cy" values="72;62;72" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 9 -->
  <circle cx="650" cy="30" r="1.4" fill="#3B82F6" opacity="0.52">
    <animate attributeName="cy" values="30;20;30" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.52;0.12;0.52" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="678" cy="62" r="0.8" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="cy" values="62;70;62" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 10 -->
  <circle cx="735" cy="22" r="1.5" fill="#38BDF8" opacity="0.42">
    <animate attributeName="cy" values="22;14;22" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.42;0.08;0.42" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="758" cy="55" r="1" fill="#3B82F6" opacity="0.35">
    <animate attributeName="cy" values="55;65;55" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.06;0.35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="715" cy="72" r="0.9" fill="#60A5FA" opacity="0.3">
    <animate attributeName="cy" values="72;64;72" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Col 11 -->
  <circle cx="820" cy="30" r="1.2" fill="#8B5CF6" opacity="0.48">
    <animate attributeName="cy" values="30;40;30" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.48;0.1;0.48" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="845" cy="65" r="0.9" fill="#3B82F6" opacity="0.35">
    <animate attributeName="cy" values="65;55;65" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="878" cy="20" r="1.5" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cy" values="20;30;20" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling signal particle -->
  <circle r="2" fill="#FFFFFF" opacity="0.7" filter="url(#pa-blur-sm)">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 45 22 C 130 50 215 28 315 15 C 390 28 450 45 520 18 C 575 50 650 30 735 22 C 820 30 878 20 900 30"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Edge fade overlays -->
  <rect x="0" y="0" width="60" height="90" fill="url(#pa-fade-top)" opacity="0.7"/>
  <rect x="840" y="0" width="60" height="90" fill="url(#pa-fade-top)" opacity="0.7"/>
  <rect width="900" height="90" fill="url(#pa-fade-top)"/>
</svg>
