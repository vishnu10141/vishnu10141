<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <filter id="tl-glow-v" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="#050A12"/>

  <!-- Section label -->
  <text x="40" y="24" fill="#3D4F70" font-size="9" font-family="monospace" letter-spacing="4" opacity="0.7">CAREER TIMELINE</text>

  <!-- Vertical connector line -->
  <line x1="200" y1="34" x2="200" y2="240" stroke="#1A2540" stroke-width="1" opacity="0.7"/>

  <!-- ===== EVENT 1 — 2022, IIIT Hyderabad ===== -->
  <!-- Year label -->
  <text x="180" y="52" fill="#3D4F70" font-size="10" font-family="monospace" text-anchor="end" letter-spacing="1">2022</text>
  <!-- Outer node -->
  <circle cx="200" cy="48" r="4" fill="#050A12" stroke="#8A5DFF" stroke-width="1.5"/>
  <!-- Inner node -->
  <circle cx="200" cy="48" r="2" fill="#8A5DFF" opacity="0.8"/>
  <!-- Horizontal connector -->
  <line x1="200" y1="48" x2="220" y2="48" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Institution name -->
  <text x="228" y="44" fill="#F0F4FF" font-size="13" font-weight="600" font-family="'SF Pro Display', -apple-system, Inter, sans-serif">IIIT Hyderabad</text>
  <!-- Role badge background -->
  <rect x="228" y="50" width="130" height="16" rx="3" fill="#0A1120" stroke="#1A2540" stroke-width="0.7"/>
  <!-- Role text -->
  <text x="234" y="62" fill="#8A5DFF" font-size="8" font-family="monospace">NLP Intern</text>
  <!-- Description -->
  <text x="228" y="76" fill="#7B8DB0" font-size="9" font-family="monospace">Low-resource Telugu NLP · Corpus Construction</text>

  <!-- ===== EVENT 2 — 2023, DRDO ===== -->
  <!-- Year label -->
  <text x="180" y="118" fill="#3D4F70" font-size="10" font-family="monospace" text-anchor="end" letter-spacing="1">2023</text>
  <!-- Outer node -->
  <circle cx="200" cy="114" r="4" fill="#050A12" stroke="#4F8FFF" stroke-width="1.5"/>
  <!-- Inner node -->
  <circle cx="200" cy="114" r="2" fill="#4F8FFF" opacity="0.8"/>
  <!-- Horizontal connector -->
  <line x1="200" y1="114" x2="220" y2="114" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Institution name -->
  <text x="228" y="110" fill="#F0F4FF" font-size="13" font-weight="600" font-family="'SF Pro Display', -apple-system, Inter, sans-serif">DRDO</text>
  <!-- Role badge background -->
  <rect x="228" y="116" width="186" height="16" rx="3" fill="#0A1120" stroke="#1A2540" stroke-width="0.7"/>
  <!-- Role text -->
  <text x="234" y="128" fill="#4F8FFF" font-size="8" font-family="monospace">ML Intern</text>
  <!-- Description -->
  <text x="228" y="142" fill="#7B8DB0" font-size="9" font-family="monospace">Radar Signal Classification · Ensemble Methods</text>

  <!-- ===== EVENT 3 — 2024, CS&E Graduate ===== -->
  <!-- Year label -->
  <text x="180" y="184" fill="#3D4F70" font-size="10" font-family="monospace" text-anchor="end" letter-spacing="1">2026</text>
  <!-- Outer node -->
  <circle cx="200" cy="180" r="4" fill="#050A12" stroke="#1A2540" stroke-width="1.5"/>
  <!-- Inner node -->
  <circle cx="200" cy="180" r="2" fill="#1A2540" opacity="0.8"/>
  <!-- Horizontal connector -->
  <line x1="200" y1="180" x2="220" y2="180" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Institution name -->
  <text x="228" y="176" fill="#F0F4FF" font-size="13" font-weight="600" font-family="'SF Pro Display', -apple-system, Inter, sans-serif">CS&amp;E Graduate</text>
  <!-- Sub text -->
  <text x="228" y="192" fill="#7B8DB0" font-size="9" font-family="monospace">B.Tech · Computer Science &amp; Engineering</text>

  <!-- ===== EVENT 4 — NOW, Available ===== -->
  <!-- Year label -->
  <text x="180" y="236" fill="#00FFAE" font-size="10" font-family="monospace" text-anchor="end" letter-spacing="1" opacity="0.8">NOW</text>
  <!-- Outer node -->
  <circle cx="200" cy="232" r="5" fill="#050A12" stroke="#00FFAE" stroke-width="1.5"/>
  <!-- Inner node with pulse -->
  <circle cx="200" cy="232" r="2.5" fill="#00FFAE" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Horizontal connector -->
  <line x1="200" y1="232" x2="220" y2="232" stroke="#00FFAE" stroke-width="0.8" opacity="0.4"/>
  <!-- Open text -->
  <text x="228" y="228" fill="#00FFAE" font-size="13" font-weight="600" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" opacity="0.9">Open to Opportunities</text>
  <!-- Badge background -->
  <rect x="228" y="234" width="154" height="16" rx="3" fill="#050A12" stroke="#00FFAE" stroke-width="0.7" opacity="0.5"/>
  <!-- Badge text -->
  <text x="234" y="246" fill="#00FFAE" font-size="8" font-family="monospace" opacity="0.7">Available · ML / AI Engineering</text>

  <!-- ===== TRAVEL PULSE on vertical connector ===== -->
  <circle r="1.5" fill="#4F8FFF" opacity="0.4">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath xmlns:xlink="http://www.w3.org/1999/xlink">
        <path d="M 200 34 L 200 240"/>
      </mpath>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="6s" repeatCount="indefinite"/>
  </circle>

</svg>
