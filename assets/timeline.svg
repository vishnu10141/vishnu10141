<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="tl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1A"/><stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="tl-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/><stop offset="100%" stop-color="#8A5DFF"/>
    </linearGradient>
    <linearGradient id="tl-line-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8FFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4F8FFF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#8A5DFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00FFAE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tl-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tl-glow-s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tl-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.4" fill="#1A2540" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="8" fill="url(#tl-bg)"/>
  <rect width="900" height="280" rx="8" fill="url(#tl-dots)"/>
  <rect width="900" height="280" rx="8" fill="url(#tl-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="280" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>

  <!-- Section label -->
  <text x="40" y="26" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="4" opacity="0.7">CAREER TIMELINE</text>

  <!-- ═══ VERTICAL CONNECTOR LINE ═══ -->
  <!-- Base line (dim) -->
  <line x1="200" y1="44" x2="200" y2="260" stroke="#1A2540" stroke-width="1.2" opacity="0.5"/>
  <!-- Animated glow line that "fills up" -->
  <line x1="200" y1="44" x2="200" y2="44" stroke="url(#tl-line-glow)" stroke-width="2" opacity="0.8">
    <animate attributeName="y2" values="44;260" dur="2.5s" fill="freeze"/>
  </line>
  <!-- Traveling pulse down the line -->
  <circle r="3" fill="#4F8FFF" filter="url(#tl-glow)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.7;0.7;0" dur="5s" begin="2.5s" repeatCount="indefinite" keyTimes="0;0.02;0.1;0.9;1"/>
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M200,44 L200,260"/>
  </circle>

  <!-- ═══ EVENT 1: IIIT Hyderabad (2022) ═══ -->
  <!-- Year label -->
  <text x="180" y="70" text-anchor="end" fill="#3D4F70" font-family="monospace" font-size="11" letter-spacing="1">2022</text>
  <!-- Node: outer ring + inner dot -->
  <circle cx="200" cy="66" r="7" fill="#060C1A" stroke="#8A5DFF" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="66" r="3" fill="#8A5DFF" opacity="0" filter="url(#tl-glow-s)">
    <animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.4s" fill="freeze"/>
  </circle>
  <!-- Expanding ring on arrival -->
  <circle cx="200" cy="66" r="7" fill="none" stroke="#8A5DFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="1s" begin="0.4s" fill="freeze"/>
    <animate attributeName="r" values="7;22" dur="1s" begin="0.4s" fill="freeze"/>
  </circle>
  <!-- Horizontal connector -->
  <line x1="207" y1="66" x2="230" y2="66" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="0.5s" fill="freeze"/>
  </line>
  <!-- Content card -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <text x="238" y="60" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="14" font-weight="600">IIIT Hyderabad</text>
    <rect x="238" y="68" width="78" height="18" rx="3" fill="#0A1120" stroke="#8A5DFF" stroke-width="0.7"/>
    <text x="244" y="81" fill="#8A5DFF" font-family="monospace" font-size="8">NLP Intern</text>
    <text x="238" y="102" fill="#7B8DB0" font-family="monospace" font-size="9">Low-resource Telugu NLP · Corpus Construction</text>
    <!-- Tech pills -->
    <rect x="540" y="55" width="54" height="16" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.6"/>
    <text x="567" y="67" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="7">Telugu</text>
    <rect x="600" y="55" width="38" height="16" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.6"/>
    <text x="619" y="67" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="7">NLP</text>
    <rect x="644" y="55" width="58" height="16" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.6"/>
    <text x="673" y="67" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="7">Corpus</text>
  </g>

  <!-- ═══ EVENT 2: DRDO (2023) ═══ -->
  <text x="180" y="142" text-anchor="end" fill="#3D4F70" font-family="monospace" font-size="11" letter-spacing="1">2023</text>
  <circle cx="200" cy="138" r="7" fill="#060C1A" stroke="#4F8FFF" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="138" r="3" fill="#4F8FFF" opacity="0" filter="url(#tl-glow-s)">
    <animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.9s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="138" r="7" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="1s" begin="0.9s" fill="freeze"/>
    <animate attributeName="r" values="7;22" dur="1s" begin="0.9s" fill="freeze"/>
  </circle>
  <line x1="207" y1="138" x2="230" y2="138" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="1.0s" fill="freeze"/>
  </line>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <text x="238" y="132" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="14" font-weight="600">DRDO</text>
    <rect x="238" y="140" width="66" height="18" rx="3" fill="#0A1120" stroke="#4F8FFF" stroke-width="0.7"/>
    <text x="244" y="153" fill="#4F8FFF" font-family="monospace" font-size="8">ML Intern</text>
    <text x="238" y="174" fill="#7B8DB0" font-family="monospace" font-size="9">Radar Signal Classification · Ensemble Methods</text>
    <!-- Tech pills -->
    <rect x="540" y="127" width="70" height="16" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.6"/>
    <text x="575" y="139" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7">XGBoost</text>
    <rect x="616" y="127" width="56" height="16" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.6"/>
    <text x="644" y="139" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7">Radar</text>
    <rect x="678" y="127" width="38" height="16" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.6"/>
    <text x="697" y="139" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7">SVM</text>
  </g>

  <!-- ═══ EVENT 3: CS&E Graduate (2026) ═══ -->
  <text x="180" y="214" text-anchor="end" fill="#3D4F70" font-family="monospace" font-size="11" letter-spacing="1">2026</text>
  <circle cx="200" cy="210" r="7" fill="#060C1A" stroke="#1A2540" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="210" r="3" fill="#7B8DB0" opacity="0">
    <animate attributeName="opacity" values="0;0.7" dur="0.4s" begin="1.4s" fill="freeze"/>
  </circle>
  <line x1="207" y1="210" x2="230" y2="210" stroke="#1A2540" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="1.5s" fill="freeze"/>
  </line>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    <text x="238" y="206" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="14" font-weight="600">CS&amp;E Graduate</text>
    <text x="238" y="224" fill="#7B8DB0" font-family="monospace" font-size="9">B.Tech · Computer Science &amp; Engineering</text>
  </g>

  <!-- ═══ EVENT 4: Open to Opportunities (NOW) ═══ -->
  <text x="180" y="260" text-anchor="end" fill="#00FFAE" font-family="monospace" font-size="11" letter-spacing="1" opacity="0">NOW
    <animate attributeName="opacity" values="0;0.9" dur="0.4s" begin="1.9s" fill="freeze"/>
  </text>
  <circle cx="200" cy="256" r="8" fill="#060C1A" stroke="#00FFAE" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.9s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="256" r="3.5" fill="#00FFAE" opacity="0" filter="url(#tl-glow-s)">
    <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="1.9s" fill="freeze"/>
  </circle>
  <!-- Persistent pulse on NOW node -->
  <circle cx="200" cy="256" r="8" fill="none" stroke="#00FFAE" stroke-width="0.9" opacity="0">
    <animate attributeName="opacity" values="0;0;0.5;0" dur="2.5s" begin="2.5s" repeatCount="indefinite" keyTimes="0;0;0.1;1"/>
    <animate attributeName="r" values="8;24" dur="2.5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="256" r="8" fill="none" stroke="#00FFAE" stroke-width="0.7" opacity="0">
    <animate attributeName="opacity" values="0;0;0.35;0" dur="2.5s" begin="3.0s" repeatCount="indefinite" keyTimes="0;0;0.1;1"/>
    <animate attributeName="r" values="8;32" dur="2.5s" begin="3.0s" repeatCount="indefinite"/>
  </circle>
  <line x1="208" y1="256" x2="230" y2="256" stroke="#00FFAE" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="2.0s" fill="freeze"/>
  </line>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.1s" fill="freeze"/>
    <text x="238" y="252" fill="#00FFAE" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="14" font-weight="600" opacity="0.95">Open to Opportunities</text>
    <rect x="238" y="258" width="120" height="18" rx="3" fill="#050A12" stroke="#00FFAE" stroke-width="0.7" opacity="0.6"/>
    <text x="244" y="271" fill="#00FFAE" font-family="monospace" font-size="8" opacity="0.8">ML · AI · Engineering</text>
  </g>
</svg>
