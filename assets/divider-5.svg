<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60">
  <defs>
    <linearGradient id="d5-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow-d5" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="60" fill="#020617"/>

  <!-- Data stream divider: multiple data flow lines -->
  <!-- Stream line 1 (top) -->
  <line x1="0" y1="24" x2="900" y2="24" stroke="#3B82F6" stroke-width="0.4" opacity="0.15"/>
  <!-- Stream line 2 (main) -->
  <line x1="0" y1="30" x2="900" y2="30" stroke="url(#d5-fade)" stroke-width="1.2"/>
  <!-- Stream line 3 (bottom) -->
  <line x1="0" y1="36" x2="900" y2="36" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>

  <!-- Data packets flowing left to right on main line -->
  <rect x="0" y="28.5" width="12" height="3" rx="1.5" fill="#38BDF8" opacity="0.9">
    <animate attributeName="x" values="-12;912" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="28.5" width="8" height="3" rx="1.5" fill="#60A5FA" opacity="0.7">
    <animate attributeName="x" values="-8;912" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="28.5" width="15" height="3" rx="1.5" fill="#3B82F6" opacity="0.8">
    <animate attributeName="x" values="-15;912" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="28.5" width="6" height="3" rx="1.5" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="x" values="-6;912" dur="2.5s" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Data packets on top stream (slower) -->
  <rect x="0" y="22.5" width="6" height="3" rx="1.5" fill="#3B82F6" opacity="0.5">
    <animate attributeName="x" values="-6;912" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="22.5" width="4" height="3" rx="1.5" fill="#60A5FA" opacity="0.4">
    <animate attributeName="x" values="-4;912" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Data packets on bottom stream (reverse, slower) -->
  <rect x="912" y="34.5" width="6" height="3" rx="1.5" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="x" values="912;-6" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="912" y="34.5" width="4" height="3" rx="1.5" fill="#7C3AED" opacity="0.35">
    <animate attributeName="x" values="912;-4" dur="4.5s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Section label -->
  <text x="450" y="14" fill="#1E3A5F" font-family="monospace" font-size="7" letter-spacing="5" text-anchor="middle" opacity="0.5">DATA · STREAM</text>
  <text x="450" y="52" fill="#1E3A5F" font-family="monospace" font-size="7" letter-spacing="5" text-anchor="middle" opacity="0.5">DATA · STREAM</text>
</svg>
