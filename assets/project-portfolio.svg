<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A3F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-live" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="pp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pp-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#pp-bg)" rx="8"/>
  <rect width="900" height="260" fill="url(#pp-dots)" opacity="0.6" rx="8"/>
  <rect width="900" height="260" fill="none" stroke="#1E3A5F" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- Section title + LIVE badge inline -->
  <text x="40" y="30" fill="#8B5CF6" font-family="monospace" font-size="9" letter-spacing="3" opacity="0.8">PORTFOLIO ARCHITECTURE</text>
  <rect x="680" y="18" width="76" height="20" rx="4" fill="url(#pp-live)" stroke="#22C55E" stroke-width="0.8"/>
  <circle cx="694" cy="28" r="3.5" fill="#22C55E" opacity="0.9">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="694" cy="28" r="2" fill="#22C55E"/>
  <text x="703" y="32" fill="#22C55E" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">LIVE</text>
  <text x="762" y="30" fill="#475569" font-family="monospace" font-size="7.5" text-anchor="start">vercel.app</text>

  <!-- ============ DEPLOY PIPELINE: 4 boxes, x=40→860, even spacing ============ -->
  <!-- 4 boxes of 148px + 3 arrows of 30px = 592+90=682, left=(820-682)/2+40=109... No, fill full width. -->
  <!-- box=174, arrow=26: 4*174+3*26=696+78=774, start x=40+23=63. Or simpler: box=168, arrow=20: 672+60=732, start=40+(820-732)/2=40+44=84. -->
  <!-- Use: x1=40, x2=226, x3=412, x4=598, x5=784 end=860: step=184 minus arrowgap=10, so box=174, gap=10 -->
  <!-- 40+174=214, gap=10, 224+174=398, gap=10, 408+174=582, gap=10, 592+174=766, gap=10 to 776 — only 776, but we have 860. Use box=190, gap=10: 40+190+10+190+10+190+10+190=840, end=840. Good! -->
  <text x="40" y="52" fill="#475569" font-family="monospace" font-size="7.5" opacity="0.7" letter-spacing="1">DEPLOY PIPELINE</text>

  <!-- Step 1: Next.js — x=40, w=190 -->
  <rect x="40" y="62" width="190" height="56" rx="5" fill="url(#pp-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="135" y="86" fill="#60A5FA" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Next.js 14</text>
  <text x="135" y="100" fill="#1E40AF" font-family="monospace" font-size="7.5" text-anchor="middle">App Router · RSC</text>
  <text x="135" y="112" fill="#0F172A" font-family="monospace" font-size="7" text-anchor="middle">TypeScript · CSS</text>

  <!-- Arrow -->
  <line x1="230" y1="90" x2="248" y2="90" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <polygon points="248,87 254,90 248,93" fill="#3B82F6" opacity="0.85"/>

  <!-- Step 2: Vercel — x=258, highlighted -->
  <rect x="258" y="54" width="190" height="72" rx="5" fill="url(#pp-purple)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#pp-glow)" opacity="0.95"/>
  <text x="353" y="84" fill="#A78BFA" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Vercel</text>
  <text x="353" y="98" fill="#7C3AED" font-family="monospace" font-size="7.5" text-anchor="middle">Edge Deploy</text>
  <text x="353" y="111" fill="#4C1D95" font-family="monospace" font-size="7" text-anchor="middle">CI/CD · Preview</text>
  <rect x="258" y="54" width="190" height="72" rx="5" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3">
    <animate attributeName="stroke-width" values="0.5;2;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.08;0.3" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Arrow -->
  <line x1="448" y1="90" x2="466" y2="90" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <polygon points="466,87 472,90 466,93" fill="#8B5CF6" opacity="0.85"/>

  <!-- Step 3: Global CDN — x=476 -->
  <rect x="476" y="62" width="190" height="56" rx="5" fill="url(#pp-cyan)" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
  <text x="571" y="86" fill="#7DD3FC" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Global CDN</text>
  <text x="571" y="100" fill="#0C4A6E" font-family="monospace" font-size="7.5" text-anchor="middle">Edge Network</text>
  <text x="571" y="112" fill="#0F172A" font-family="monospace" font-size="7" text-anchor="middle">100+ PoPs</text>

  <!-- Arrow -->
  <line x1="666" y1="90" x2="684" y2="90" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="684,87 690,90 684,93" fill="#38BDF8" opacity="0.85"/>

  <!-- Step 4: User — x=694 -->
  <rect x="694" y="62" width="166" height="56" rx="5" fill="url(#pp-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="777" y="82" fill="#60A5FA" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">User</text>
  <circle cx="777" cy="98" r="7" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="777" cy="98" rx="3.5" ry="7" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.4"/>
  <line x1="770" y1="98" x2="784" y2="98" stroke="#60A5FA" stroke-width="0.5" opacity="0.4"/>

  <!-- ============ SEPARATOR ============ -->
  <line x1="40" y1="148" x2="860" y2="148" stroke="#1E3A5F" stroke-width="0.8" opacity="0.5"/>

  <!-- ============ CORE WEB VITALS (left half below separator) ============ -->
  <text x="40" y="168" fill="#475569" font-family="monospace" font-size="7.5" opacity="0.7" letter-spacing="1">CORE WEB VITALS</text>

  <!-- LCP -->
  <text x="40" y="188" fill="#94A3B8" font-family="monospace" font-size="8">LCP</text>
  <rect x="82" y="181" width="330" height="8" rx="4" fill="#0F172A"/>
  <rect x="82" y="181" width="297" height="8" rx="4" fill="#22C55E" opacity="0.75">
    <animate attributeName="width" values="0;297" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="420" y="189" fill="#22C55E" font-family="monospace" font-size="8" text-anchor="end">90%</text>

  <!-- FID -->
  <text x="40" y="208" fill="#94A3B8" font-family="monospace" font-size="8">FID</text>
  <rect x="82" y="201" width="330" height="8" rx="4" fill="#0F172A"/>
  <rect x="82" y="201" width="314" height="8" rx="4" fill="#3B82F6" opacity="0.75">
    <animate attributeName="width" values="0;314" dur="1.7s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="420" y="209" fill="#60A5FA" font-family="monospace" font-size="8" text-anchor="end">95%</text>

  <!-- CLS -->
  <text x="40" y="228" fill="#94A3B8" font-family="monospace" font-size="8">CLS</text>
  <rect x="82" y="221" width="330" height="8" rx="4" fill="#0F172A"/>
  <rect x="82" y="221" width="290" height="8" rx="4" fill="#8B5CF6" opacity="0.75">
    <animate attributeName="width" values="0;290" dur="1.6s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="420" y="229" fill="#A78BFA" font-family="monospace" font-size="8" text-anchor="end">88%</text>

  <!-- ============ VERTICAL DIVIDER in bottom half ============ -->
  <line x1="460" y1="148" x2="460" y2="260" stroke="#1E3A5F" stroke-width="0.6" opacity="0.4"/>

  <!-- ============ FEATURES (right half below separator) ============ -->
  <text x="474" y="168" fill="#475569" font-family="monospace" font-size="7.5" opacity="0.7" letter-spacing="1">FEATURES</text>

  <!-- 2x2 feature grid in right half: x=474→860, y=176→256 -->
  <circle cx="484" cy="188" r="3" fill="#3B82F6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="494" y="192" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.9">Responsive · Dark Mode</text>

  <circle cx="484" cy="208" r="3" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="494" y="212" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.9">Animated Transitions</text>

  <circle cx="484" cy="228" r="3" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="494" y="232" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.9">SSR · Optimized Core Vitals</text>

  <circle cx="484" cy="248" r="3" fill="#60A5FA" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="494" y="252" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.9">Dynamic Project Showcase</text>

  <!-- Tags bottom-right corner -->
  <text x="860" y="245" fill="#8B5CF6" font-family="monospace" font-size="8.5" text-anchor="end" opacity="0.7">Next.js · TypeScript · Vercel · React</text>
</svg>
