<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A3F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Live badge gradient -->
    <linearGradient id="pp-live" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <filter id="pp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pp-glow-lg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pp-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.5"/>
    </pattern>
    <!-- Vercel-style globe gradient -->
    <radialGradient id="pp-globe" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#pp-bg)" rx="8"/>
  <rect width="900" height="220" fill="url(#pp-dots)" opacity="0.6" rx="8"/>
  <rect width="900" height="220" fill="none" stroke="#1E3A5F" stroke-width="1" rx="8" opacity="0.6"/>

  <!-- Section title -->
  <text x="40" y="36" fill="#8B5CF6" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.8">PORTFOLIO ARCHITECTURE</text>

  <!-- ============ DEPLOYMENT PIPELINE ============ -->
  <!-- Label -->
  <text x="40" y="60" fill="#475569" font-family="monospace" font-size="7.5" opacity="0.6">DEPLOY PIPELINE</text>

  <!-- Pipeline boxes -->
  <!-- Step 1: Source Code -->
  <rect x="40" y="68" width="105" height="44" rx="5" fill="url(#pp-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="92" y="88" fill="#60A5FA" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Next.js 14</text>
  <text x="92" y="102" fill="#1E40AF" font-family="monospace" font-size="7" text-anchor="middle">App Router · RSC</text>

  <!-- Animated arrow -->
  <line x1="145" y1="90" x2="163" y2="90" stroke="#3B82F6" stroke-width="1.2" opacity="0.7" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <polygon points="163,87 169,90 163,93" fill="#3B82F6" opacity="0.85"/>

  <!-- Step 2: Vercel (highlighted) -->
  <rect x="173" y="60" width="105" height="60" rx="5" fill="url(#pp-purple)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#pp-glow)" opacity="0.95"/>
  <text x="225" y="87" fill="#A78BFA" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Vercel</text>
  <text x="225" y="99" fill="#7C3AED" font-family="monospace" font-size="7" text-anchor="middle">Edge Deploy</text>
  <text x="225" y="111" fill="#4C1D95" font-family="monospace" font-size="6.5" text-anchor="middle">CI/CD · Preview</text>
  <!-- Vercel pulse -->
  <rect x="173" y="60" width="105" height="60" rx="5" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.3">
    <animate attributeName="stroke-width" values="0.5;2;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.08;0.3" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated arrow -->
  <line x1="278" y1="90" x2="296" y2="90" stroke="#8B5CF6" stroke-width="1.2" opacity="0.7" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <polygon points="296,87 302,90 296,93" fill="#8B5CF6" opacity="0.85"/>

  <!-- Step 3: Global CDN -->
  <rect x="306" y="68" width="105" height="44" rx="5" fill="url(#pp-cyan)" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
  <text x="358" y="88" fill="#7DD3FC" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Global CDN</text>
  <text x="358" y="102" fill="#0C4A6E" font-family="monospace" font-size="7" text-anchor="middle">Edge Network</text>

  <!-- Animated arrow -->
  <line x1="411" y1="90" x2="429" y2="90" stroke="#38BDF8" stroke-width="1.2" opacity="0.7" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-7" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <polygon points="429,87 435,90 429,93" fill="#38BDF8" opacity="0.85"/>

  <!-- Step 4: User -->
  <rect x="439" y="68" width="80" height="44" rx="5" fill="url(#pp-blue)" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
  <text x="479" y="85" fill="#60A5FA" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">User</text>
  <!-- Tiny globe icon -->
  <circle cx="479" cy="97" r="6" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="479" cy="97" rx="3" ry="6" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.4"/>
  <line x1="473" y1="97" x2="485" y2="97" stroke="#60A5FA" stroke-width="0.5" opacity="0.4"/>

  <!-- ============ LIVE BADGE ============ -->
  <rect x="540" y="62" width="90" height="28" rx="5" fill="url(#pp-live)" stroke="#22C55E" stroke-width="0.8" opacity="0.9"/>
  <circle cx="556" cy="76" r="4" fill="#22C55E" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="556" cy="76" r="2.5" fill="#22C55E" opacity="1"/>
  <text x="568" y="80" fill="#22C55E" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">LIVE</text>
  <!-- Domain text -->
  <text x="540" y="105" fill="#475569" font-family="monospace" font-size="7.5">vishnu-ai-portfolio.vercel.app</text>

  <!-- ============ PERFORMANCE METRICS ============ -->
  <!-- Label -->
  <text x="680" y="60" fill="#475569" font-family="monospace" font-size="7.5" opacity="0.6">CORE WEB VITALS</text>

  <!-- LCP metric -->
  <text x="680" y="80" fill="#94A3B8" font-family="monospace" font-size="8">LCP</text>
  <rect x="718" y="73" width="90" height="7" rx="3.5" fill="#0F172A"/>
  <rect x="718" y="73" width="81" height="7" rx="3.5" fill="#22C55E" opacity="0.7">
    <animate attributeName="width" values="0;81" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="860" y="80" fill="#22C55E" font-family="monospace" font-size="7.5" text-anchor="end">90%</text>

  <!-- FID metric -->
  <text x="680" y="97" fill="#94A3B8" font-family="monospace" font-size="8">FID</text>
  <rect x="718" y="90" width="90" height="7" rx="3.5" fill="#0F172A"/>
  <rect x="718" y="90" width="86" height="7" rx="3.5" fill="#3B82F6" opacity="0.7">
    <animate attributeName="width" values="0;86" dur="1.7s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="860" y="97" fill="#60A5FA" font-family="monospace" font-size="7.5" text-anchor="end">95%</text>

  <!-- CLS metric -->
  <text x="680" y="114" fill="#94A3B8" font-family="monospace" font-size="8">CLS</text>
  <rect x="718" y="107" width="90" height="7" rx="3.5" fill="#0F172A"/>
  <rect x="718" y="107" width="79" height="7" rx="3.5" fill="#8B5CF6" opacity="0.7">
    <animate attributeName="width" values="0;79" dur="1.6s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="860" y="114" fill="#A78BFA" font-family="monospace" font-size="7.5" text-anchor="end">88%</text>

  <!-- ============ FEATURES ============ -->
  <line x1="40" y1="132" x2="860" y2="132" stroke="#1E3A5F" stroke-width="0.8" opacity="0.5"/>

  <!-- Feature items in 4 columns -->
  <!-- 860 - 40 = 820 / 4 = 205 spacing -->
  <circle cx="50" cy="154" r="3.5" fill="#3B82F6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="158" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.85">Responsive · Dark Mode</text>

  <circle cx="260" cy="154" r="3.5" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="270" y="158" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.85">Animated Transitions</text>

  <circle cx="470" cy="154" r="3.5" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="480" y="158" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.85">SSR · Optimized LCP</text>

  <circle cx="680" cy="154" r="3.5" fill="#60A5FA" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="690" y="158" fill="#94A3B8" font-family="monospace" font-size="8.5" opacity="0.85">Project Showcase</text>

  <!-- ============ TAGS ============ -->
  <text x="40" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">Next.js</text>
  <text x="92" y="194" fill="#1E3A5F" font-family="monospace" font-size="9" opacity="0.5">·</text>
  <text x="102" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">TypeScript</text>
  <text x="174" y="194" fill="#1E3A5F" font-family="monospace" font-size="9" opacity="0.5">·</text>
  <text x="184" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">TailwindCSS</text>
  <text x="268" y="194" fill="#1E3A5F" font-family="monospace" font-size="9" opacity="0.5">·</text>
  <text x="278" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">Vercel</text>
  <text x="330" y="194" fill="#1E3A5F" font-family="monospace" font-size="9" opacity="0.5">·</text>
  <text x="340" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">React</text>
  <text x="380" y="194" fill="#1E3A5F" font-family="monospace" font-size="9" opacity="0.5">·</text>
  <text x="390" y="194" fill="#8B5CF6" font-family="monospace" font-size="9" opacity="0.75">App Router</text>
</svg>
