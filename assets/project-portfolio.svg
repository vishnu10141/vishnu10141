<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="pp-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <linearGradient id="pp-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAE"/>
      <stop offset="100%" stop-color="#00D090"/>
    </linearGradient>
    <linearGradient id="pp-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.018"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pp-bar-lcp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAE"/>
      <stop offset="100%" stop-color="#00D090"/>
    </linearGradient>
    <linearGradient id="pp-bar-fid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#3B7BE8"/>
    </linearGradient>
    <linearGradient id="pp-bar-cls" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#6B42DB"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="900" height="260" rx="8" fill="url(#pp-bg)"/>
  <rect width="900" height="260" rx="8" fill="url(#pp-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="260" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect x="1" y="1" width="160" height="1.5" rx="1" fill="url(#pp-accent)" opacity="0.8"/>

  <!-- ── HEADER ── -->
  <text x="40" y="28" fill="#3D4F70" font-family="monospace" font-size="9" letter-spacing="3">FEATURED PROJECT — 03</text>
  <text x="40" y="54" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="18" font-weight="600">AI Portfolio Website</text>

  <!-- Domain tags -->
  <rect x="40" y="63" width="58" height="18" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
  <text x="69" y="76" fill="#8A5DFF" font-family="monospace" font-size="7.5" text-anchor="middle">Next.js</text>
  <rect x="106" y="63" width="48" height="18" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
  <text x="130" y="76" fill="#8A5DFF" font-family="monospace" font-size="7.5" text-anchor="middle">Vercel</text>
  <rect x="162" y="63" width="70" height="18" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7"/>
  <text x="197" y="76" fill="#8A5DFF" font-family="monospace" font-size="7.5" text-anchor="middle">Full-Stack</text>

  <!-- LIVE badge -->
  <rect x="756" y="18" width="72" height="20" rx="3" fill="#022C22" stroke="#00FFAE" stroke-width="0.8"/>
  <circle cx="770" cy="28" r="3" fill="#00FFAE">
    <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="778" y="32" fill="#00FFAE" font-family="monospace" font-size="8.5" font-weight="600">LIVE</text>

  <!-- ── HEADER DIVIDER ── -->
  <line x1="40" y1="96" x2="860" y2="96" stroke="#1A2540" stroke-width="0.8" opacity="0.8"/>

  <!-- ── PIPELINE: 4 STEPS ── -->
  <text x="40" y="112" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="2">DEPLOYMENT PIPELINE</text>

  <!-- 4 boxes: w=190, gap=16, start x=40 → 40+4*190+3*16=40+760+48=848 too wide. Use w=174 gap=12: 4*174+3*12=696+36=732, start=40, end=772 -->
  <!-- Box 1: Next.js 14 -->
  <rect x="40" y="120" width="174" height="52" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="127" y="140" fill="#F0F4FF" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Next.js 14</text>
  <text x="127" y="153" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">App Router · RSC</text>
  <text x="127" y="164" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">TypeScript</text>
  <!-- Arrow -->
  <line x1="214" y1="146" x2="222" y2="146" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="222,143 228,146 222,149" fill="#1A2540" opacity="0.7"/>

  <!-- Box 2: Vercel (highlighted) -->
  <rect x="228" y="120" width="174" height="52" rx="4" fill="#0A1120" stroke="#8A5DFF" stroke-width="1.2"/>
  <text x="315" y="140" fill="#8A5DFF" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Vercel</text>
  <text x="315" y="153" fill="#8A5DFF" font-family="monospace" font-size="6.5" text-anchor="middle" opacity="0.7">Edge Deploy · CI/CD</text>
  <text x="315" y="164" fill="#8A5DFF" font-family="monospace" font-size="6.5" text-anchor="middle" opacity="0.5">Preview Deployments</text>
  <!-- Arrow -->
  <line x1="402" y1="146" x2="410" y2="146" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="410,143 416,146 410,149" fill="#1A2540" opacity="0.7"/>

  <!-- Box 3: Global CDN -->
  <rect x="416" y="120" width="174" height="52" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <text x="503" y="140" fill="#F0F4FF" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">Global CDN</text>
  <text x="503" y="153" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">Edge Network</text>
  <text x="503" y="164" fill="#7B8DB0" font-family="monospace" font-size="6.5" text-anchor="middle">100+ PoPs</text>
  <!-- Arrow -->
  <line x1="590" y1="146" x2="598" y2="146" stroke="#1A2540" stroke-width="0.8"/>
  <polygon points="598,143 604,146 598,149" fill="#1A2540" opacity="0.7"/>

  <!-- Box 4: User -->
  <rect x="604" y="120" width="174" height="52" rx="4" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Person icon -->
  <circle cx="691" cy="138" r="7" fill="none" stroke="#7B8DB0" stroke-width="1" opacity="0.6"/>
  <path d="M679,158 Q691,150 703,158" fill="none" stroke="#7B8DB0" stroke-width="1" opacity="0.5"/>
  <text x="691" y="168" fill="#7B8DB0" font-family="monospace" font-size="7" text-anchor="middle">User</text>

  <!-- ── BOTTOM DIVIDER ── -->
  <line x1="40" y1="184" x2="860" y2="184" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- ── CORE WEB VITALS (left, x=40 to x=448) ── -->
  <text x="40" y="200" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="1">CORE WEB VITALS</text>

  <!-- LCP -->
  <text x="40" y="218" fill="#7B8DB0" font-family="monospace" font-size="7.5">LCP</text>
  <rect x="74" y="211" width="340" height="7" rx="3.5" fill="#050A12"/>
  <rect x="74" y="211" width="306" height="7" rx="3.5" fill="url(#pp-bar-lcp)" opacity="0.7">
    <animate attributeName="width" values="0;306" dur="1.8s" fill="freeze"/>
  </rect>
  <text x="420" y="218" fill="#00FFAE" font-family="monospace" font-size="7.5" text-anchor="end">90%</text>

  <!-- FID -->
  <text x="40" y="236" fill="#7B8DB0" font-family="monospace" font-size="7.5">FID</text>
  <rect x="74" y="229" width="340" height="7" rx="3.5" fill="#050A12"/>
  <rect x="74" y="229" width="323" height="7" rx="3.5" fill="url(#pp-bar-fid)" opacity="0.7">
    <animate attributeName="width" values="0;323" dur="1.8s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="420" y="236" fill="#4F8FFF" font-family="monospace" font-size="7.5" text-anchor="end">95%</text>

  <!-- CLS -->
  <text x="40" y="254" fill="#7B8DB0" font-family="monospace" font-size="7.5">CLS</text>
  <rect x="74" y="247" width="340" height="7" rx="3.5" fill="#050A12"/>
  <rect x="74" y="247" width="299" height="7" rx="3.5" fill="url(#pp-bar-cls)" opacity="0.7">
    <animate attributeName="width" values="0;299" dur="1.8s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="420" y="254" fill="#8A5DFF" font-family="monospace" font-size="7.5" text-anchor="end">88%</text>

  <!-- Vertical mini-divider -->
  <line x1="456" y1="190" x2="456" y2="258" stroke="#1A2540" stroke-width="0.6" opacity="0.4"/>

  <!-- ── FEATURES (right, x=468 to x=860) ── -->
  <text x="468" y="200" fill="#3D4F70" font-family="monospace" font-size="7.5" letter-spacing="1">FEATURES</text>

  <circle cx="478" cy="216" r="2.5" fill="#4F8FFF" opacity="0.7"/>
  <text x="488" y="220" fill="#7B8DB0" font-family="monospace" font-size="8.5">Responsive · Dark Mode</text>

  <circle cx="478" cy="234" r="2.5" fill="#8A5DFF" opacity="0.7"/>
  <text x="488" y="238" fill="#7B8DB0" font-family="monospace" font-size="8.5">Animated Transitions</text>

  <circle cx="478" cy="252" r="2.5" fill="#00E6FF" opacity="0.7"/>
  <text x="488" y="256" fill="#7B8DB0" font-family="monospace" font-size="8.5">SSR · Optimized Core Vitals</text>

  <!-- Tech tags bottom right -->
  <text x="860" y="256" fill="#8A5DFF" font-family="monospace" font-size="8.5" text-anchor="end" opacity="0.7">Next.js · TypeScript · Vercel · React</text>
</svg>
