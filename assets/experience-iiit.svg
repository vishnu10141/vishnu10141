<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Card background gradient -->
    <linearGradient id="iiit-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <!-- Top accent gradient (violet → blue) -->
    <linearGradient id="iiit-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <!-- Role badge left accent gradient -->
    <linearGradient id="iiit-role-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <!-- Pipeline accent gradient -->
    <linearGradient id="iiit-pipe-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5DFF"/>
      <stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <!-- Shimmer gradient -->
    <linearGradient id="iiit-shimmer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="900" height="200" rx="8" fill="url(#iiit-bg-grad)"/>

  <!-- Shimmer overlay -->
  <rect width="900" height="200" rx="8" fill="url(#iiit-shimmer-grad)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Card border -->
  <rect width="900" height="200" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>

  <!-- Top left accent bar (violet → blue) -->
  <rect x="1" y="1" width="120" height="1.5" rx="1" fill="url(#iiit-accent-grad)" opacity="0.8"/>

  <!-- ===== LOGO CONTAINER ===== -->
  <rect x="40" y="28" width="72" height="72" rx="6" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>

  <!-- Corner ticks — Top-left -->
  <line x1="40" y1="38" x2="40" y2="28" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="28" x2="50" y2="28" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Top-right -->
  <line x1="112" y1="38" x2="112" y2="28" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="112" y1="28" x2="102" y2="28" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Bottom-left -->
  <line x1="40" y1="90" x2="40" y2="100" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="100" x2="50" y2="100" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <!-- Corner ticks — Bottom-right -->
  <line x1="112" y1="90" x2="112" y2="100" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>
  <line x1="112" y1="100" x2="102" y2="100" stroke="#8A5DFF" stroke-width="0.7" opacity="0.4"/>

  <!-- Wave lines representing text corpus (5 lines, x1=52 x2=100) -->
  <line x1="52" y1="42" x2="100" y2="42" stroke="#8A5DFF" stroke-width="0.8" opacity="0.7"/>
  <line x1="52" y1="48" x2="100" y2="48" stroke="#8A5DFF" stroke-width="0.8" opacity="0.7"/>
  <!-- Middle line (thicker) -->
  <line x1="52" y1="54" x2="100" y2="54" stroke="#8A5DFF" stroke-width="1.2" opacity="0.7"/>
  <line x1="52" y1="60" x2="100" y2="60" stroke="#8A5DFF" stroke-width="0.8" opacity="0.7"/>
  <line x1="52" y1="66" x2="100" y2="66" stroke="#8A5DFF" stroke-width="0.8" opacity="0.7"/>

  <!-- NLP node with pulse -->
  <circle cx="76" cy="54" r="3" fill="#8A5DFF">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Inner core -->
  <circle cx="76" cy="54" r="1.2" fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== TEXT BLOCK ===== -->
  <!-- Institution name -->
  <text x="126" y="50" fill="#F0F4FF" font-size="18" font-weight="700" letter-spacing="-0.5" font-family="'SF Pro Display', -apple-system, Inter, sans-serif">IIIT Hyderabad</text>
  <!-- Full name -->
  <text x="126" y="66" fill="#7B8DB0" font-size="9" font-family="monospace" letter-spacing="0.2">International Institute of Information Technology</text>
  <!-- Location -->
  <text x="126" y="80" fill="#8A5DFF" font-size="8.5" font-family="monospace">Hyderabad, India</text>

  <!-- Role badge background -->
  <rect x="126" y="87" width="160" height="20" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <!-- Role badge left accent bar (violet) -->
  <rect x="126" y="87" width="2.5" height="20" rx="1.2" fill="url(#iiit-role-grad)"/>
  <!-- Role text -->
  <text x="136" y="101" fill="#8A5DFF" font-size="8.5" font-family="monospace">NLP Research Intern</text>

  <!-- Year badge -->
  <rect x="814" y="28" width="48" height="20" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="838" y="42" fill="#7B8DB0" font-size="9" text-anchor="middle" letter-spacing="1" font-family="monospace">2022</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="40" y1="120" x2="860" y2="120" stroke="#1A2540" stroke-width="0.8" opacity="0.7"/>

  <!-- ===== BOTTOM SECTION ===== -->

  <!-- Pipeline section (left) -->
  <rect x="40" y="132" width="2.5" height="44" rx="1.2" fill="url(#iiit-pipe-grad)" opacity="0.7"/>
  <text x="50" y="147" fill="#3D4F70" font-size="7.5" font-family="monospace" letter-spacing="0.5">PIPELINE</text>
  <text x="50" y="160" fill="#F0F4FF" font-size="8.5" font-family="monospace">Text Collection → Linguistic Annotation</text>
  <text x="50" y="173" fill="#7B8DB0" font-size="8" font-family="monospace">→ Tokenization → Telugu Corpus</text>

  <!-- Research output block (right, instead of accuracy bars) -->
  <text x="480" y="134" fill="#3D4F70" font-size="7.5" font-family="monospace" letter-spacing="0.5">RESEARCH OUTPUT</text>
  <rect x="480" y="138" width="2" height="40" rx="1" fill="#8A5DFF" opacity="0.6"/>
  <text x="490" y="151" fill="#7B8DB0" font-size="8.5" font-family="monospace">Structured Telugu NLP dataset</text>
  <text x="490" y="165" fill="#7B8DB0" font-size="8.5" font-family="monospace">Manual linguistic annotation pipeline</text>
  <text x="490" y="179" fill="#7B8DB0" font-size="8.5" font-family="monospace">Low-resource corpus construction</text>

  <!-- Tech tags — violet themed, bottom right, y=182 starting x=480 -->
  <!-- 'Low-Resource NLP' w=96 -->
  <rect x="480" y="178" width="96" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="528" y="188" fill="#8A5DFF" font-size="7" font-family="monospace" text-anchor="middle">Low-Resource NLP</text>
  <!-- 'Telugu' w=46 -->
  <rect x="582" y="178" width="46" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="605" y="188" fill="#8A5DFF" font-size="7" font-family="monospace" text-anchor="middle">Telugu</text>
  <!-- 'Corpus' w=48 -->
  <rect x="634" y="178" width="48" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="658" y="188" fill="#8A5DFF" font-size="7" font-family="monospace" text-anchor="middle">Corpus</text>
  <!-- 'Annotation' w=60 -->
  <rect x="688" y="178" width="60" height="14" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.6"/>
  <text x="718" y="188" fill="#8A5DFF" font-size="7" font-family="monospace" text-anchor="middle">Annotation</text>

  <!-- ===== SIGNAL TRAVEL on divider ===== -->
  <circle r="1.5" fill="#8A5DFF">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 40 120 L 860 120"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </circle>

</svg>
