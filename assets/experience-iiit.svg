<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="ii-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/><stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="ii-lpanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08101E"/><stop offset="100%" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="ii-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A5DFF"/><stop offset="100%" stop-color="#4F8FFF"/>
    </linearGradient>
    <linearGradient id="ii-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.014"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ii-glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ii-glow-md" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ii-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.4" fill="#1A2540" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Card base -->
  <rect width="900" height="200" rx="8" fill="url(#ii-bg)"/>
  <rect width="900" height="200" rx="8" fill="url(#ii-dots)"/>
  <rect width="900" height="200" rx="8" fill="url(#ii-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-900,0;900,0;-900,0" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="200" rx="8" fill="none" stroke="#1A2540" stroke-width="1"/>
  <!-- Top accent -->
  <rect x="1" y="1" width="0" height="1.5" rx="1" fill="url(#ii-accent)">
    <animate attributeName="width" values="0;250" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- ══════════════════════════════════
       LEFT NLP VISUALIZATION PANEL (x 0–254)
  ══════════════════════════════════ -->
  <rect x="0" y="0" width="254" height="200" rx="8" fill="url(#ii-lpanel)"/>
  <line x1="254" y1="0" x2="254" y2="200" stroke="#1A2540" stroke-width="1" opacity="0.9"/>

  <!-- Panel header -->
  <text x="18" y="17" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="2" opacity="0.65">NLP.ENGINE</text>
  <circle cx="86" cy="13" r="2.5" fill="#8A5DFF" opacity="0.7" filter="url(#ii-glow-s)">
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="17" fill="#8A5DFF" font-family="monospace" font-size="7" letter-spacing="1.5" opacity="0.6">PROCESSING</text>

  <!-- ── TOKEN FLOW VISUALIZATION ── -->
  <!-- Row 1: Input Telugu tokens -->
  <!-- Token nodes connected by animated lines -->

  <!-- Connection lines (animated dashoffset = flowing data) -->
  <!-- Row 1 connections -->
  <line x1="58" y1="50" x2="98" y2="50" stroke="#8A5DFF" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="138" y1="50" x2="178" y2="50" stroke="#8A5DFF" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="218" y1="50" x2="242" y2="50" stroke="#8A5DFF" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.2">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Row 1 → Row 2 cross connections -->
  <line x1="60" y1="58" x2="60" y2="96" stroke="#4F8FFF" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.2">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="58" x2="140" y2="96" stroke="#4F8FFF" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.2">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <line x1="60" y1="58" x2="140" y2="96" stroke="#8A5DFF" stroke-width="0.4" stroke-dasharray="2 8" opacity="0.12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="58" x2="60" y2="96" stroke="#8A5DFF" stroke-width="0.4" stroke-dasharray="2 8" opacity="0.1">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- Row 2 connections -->
  <line x1="98" y1="108" x2="128" y2="108" stroke="#4F8FFF" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.3">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <line x1="178" y1="108" x2="208" y2="108" stroke="#4F8FFF" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.25">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Row 2 → Row 3 -->
  <line x1="60" y1="118" x2="127" y2="158" stroke="#00E6FF" stroke-width="0.4" stroke-dasharray="2 7" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="140" y1="118" x2="127" y2="158" stroke="#00E6FF" stroke-width="0.4" stroke-dasharray="2 7" opacity="0.15">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- ── ROW 1: Telugu input tokens ── -->
  <!-- Sequentially lit with stagger -->
  <g>
    <!-- Token: ఒక -->
    <rect x="22" y="38" width="36" height="22" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    </rect>
    <rect x="22" y="38" width="36" height="22" rx="3" fill="none" stroke="#8A5DFF" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.2;0.8;0.2;0" dur="6s" begin="0.5s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25;0.45;0.5"/>
    </rect>
    <text x="40" y="53" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="10" opacity="0">ఒక
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    </text>
  </g>
  <g>
    <!-- Token: అందమైన -->
    <rect x="100" y="38" width="76" height="22" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </rect>
    <rect x="100" y="38" width="76" height="22" rx="3" fill="none" stroke="#8A5DFF" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.2;0.8;0.2;0" dur="6s" begin="1.5s" repeatCount="indefinite" keyTimes="0;0.05;0.2;0.25;0.45;0.5"/>
    </rect>
    <text x="138" y="53" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="10" opacity="0">అందమైన
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </text>
  </g>
  <g>
    <!-- Token: కథ -->
    <rect x="180" y="38" width="40" height="22" rx="3" fill="#050A12" stroke="#8A5DFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="200" y="53" text-anchor="middle" fill="#8A5DFF" font-family="monospace" font-size="10" opacity="0">కథ
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    </text>
  </g>
  <!-- Row 1 label -->
  <text x="22" y="32" fill="#3D4F70" font-family="monospace" font-size="6.5" opacity="0.55" letter-spacing="1">INPUT TOKENS</text>

  <!-- ── ROW 2: Embedding vectors ── -->
  <text x="22" y="90" fill="#3D4F70" font-family="monospace" font-size="6.5" opacity="0.55" letter-spacing="1">EMBEDDINGS</text>
  <g>
    <!-- Embedding node 1 -->
    <rect x="22" y="97" width="68" height="22" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    </rect>
    <text x="56" y="112" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7.5" opacity="0">vec[0.82]
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    </text>
  </g>
  <g>
    <!-- Embedding node 2 -->
    <rect x="100" y="97" width="68" height="22" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    </rect>
    <text x="134" y="112" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7.5" opacity="0">vec[0.64]
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
    </text>
  </g>
  <g>
    <!-- Embedding node 3 -->
    <rect x="178" y="97" width="56" height="22" rx="3" fill="#050A12" stroke="#4F8FFF" stroke-width="0.7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
    </rect>
    <text x="206" y="112" text-anchor="middle" fill="#4F8FFF" font-family="monospace" font-size="7.5" opacity="0">vec[0.47]
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
    </text>
  </g>

  <!-- ── ROW 3: Corpus output ── -->
  <text x="22" y="148" fill="#3D4F70" font-family="monospace" font-size="6.5" opacity="0.55" letter-spacing="1">CORPUS</text>
  <g>
    <rect x="22" y="155" width="210" height="22" rx="3" fill="#050A12" stroke="#00E6FF" stroke-width="0.8" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>
    </rect>
    <text x="127" y="170" text-anchor="middle" fill="#00E6FF" font-family="monospace" font-size="8" opacity="0">Telugu NLP Dataset
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>
    </text>
  </g>

  <!-- Traveling attention pulse (row 1 → corpus) -->
  <circle r="2" fill="#8A5DFF" filter="url(#ii-glow-s)">
    <animateMotion dur="4s" begin="2.5s" repeatCount="indefinite" path="M40,49 C40,80 127,90 127,166"/>
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="4s" begin="2.5s" repeatCount="indefinite" keyTimes="0;0.05;0.15;0.85;1"/>
  </circle>

  <!-- Panel footer label -->
  <text x="127" y="194" text-anchor="middle" fill="#3D4F70" font-family="monospace" font-size="6.5" letter-spacing="1.5" opacity="0.5">LOW-RESOURCE NLP · TELUGU</text>

  <!-- ══════════════════════════════════
       RIGHT CONTENT PANEL (x 268–900)
  ══════════════════════════════════ -->

  <!-- Left accent bar -->
  <rect x="268" y="20" width="2.5" height="66" rx="1.2" fill="url(#ii-accent)"/>

  <!-- IIIT name -->
  <text x="280" y="44" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">IIIT Hyderabad</text>
  <!-- Full name -->
  <text x="280" y="62" fill="#7B8DB0" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="10">International Institute of Information Technology</text>
  <!-- Location -->
  <text x="280" y="78" fill="#8A5DFF" font-family="monospace" font-size="9.5">Hyderabad, India</text>

  <!-- Role badge -->
  <rect x="280" y="84" width="74" height="18" rx="3" fill="#0A1120" stroke="#8A5DFF" stroke-width="0.7"/>
  <rect x="280" y="84" width="2.5" height="18" rx="1.2" fill="url(#ii-accent)"/>
  <text x="292" y="97" fill="#8A5DFF" font-family="monospace" font-size="8">NLP Intern</text>

  <!-- Year badge -->
  <rect x="832" y="22" width="48" height="20" rx="3" fill="#050A12" stroke="#1A2540" stroke-width="0.8"/>
  <text x="856" y="36" text-anchor="middle" fill="#7B8DB0" font-family="monospace" font-size="9" font-weight="600">2022</text>

  <!-- Divider -->
  <line x1="268" y1="114" x2="878" y2="114" stroke="#1A2540" stroke-width="0.7" opacity="0.7"/>

  <!-- PIPELINE section -->
  <text x="268" y="128" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1.5">PIPELINE</text>
  <text x="268" y="145" fill="#F0F4FF" font-family="monospace" font-size="8.5" font-weight="600">Text Collection → Linguistic Annotation</text>
  <text x="268" y="160" fill="#7B8DB0" font-family="monospace" font-size="8">→ Tokenization → Telugu Corpus</text>

  <!-- WORK OUTPUT section -->
  <text x="568" y="128" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1.5">WORK OUTPUT</text>
  <rect x="568" y="133" width="2" height="42" rx="1" fill="#8A5DFF" opacity="0.6"/>
  <text x="578" y="146" fill="#7B8DB0" font-family="monospace" font-size="8.5">Structured Telugu NLP dataset</text>
  <text x="578" y="160" fill="#7B8DB0" font-family="monospace" font-size="8.5">Manual linguistic annotation pipeline</text>
  <text x="578" y="174" fill="#7B8DB0" font-family="monospace" font-size="8.5">Low-resource corpus construction</text>

  <!-- Bottom divider -->
  <line x1="268" y1="177" x2="878" y2="177" stroke="#1A2540" stroke-width="0.5" opacity="0.4"/>

  <!-- Tech tags -->
  <text x="268" y="190" fill="#8A5DFF" font-family="monospace" font-size="8" opacity="0.7">Low-Resource NLP</text>
  <text x="388" y="190" fill="#8A5DFF" font-family="monospace" font-size="8" opacity="0.7">Telugu</text>
  <text x="438" y="190" fill="#8A5DFF" font-family="monospace" font-size="8" opacity="0.7">Corpus</text>
  <text x="498" y="190" fill="#8A5DFF" font-family="monospace" font-size="8" opacity="0.7">Annotation</text>
  <text x="578" y="190" fill="#8A5DFF" font-family="monospace" font-size="8" opacity="0.7">Tokenization</text>
</svg>
