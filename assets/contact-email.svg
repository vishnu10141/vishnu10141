<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ce-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="ce-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8FFF"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="ce-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer background -->
  <rect width="220" height="180" fill="#050A12"/>

  <!-- Card body -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="#0A1120" stroke="#1A2540" stroke-width="0.8"/>

  <!-- Shimmer overlay -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="url(#ce-shimmer)">
    <animateTransform attributeName="transform" type="translate" values="-200,0;200,0;-200,0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle outer glow pulse -->
  <rect x="10" y="10" width="200" height="158" rx="8" fill="none" stroke="#4F8FFF" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="0.5;1.5;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top accent strip -->
  <rect x="10" y="10" width="60" height="1.5" rx="1" fill="url(#ce-accent-grad)"/>

  <!-- Icon circle bg -->
  <circle cx="110" cy="58" r="26" fill="#050A12" stroke="#4F8FFF" stroke-width="1" opacity="0.8"/>

  <!-- Envelope icon: rect w=32 h=22 centered at (110,58) rx=3 -->
  <rect x="94" y="47" width="32" height="22" rx="3" fill="none" stroke="#4F8FFF" stroke-width="1.2" opacity="0.8"/>
  <!-- Chevron/V flap -->
  <path d="M94,49 L110,60 L126,49" fill="none" stroke="#4F8FFF" stroke-width="1" opacity="0.7"/>

  <!-- Pulse dot center -->
  <circle cx="110" cy="58" r="3" fill="#4F8FFF">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="110" y="100" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="600" font-family="'SF Pro Display',-apple-system,Inter,sans-serif">Email</text>

  <!-- Handle -->
  <text x="110" y="116" text-anchor="middle" fill="#3D4F70" font-size="8" font-family="monospace">nvishnu1014@gmail.com</text>

  <!-- Divider -->
  <line x1="30" y1="130" x2="190" y2="130" stroke="#1A2540" stroke-width="0.6" opacity="0.5"/>

  <!-- CTA -->
  <text x="110" y="152" text-anchor="middle" fill="#4F8FFF" font-size="8.5" font-family="monospace" font-weight="600" letter-spacing="1">WRITE →</text>

</svg>
