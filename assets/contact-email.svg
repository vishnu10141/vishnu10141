<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/><stop offset="100%" stop-color="#060C1A"/>
    </linearGradient>
    <linearGradient id="ce-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAE"/><stop offset="100%" stop-color="#00E6FF"/>
    </linearGradient>
    <filter id="ce-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="80" rx="6" fill="url(#ce-bg)"/>
  <rect width="200" height="80" rx="6" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="1.5" rx="1" fill="url(#ce-accent)" opacity="0.6"/>
  <rect width="200" height="80" rx="6" fill="none" stroke="#00FFAE" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Email icon (envelope) -->
  <rect x="12" y="24" width="24" height="16" rx="2" fill="none" stroke="#00FFAE" stroke-width="1.2" opacity="0.7" filter="url(#ce-glow)"/>
  <path d="M12,24 L24,34 L36,24" fill="none" stroke="#00FFAE" stroke-width="1" opacity="0.5"/>
  <!-- Text -->
  <text x="42" y="30" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12" font-weight="600">Email</text>
  <text x="42" y="44" fill="#7B8DB0" font-family="monospace" font-size="8">nvishnu1014@gmail</text>
  <text x="184" y="34" text-anchor="middle" fill="#00FFAE" font-size="13" opacity="0.5">→</text>
  <text x="100" y="68" text-anchor="middle" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1" opacity="0.45">REACH OUT</text>
</svg>
