<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="cc-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.4"/>
    </pattern>
    <linearGradient id="cc-card-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shimmer-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="220" height="180" fill="url(#cc-bg)"/>
  <rect width="220" height="180" fill="url(#cc-dots)" opacity="0.5"/>
  <g transform="translate(12, 20)">
    <rect x="0" y="0" width="196" height="140" rx="8" fill="url(#cc-card-email)" stroke="#3B82F6" stroke-width="1"/>
    <rect x="0" y="0" width="196" height="140" rx="8" fill="url(#shimmer-4)"/>
    <rect x="0" y="0" width="196" height="140" rx="8" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="25" width="32" height="22" rx="3" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <path d="M 82 25 L 98 39 L 114 25" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <circle cx="98" cy="35" r="2.5" fill="#3B82F6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="84" fill="#60A5FA" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">Email</text>
    <text x="98" y="100" fill="#1E3A5F" font-family="monospace" font-size="7.5" text-anchor="middle">nvishnu1014@gmail.com</text>
    <text x="98" y="124" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">WRITE →</text>
  </g>
</svg>
