<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="cc-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#1E293B" opacity="0.4"/>
    </pattern>
    <linearGradient id="cc-card-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A3F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shimmer-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;2 0;-1 0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="220" height="180" fill="url(#cc-bg)"/>
  <rect width="220" height="180" fill="url(#cc-dots)" opacity="0.5"/>
  <g transform="translate(12, 20)">
    <rect x="0" y="0" width="195" height="140" rx="8" fill="url(#cc-card-linkedin)" stroke="#38BDF8" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="140" rx="8" fill="url(#shimmer-3)"/>
    <rect x="0" y="0" width="195" height="140" rx="8" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="0.5;2;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="83.5" y="22" width="28" height="28" rx="5" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>
    <text x="97.5" y="42" fill="#38BDF8" font-family="'SF Pro Display', sans-serif" font-size="18" font-weight="700" text-anchor="middle" opacity="0.8">in</text>
    <circle cx="97.5" cy="36" r="2" fill="#38BDF8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="97.5" y="80" fill="#7DD3FC" font-family="'SF Pro Display', -apple-system, Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">LinkedIn</text>
    <text x="97.5" y="96" fill="#0C4A6E" font-family="monospace" font-size="7.5" text-anchor="middle">vishnu-nimmakayala</text>
    <text x="97.5" y="128" fill="#38BDF8" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="1">CONNECT →</text>
  </g>
</svg>
