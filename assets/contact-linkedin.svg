<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1120"/><stop offset="100%" stop-color="#060C1A"/>
    </linearGradient>
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="80" rx="6" fill="url(#cl-bg)"/>
  <rect width="200" height="80" rx="6" fill="none" stroke="#1A2540" stroke-width="1"/>
  <rect x="0" y="0" width="200" height="1.5" rx="1" fill="#0A66C2" opacity="0.6"/>
  <rect width="200" height="80" rx="6" fill="none" stroke="#0A66C2" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <!-- LinkedIn icon (simplified) -->
  <rect x="14" y="22" width="20" height="20" rx="3" fill="none" stroke="#0A66C2" stroke-width="1.2" opacity="0.7" filter="url(#cl-glow)"/>
  <text x="24" y="38" text-anchor="middle" fill="#0A66C2" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12" font-weight="700">in</text>
  <!-- Text -->
  <text x="42" y="30" fill="#F0F4FF" font-family="'SF Pro Display',-apple-system,Inter,sans-serif" font-size="12" font-weight="600">LinkedIn</text>
  <text x="42" y="44" fill="#7B8DB0" font-family="monospace" font-size="8">vishnu-nimmakayala</text>
  <text x="184" y="34" text-anchor="middle" fill="#0A66C2" font-size="13" opacity="0.5">↗</text>
  <text x="100" y="68" text-anchor="middle" fill="#3D4F70" font-family="monospace" font-size="7" letter-spacing="1" opacity="0.45">CONNECT</text>
</svg>
